<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Skákací hra</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100svh;
      background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
      font-family: Arial, sans-serif;
      -webkit-tap-highlight-color: transparent; /* hezčí tap na iOS */
    }

    #gameContainer {
      text-align: center;
      width: min(94vw, 1000px);
      padding: clamp(8px, 2vw, 16px);
    }

    h1 {
      font-size: clamp(20px, 4.8vw, 42px);
      margin-bottom: 10px;
    }

    #score {
      font-size: clamp(16px, 3.6vw, 24px);
      font-weight: bold;
      color: #333;
      margin: 8px 0 10px;
    }

    /* >>> Hlavní změna: plně responzivní canvas */
    #gameCanvas {
      display: block;
      margin: 0 auto;
      border: 3px solid #333;
      background: linear-gradient(to bottom, #87CEEB 0%, #90EE90 80%, #8B7355 100%);
      max-width: 100%;
      width: 100%;
      aspect-ratio: 2 / 1;   /* zachová správný poměr 800x400 */
      height: auto;
      touch-action: manipulation;  /* méně delaye na mobilech */
    }

    #instructions {
      font-size: clamp(13px, 3.2vw, 18px);
      color: #555;
      margin: 10px 0;
    }

    #gameOver {
      display: none;
      font-size: clamp(22px, 5.6vw, 32px);
      font-weight: bold;
      color: #ff0000;
      margin: 10px 0;
    }

    button {
      font-size: clamp(14px, 3.6vw, 18px);
      padding: 10px 20px;
      margin: 10px;
      cursor: pointer;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
    }
    button:hover { background: #45a049; }
  </style>
</head>
<body>
  <div id="gameContainer">
    <h1>🎮 Skákací hra 🎮</h1>
    <div id="score">Skóre: 0</div>

    <!-- Canvas drží „logických“ 800x400, vizualně se škáluje přes CSS -->
    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <div id="instructions">Stiskni MEZERNÍK pro skok</div>
    <div id="gameOver">KONEC HRY!</div>
    <button id="restartBtn" style="display:none;">Restart</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const gameOverEl = document.getElementById('gameOver');
    const restartBtn = document.getElementById('restartBtn');
    const instructions = document.getElementById('instructions');

    // Na mobilech změň instrukci
    const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    if (isTouch) instructions.textContent = 'Klepni pro skok';

    let score = 0;
    let gameRunning = true;
    let frameCount = 0;

    // Logické rozměry (odpovídají width/height canvasu)
    const BASE_W = 800;
    const BASE_H = 400;
    const GROUND_TOP = 350;  // pozice horní hrany země
    const GROUND_H = 50;

    // Panáček
    const player = {
      x: 100,
      y: 300,
      width: 40,
      height: 50,
      velocityY: 0,
      jumping: false,
      gravity: 0.6,
      jumpPower: -13
    };

    // Překážky
    const obstacles = [];
    const obstacleTypes = ['🐕', '🌵', '👾', '🦖', '🌳', '🐍', '🦂', '🍄'];

    function createObstacle() {
      const type = obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];
      obstacles.push({
        x: BASE_W,
        y: GROUND_TOP - 40 + 0, // sedí na zemi
        width: 40,
        height: 40,
        speed: 5,
        emoji: type
      });
    }

    function drawPlayer() {
      ctx.font = '50px Arial';
      ctx.fillText('🏃', player.x, player.y + player.height);
    }

    function drawObstacles() {
      ctx.font = '40px Arial';
      obstacles.forEach(obs => {
        ctx.fillText(obs.emoji, obs.x, obs.y + obs.height);
      });
    }

    function drawGround() {
      // Zem
      ctx.fillStyle = '#8B7355';
      ctx.fillRect(0, GROUND_TOP, BASE_W, GROUND_H);

      // Tráva
      ctx.fillStyle = '#90EE90';
      for (let i = 0; i < BASE_W; i += 20) {
        ctx.fillRect(i, GROUND_TOP - 5, 10, 5);
      }
    }

    function update() {
      if (!gameRunning) return;

      frameCount++;

      // Gravitace
      player.velocityY += player.gravity;
      player.y += player.velocityY;

      // Kolize se zemí
      if (player.y >= GROUND_TOP - player.height) {
        player.y = GROUND_TOP - player.height;
        player.velocityY = 0;
        player.jumping = false;
      }

      // Vytvoření nové překážky
      if (frameCount % 100 === 0) {
        createObstacle();
        score++;
        scoreEl.textContent = `Skóre: ${score}`;
      }

      // Aktualizace překážek
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        o.x -= o.speed;

        // Detekce kolize
        if (
          player.x < o.x + o.width &&
          player.x + player.width > o.x &&
          player.y < o.y + o.height &&
          player.y + player.height > o.y
        ) {
          endGame();
        }

        // Mimo obraz
        if (o.x + o.width < 0) obstacles.splice(i, 1);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, BASE_W, BASE_H);

      // Obloha + louka + zem
      const gradient = ctx.createLinearGradient(0, 0, 0, BASE_H);
      gradient.addColorStop(0, '#87CEEB');
      gradient.addColorStop(0.8, '#90EE90');
      gradient.addColorStop(1, '#8B7355');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, BASE_W, BASE_H);

      drawGround();
      drawPlayer();
      drawObstacles();
    }

    function gameLoop() {
      update();
      draw();
      if (gameRunning) requestAnimationFrame(gameLoop);
    }

    function jump() {
      if (!player.jumping && player.y >= GROUND_TOP - player.height) {
        player.velocityY = player.jumpPower;
        player.jumping = true;
      }
    }

    function endGame() {
      gameRunning = false;
      gameOverEl.style.display = 'block';
      restartBtn.style.display = 'inline-block';
    }

    function restart() {
      score = 0;
      frameCount = 0;
      obstacles.length = 0;
      player.y = GROUND_TOP - player.height;
      player.velocityY = 0;
      player.jumping = false;
      gameRunning = true;
      gameOverEl.style.display = 'none';
      restartBtn.style.display = 'none';
      scoreEl.textContent = 'Skóre: 0';
      gameLoop();
    }

    // Ovládání
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && gameRunning) {
        e.preventDefault();
        jump();
      }
    });

    // Kliknutí i dotyk
    const jumpHandler = (e) => {
      if (gameRunning) {
        e.preventDefault();
        jump();
      }
    };
    canvas.addEventListener('click', jumpHandler, { passive: false });
    canvas.addEventListener('touchstart', jumpHandler, { passive: false });

    restartBtn.addEventListener('click', restart);

    // Start hry
    gameLoop();
  </script>
</body>
</html>

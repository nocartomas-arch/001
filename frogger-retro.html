<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frogger</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #2E8B57 0%, #3CB371 100%);
            font-family: 'Arial Black', Arial, sans-serif;
        }
        #gameContainer {
            text-align: center;
        }
        h1 {
            color: #FFD700;
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
        }
        #stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            gap: 20px;
        }
        .stat {
            background: linear-gradient(135deg, #228B22, #32CD32);
            color: white;
            padding: 12px 25px;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
        }
        #gameCanvas {
            border: 5px solid #228B22;
            background: #000;
            display: block;
            margin: 20px auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        button {
            font-size: 20px;
            padding: 15px 30px;
            margin: 10px;
            cursor: pointer;
            background: #228B22;
            color: white;
            border: none;
            border-radius: 15px;
            font-weight: bold;
        }
        button:hover {
            background: #32CD32;
        }
        #instructions {
            color: #FFD700;
            font-size: 16px;
            margin: 15px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        #gameOver {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(34, 139, 34, 0.95);
            padding: 40px;
            border: 5px solid #FFD700;
            border-radius: 20px;
            color: white;
            text-align: center;
            z-index: 100;
        }
        #gameOver h2 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #FFD700;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <h1>🐸 FROGGER 🐸</h1>
        <div id="stats">
            <div class="stat">🎯 Skóre: <span id="score">0</span></div>
            <div class="stat">❤️ Životy: <span id="lives">3</span></div>
            <div class="stat">⏱️ Čas: <span id="time">60</span></div>
        </div>
        <canvas id="gameCanvas" width="700" height="700"></canvas>
        <div id="instructions">⬆️⬇️⬅️➡️ ŠIPKY = pohyb | Dostaň žábu do cíle!</div>
        
        <button onclick="restart()">🔄 RESTART</button>
        <button onclick="window.location.href='index.html'">🏠 MENU</button>
        
        <div id="gameOver">
            <h2 id="gameOverTitle">🎮 KONEC HRY</h2>
            <div style="font-size: 24px; margin: 20px 0;">
                🎯 Finální skóre: <span id="finalScore">0</span>
            </div>
            <button onclick="restart()">🔄 ZKUSIT ZNOVU</button>
            <button onclick="window.location.href='index.html'">🏠 MENU</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const CELL = 50;
        const ROWS = 14;
        const COLS = 14;
        
        let score = 0;
        let lives = 3;
        let timeLeft = 60;
        let gameRunning = true;
        
        const frog = {
            x: 6,
            y: 13,
            size: 40
        };
        
        let cars = [];
        let logs = [];
        let goals = [];
        
        function initGame() {
            // Cíle nahoře
            goals = [];
            for (let i = 0; i < 5; i++) {
                goals.push({
                    x: i * 3 + 1,
                    y: 0,
                    reached: false
                });
            }
            
            // Auta na silnici (řádky 7-11)
            cars = [];
            for (let row = 7; row <= 11; row++) {
                const speed = (Math.random() * 2 + 1) * (row % 2 === 0 ? 1 : -1);
                const count = 2 + Math.floor(Math.random() * 2);
                for (let i = 0; i < count; i++) {
                    cars.push({
                        x: (i * COLS / count) % COLS,
                        y: row,
                        width: 2,
                        speed: speed,
                        color: ['#FF0000', '#0000FF', '#FFFF00', '#FF00FF'][Math.floor(Math.random() * 4)]
                    });
                }
            }
            
            // Klády na řece (řádky 2-5)
            logs = [];
            for (let row = 2; row <= 5; row++) {
                const speed = (Math.random() * 1.5 + 0.5) * (row % 2 === 0 ? 1 : -1);
                const count = 2;
                for (let i = 0; i < count; i++) {
                    logs.push({
                        x: (i * COLS / count) % COLS,
                        y: row,
                        width: 3 + Math.floor(Math.random() * 2),
                        speed: speed
                    });
                }
            }
        }
        
        function drawBackground() {
            // Cílová zóna (modrá)
            ctx.fillStyle = '#4169E1';
            ctx.fillRect(0, 0, canvas.width, CELL);
            
            // Řeka (modrá)
            ctx.fillStyle = '#1E90FF';
            ctx.fillRect(0, CELL, canvas.width, CELL * 5);
            
            // Bezpečná zóna (zelená)
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, CELL * 6, canvas.width, CELL);
            
            // Silnice (šedá)
            ctx.fillStyle = '#696969';
            ctx.fillRect(0, CELL * 7, canvas.width, CELL * 5);
            
            // Startovní zóna (zelená)
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, CELL * 12, canvas.width, CELL * 2);
            
            // Čáry na silnici
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 2;
            ctx.setLineDash([20, 20]);
            for (let i = 7; i < 12; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * CELL);
                ctx.lineTo(canvas.width, i * CELL);
                ctx.stroke();
            }
            ctx.setLineDash([]);
        }
        
        function drawGoals() {
            goals.forEach(goal => {
                const x = goal.x * CELL + CELL / 2;
                const y = goal.y * CELL + CELL / 2;
                
                if (goal.reached) {
                    ctx.fillStyle = '#FFD700';
                    ctx.font = '40px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('🐸', x, y + 15);
                } else {
                    ctx.fillStyle = '#32CD32';
                    ctx.beginPath();
                    ctx.arc(x, y, 20, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }
        
        function drawCars() {
            cars.forEach(car => {
                const x = car.x * CELL;
                const y = car.y * CELL + 5;
                
                ctx.fillStyle = car.color;
                ctx.fillRect(x, y, car.width * CELL - 10, CELL - 10);
                
                // Okna
                ctx.fillStyle = '#87CEEB';
                ctx.fillRect(x + 5, y + 5, car.width * CELL - 20, CELL - 20);
            });
        }
        
        function drawLogs() {
            logs.forEach(log => {
                const x = log.x * CELL;
                const y = log.y * CELL + 5;
                
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(x, y, log.width * CELL - 10, CELL - 10);
                
                // Textura dřeva
                ctx.strokeStyle = '#654321';
                ctx.lineWidth = 2;
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath();
                    ctx.moveTo(x, y + i * (CELL - 10) / 3);
                    ctx.lineTo(x + log.width * CELL - 10, y + i * (CELL - 10) / 3);
                    ctx.stroke();
                }
            });
        }
        
        function drawFrog() {
            const x = frog.x * CELL + CELL / 2;
            const y = frog.y * CELL + CELL / 2;
            
            ctx.fillStyle = '#32CD32';
            ctx.font = '40px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('🐸', x, y + 15);
        }
        
        function updateCars() {
            cars.forEach(car => {
                car.x += car.speed * 0.02;
                if (car.speed > 0 && car.x > COLS) car.x = -car.width;
                if (car.speed < 0 && car.x < -car.width) car.x = COLS;
            });
        }
        
        function updateLogs() {
            logs.forEach(log => {
                log.x += log.speed * 0.02;
                if (log.speed > 0 && log.x > COLS) log.x = -log.width;
                if (log.speed < 0 && log.x < -log.width) log.x = COLS;
            });
        }
        
        function checkCollisions() {
            // Kolize s auty
            if (frog.y >= 7 && frog.y <= 11) {
                let hit = false;
                cars.forEach(car => {
                    if (frog.x >= car.x && frog.x < car.x + car.width &&
                        frog.y === car.y) {
                        hit = true;
                    }
                });
                
                if (hit) {
                    loseLife();
                }
            }
            
            // Plavání na řece
            if (frog.y >= 2 && frog.y <= 5) {
                let onLog = false;
                logs.forEach(log => {
                    if (frog.x >= log.x && frog.x < log.x + log.width &&
                        frog.y === log.y) {
                        onLog = true;
                        frog.x += log.speed * 0.02;
                    }
                });
                
                if (!onLog || frog.x < 0 || frog.x >= COLS) {
                    loseLife();
                }
            }
            
            // Dosažení cíle
            if (frog.y === 0) {
                goals.forEach(goal => {
                    if (Math.abs(frog.x - goal.x) < 1 && !goal.reached) {
                        goal.reached = true;
                        score += 100;
                        updateScore();
                        resetFrog();
                        
                        if (goals.every(g => g.reached)) {
                            winLevel();
                        }
                    }
                });
                
                // Pokud není na cíli, spadne do vody
                if (!goals.some(g => Math.abs(frog.x - g.x) < 1)) {
                    loseLife();
                }
            }
        }
        
        function loseLife() {
            lives--;
            updateLives();
            if (lives <= 0) {
                endGame(false);
            } else {
                resetFrog();
            }
        }
        
        function resetFrog() {
            frog.x = 6;
            frog.y = 13;
        }
        
        function winLevel() {
            score += 500;
            timeLeft += 30;
            updateScore();
            initGame();
            resetFrog();
        }
        
        function updateScore() {
            document.getElementById('score').textContent = score;
        }
        
        function updateLives() {
            document.getElementById('lives').textContent = lives;
        }
        
        function updateTimer() {
            if (!gameRunning) return;
            
            timeLeft--;
            document.getElementById('time').textContent = timeLeft;
            
            if (timeLeft <= 0) {
                loseLife();
                timeLeft = 60;
            }
            
            setTimeout(updateTimer, 1000);
        }
        
        function endGame(won) {
            gameRunning = false;
            document.getElementById('gameOverTitle').textContent = won ? '🏆 VÍTĚZSTVÍ!' : '💀 GAME OVER';
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
        }
        
        function update() {
            if (!gameRunning) return;
            
            updateCars();
            updateLogs();
            checkCollisions();
        }
        
        function draw() {
            drawBackground();
            drawGoals();
            drawLogs();
            drawCars();
            drawFrog();
        }
        
        function gameLoop() {
            update();
            draw();
            if (gameRunning) {
                requestAnimationFrame(gameLoop);
            }
        }
        
        function moveFrog(dx, dy) {
            const newX = frog.x + dx;
            const newY = frog.y + dy;
            
            if (newX >= 0 && newX < COLS && newY >= 0 && newY < ROWS) {
                frog.x = newX;
                frog.y = newY;
                
                if (dy < 0) {
                    score += 10;
                    updateScore();
                }
            }
        }
        
        function restart() {
            score = 0;
            lives = 3;
            timeLeft = 60;
            gameRunning = true;
            
            document.getElementById('gameOver').style.display = 'none';
            
            updateScore();
            updateLives();
            document.getElementById('time').textContent = '60';
            
            initGame();
            resetFrog();
            updateTimer();
            gameLoop();
        }
        
        // Ovládání
        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;
            
            switch(e.key) {
                case 'ArrowUp':
                    e.preventDefault();
                    moveFrog(0, -1);
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    moveFrog(0, 1);
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    moveFrog(-1, 0);
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    moveFrog(1, 0);
                    break;
            }
        });
        
        // Start
        initGame();
        updateTimer();
        gameLoop();
    </script>
</body>
</html>

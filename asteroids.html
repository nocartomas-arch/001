<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteroids</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #000;
            font-family: 'Courier New', monospace;
        }
        #gameContainer { text-align: center; }
        h1 { color: #00FF00; font-size: 3em; margin-bottom: 10px; text-shadow: 0 0 20px #00FF00; }
        #stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            gap: 20px;
        }
        .stat {
            background: #000;
            color: #00FF00;
            padding: 10px 25px;
            border: 2px solid #00FF00;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
        }
        #gameCanvas {
            border: 3px solid #00FF00;
            background: #000;
            display: block;
            margin: 20px auto;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
        }
        button {
            font-size: 18px;
            padding: 12px 25px;
            margin: 10px;
            cursor: pointer;
            background: #00FF00;
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: bold;
        }
        button:hover { background: #00CC00; }
        #instructions { color: #00FF00; font-size: 14px; margin: 15px 0; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <h1>☄️ ASTEROIDS ☄️</h1>
        <div id="stats">
            <div class="stat">💎 <span id="score">0</span></div>
            <div class="stat">❤️ <span id="lives">3</span></div>
            <div class="stat">🚀 L<span id="level">1</span></div>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="instructions">⬅️ ➡️ = rotace | ⬆️ = pohyb | MEZERNÍK = střelba</div>
        <button onclick="restart()">🔄 RESTART</button>
        <button onclick="window.location.href='index.html'">🏠 MENU</button>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let score = 0, lives = 3, level = 1, gameRunning = true;
        const ship = {x: canvas.width / 2, y: canvas.height / 2, angle: 0, dx: 0, dy: 0, thrust: false};
        let bullets = [], asteroids = [], ufos = [];
        
        class Asteroid {
            constructor(x, y, size) {
                this.x = x || Math.random() * canvas.width;
                this.y = y || Math.random() * canvas.height;
                this.size = size || 3;
                this.angle = Math.random() * Math.PI * 2;
                this.dx = Math.cos(this.angle) * (4 - this.size);
                this.dy = Math.sin(this.angle) * (4 - this.size);
                this.radius = this.size * 15;
                this.points = [];
                for (let i = 0; i < 8; i++) {
                    this.points.push({
                        angle: (Math.PI * 2 / 8) * i,
                        distance: this.radius * (0.8 + Math.random() * 0.4)
                    });
                }
            }
            
            update() {
                this.x += this.dx;
                this.y += this.dy;
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }
            
            draw() {
                ctx.strokeStyle = '#00FF00';
                ctx.lineWidth = 2;
                ctx.beginPath();
                this.points.forEach((p, i) => {
                    const x = this.x + Math.cos(p.angle) * p.distance;
                    const y = this.y + Math.sin(p.angle) * p.distance;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.closePath();
                ctx.stroke();
            }
        }
        
        function initAsteroids() {
            asteroids = [];
            for (let i = 0; i < 3 + level; i++) {
                let x, y;
                do {
                    x = Math.random() * canvas.width;
                    y = Math.random() * canvas.height;
                } while (Math.hypot(x - ship.x, y - ship.y) < 100);
                asteroids.push(new Asteroid(x, y, 3));
            }
        }
        
        function drawShip() {
            ctx.save();
            ctx.translate(ship.x, ship.y);
            ctx.rotate(ship.angle);
            
            ctx.strokeStyle = '#00FF00';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(15, 0);
            ctx.lineTo(-10, -10);
            ctx.lineTo(-5, 0);
            ctx.lineTo(-10, 10);
            ctx.closePath();
            ctx.stroke();
            
            if (ship.thrust) {
                ctx.strokeStyle = '#FF6600';
                ctx.beginPath();
                ctx.moveTo(-5, -5);
                ctx.lineTo(-15, 0);
                ctx.lineTo(-5, 5);
                ctx.stroke();
            }
            
            ctx.restore();
        }
        
        function drawBullets() {
            ctx.fillStyle = '#FFFF00';
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, 2, 0, Math.PI * 2);
                ctx.fill();
            });
        }
        
        function updateShip() {
            if (ship.thrust) {
                ship.dx += Math.cos(ship.angle) * 0.1;
                ship.dy += Math.sin(ship.angle) * 0.1;
            }
            
            ship.dx *= 0.99;
            ship.dy *= 0.99;
            
            ship.x += ship.dx;
            ship.y += ship.dy;
            
            if (ship.x < 0) ship.x = canvas.width;
            if (ship.x > canvas.width) ship.x = 0;
            if (ship.y < 0) ship.y = canvas.height;
            if (ship.y > canvas.height) ship.y = 0;
        }
        
        function updateBullets() {
            bullets.forEach((b, i) => {
                b.x += b.dx;
                b.y += b.dy;
                b.life--;
                if (b.life <= 0 || b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                }
            });
        }
        
        function checkCollisions() {
            // Bullets vs Asteroids
            bullets.forEach((b, bi) => {
                asteroids.forEach((a, ai) => {
                    if (Math.hypot(b.x - a.x, b.y - a.y) < a.radius) {
                        bullets.splice(bi, 1);
                        asteroids.splice(ai, 1);
                        score += (4 - a.size) * 20;
                        document.getElementById('score').textContent = score;
                        
                        if (a.size > 1) {
                            asteroids.push(new Asteroid(a.x, a.y, a.size - 1));
                            asteroids.push(new Asteroid(a.x, a.y, a.size - 1));
                        }
                    }
                });
            });
            
            // Ship vs Asteroids
            asteroids.forEach(a => {
                if (Math.hypot(ship.x - a.x, ship.y - a.y) < a.radius + 10) {
                    lives--;
                    document.getElementById('lives').textContent = lives;
                    if (lives <= 0) {
                        gameRunning = false;
                        setTimeout(() => alert('Game Over! Skóre: ' + score), 100);
                    } else {
                        ship.x = canvas.width / 2;
                        ship.y = canvas.height / 2;
                        ship.dx = 0;
                        ship.dy = 0;
                    }
                }
            });
            
            if (asteroids.length === 0) {
                level++;
                document.getElementById('level').textContent = level;
                initAsteroids();
            }
        }
        
        function shoot() {
            bullets.push({
                x: ship.x + Math.cos(ship.angle) * 15,
                y: ship.y + Math.sin(ship.angle) * 15,
                dx: Math.cos(ship.angle) * 5 + ship.dx,
                dy: Math.sin(ship.angle) * 5 + ship.dy,
                life: 60
            });
        }
        
        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Stars
            ctx.fillStyle = '#FFF';
            for (let i = 0; i < 100; i++) {
                ctx.fillRect((i * 37) % canvas.width, (i * 53) % canvas.height, 1, 1);
            }
            
            asteroids.forEach(a => a.draw());
            drawBullets();
            drawShip();
        }
        
        function update() {
            if (!gameRunning) return;
            
            updateShip();
            updateBullets();
            asteroids.forEach(a => a.update());
            checkCollisions();
        }
        
        function gameLoop() {
            update();
            draw();
            if (gameRunning) requestAnimationFrame(gameLoop);
        }
        
        function restart() {
            score = 0;
            lives = 3;
            level = 1;
            bullets = [];
            ship.x = canvas.width / 2;
            ship.y = canvas.height / 2;
            ship.dx = 0;
            ship.dy = 0;
            ship.angle = 0;
            gameRunning = true;
            document.getElementById('score').textContent = '0';
            document.getElementById('lives').textContent = '3';
            document.getElementById('level').textContent = '1';
            initAsteroids();
            gameLoop();
        }
        
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.code === 'Space') {
                e.preventDefault();
                shoot();
            }
        });
        document.addEventListener('keyup', (e) => { keys[e.key] = false; });
        
        setInterval(() => {
            if (gameRunning) {
                if (keys['ArrowLeft']) ship.angle -= 0.1;
                if (keys['ArrowRight']) ship.angle += 0.1;
                ship.thrust = keys['ArrowUp'];
            }
        }, 16);
        
        initAsteroids();
        gameLoop();
    </script>
</body>
</html>

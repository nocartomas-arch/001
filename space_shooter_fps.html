<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Space Defender</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:#000;font-family:"Courier New",monospace;overflow:hidden
    }
    #gameContainer{position:relative;text-align:center}
    #gameCanvas{
      width:1000px;height:600px;border:3px solid #00ff00;background:#000;
      box-shadow:0 0 30px rgba(0,255,0,.5);display:block
    }
    #hud{
      position:absolute;inset:0 0 auto 0;padding:12px 20px;display:flex;
      justify-content:space-between;color:#00ff00;font-weight:bold;
      text-shadow:0 0 10px #00ff00;pointer-events:none;font-size:22px
    }
    #gameOver,#victory{
      display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
      background:rgba(0,0,0,.9);border:3px solid #00ff00;border-radius:12px;
      padding:36px;min-width:420px;color:#00ff00;text-align:center;z-index:10
    }
    #gameOver h2{color:#ff4040;text-shadow:0 0 16px #ff4040;font-size:42px;margin:0 0 10px}
    #victory h2{color:#00ff88;text-shadow:0 0 16px #00ff88;font-size:42px;margin:0 0 10px}
    .finalScore{color:#ffff00;font-size:28px;margin:14px 0}
    button{
      font-size:18px;padding:12px 24px;margin:8px;background:#00ff00;color:#000;
      border:none;border-radius:8px;cursor:pointer;font-weight:700;box-shadow:0 0 12px #00ff00
    }
    button:hover{background:#00d600}
    #instructions{color:#00ff00;margin-top:10px;text-shadow:0 0 5px #00ff00}
    #waveFlash{
      position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:64px;
      color:#00ff00;text-shadow:0 0 30px #00ff00;pointer-events:none;animation:pulse 1s ease-in-out
    }
    @keyframes pulse{0%,100%{opacity:0;transform:translate(-50%,-50%) scale(.6)}50%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="1000" height="600"></canvas>
    <div id="hud">
      <div>💚 HP: <span id="health">100</span></div>
      <div>🎯 SKÓRE: <span id="score">0</span></div>
      <div>🌊 VLNA: <span id="waveNum">1</span></div>
    </div>

    <div id="gameOver">
      <h2>💀 GAME OVER 💀</h2>
      <div class="finalScore">Skóre: <span id="finalScore">0</span></div>
      <button onclick="restart()">🔄 RESTART</button>
      <button onclick="goHome()">🏠 MENU</button>
    </div>

    <div id="victory">
      <h2>🏆 VÍTĚZSTVÍ! 🏆</h2>
      <div class="finalScore">Skóre: <span id="victoryScore">0</span></div>
      <button onclick="restart()">🔄 HRÁT ZNOVU</button>
      <button onclick="goHome()">🏠 MENU</button>
    </div>

    <div id="instructions">⬅️ ➡️ ŠIPKY = pohyb | ␣ MEZERNÍK = střelba</div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // ---------- Stav hry ----------
    let gameRunning = true;
    let score = 0;
    let health = 100;
    let wave = 1;

    // Počet v aktuální vlně + kolik zbývá vyřešit (zničeno NEBO prošlo)
    let enemiesInWave = 6;
    let remainingInWave = enemiesInWave;

    // ---------- Hráč (dělo) ----------
    const player = {
      x: canvas.width / 2,
      y: canvas.height - 28,
      speed: 8,
      width: 46,
      height: 26,
      shootCooldown: 180,
      canShoot: true
    };

    // ---------- Kolekce ----------
    const stars = []; const bullets = []; const enemies = []; const particles = []; const explosions = [];

    // Hvězdy pozadí
    for (let i = 0; i < 120; i++) {
      stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, s: Math.random() * 2 + 0.5, v: Math.random() * 0.6 + 0.2 });
    }

    // ---------- Pomocné ----------
    function flashWave() {
      const el = document.createElement('div');
      el.id = 'waveFlash'; el.textContent = `VLNA ${wave}`;
      document.getElementById('gameContainer').appendChild(el);
      setTimeout(() => el.remove(), 900);
      document.getElementById('waveNum').textContent = wave;
    }
    function updateHealth() {
      document.getElementById('health').textContent = health;
      if (health <= 0) endGame();
    }
    function updateScore() { document.getElementById('score').textContent = score; }

    // ---------- Příšera ----------
    class Enemy {
      constructor() {
        this.r = 20 + Math.random() * 16;
        this.x = 50 + Math.random() * (canvas.width - 100);
        this.y = -this.r - 20;
        this.v = 1.1 + Math.random() * 1.2 + wave * 0.18;
        this.hp = 1 + Math.floor(wave / 3);
        this.maxHp = this.hp;
        // „mimozemšťan“ – krabicoid s klepajícíma tykadlama
        this.hue = 260 + Math.floor(Math.random() * 80);
        this.wob = Math.random() * Math.PI * 2;
      }
      update() {
        this.y += this.v;
        this.wob += 0.09;
        return this.y < canvas.height + this.r + 10;
      }
      draw() {
        ctx.save(); ctx.translate(this.x, this.y);
        // tělo
        ctx.fillStyle = `hsl(${this.hue},100%,55%)`;
        ctx.shadowBlur = 18; ctx.shadowColor = `hsl(${this.hue},100%,55%)`;
        ctx.beginPath(); ctx.roundRect(-this.r, -this.r * 0.8, this.r * 2, this.r * 1.6, 8); ctx.fill();
        // oči
        ctx.shadowBlur = 0; ctx.fillStyle = "#000";
        ctx.beginPath(); ctx.arc(-this.r * 0.45, -this.r * 0.2, this.r * 0.18, 0, Math.PI * 2);
        ctx.arc(this.r * 0.45, -this.r * 0.2, this.r * 0.18, 0, Math.PI * 2); ctx.fill();
        // tykadla
        ctx.strokeStyle = `hsl(${this.hue},100%,65%)`; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(-this.r * 0.7, -this.r * 0.8);
        ctx.quadraticCurveTo(-this.r, -this.r * 1.1, -this.r * 0.7 + Math.sin(this.wob) * 6, -this.r * 1.3); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(this.r * 0.7, -this.r * 0.8);
        ctx.quadraticCurveTo(this.r, -this.r * 1.1, this.r * 0.7 + Math.cos(this.wob) * 6, -this.r * 1.3); ctx.stroke();

        // HP bar
        if (this.hp < this.maxHp) {
          const bw = this.r * 2, bh = 5;
          ctx.fillStyle = "#f33"; ctx.fillRect(-bw/2, -this.r*1.1, bw, bh);
          ctx.fillStyle = "#0f0"; ctx.fillRect(-bw/2, -this.r*1.1, bw * (this.hp / this.maxHp), bh);
        }
        ctx.restore();
      }
      hit() { this.hp--; spawnSparks(this.x, this.y, `hsl(${this.hue},100%,60%)`); return this.hp <= 0; }
    }

    // ---------- Střela ----------
    class Bullet {
      constructor(x, y) { this.x = x; this.y = y; this.v = 12; this.r = 3; }
      update() { this.y -= this.v; return this.y > -10; }
      draw() {
        ctx.fillStyle = "#ffff00"; ctx.shadowBlur = 10; ctx.shadowColor = "#ffff00";
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
      }
    }

    function spawnSparks(x, y, color) {
      for (let i = 0; i < 10; i++) {
        particles.push({ x, y, vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6, a:1, color });
      }
    }

    // ---------- Spawning ----------
    function spawnWave() {
      enemies.length = 0;
      remainingInWave = enemiesInWave;
      let spawned = 0;
      const timer = setInterval(() => {
        if (!gameRunning) { clearInterval(timer); return; }
        enemies.push(new Enemy());
        spawned++;
        if (spawned >= enemiesInWave) clearInterval(timer);
      }, 700);
      flashWave();
    }

    function nextWave() {
      wave++;
      if (wave > 10) { victory(); return; }
      enemiesInWave = 6 + wave * 2;
      spawnWave();
    }

    // ---------- Update/draw smyčka ----------
    function update() {
      if (!gameRunning) return;

      // Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        if (!bullets[i].update()) { bullets.splice(i, 1); continue; }
        for (let j = enemies.length - 1; j >= 0; j--) {
          const dx = bullets[i].x - enemies[j].x, dy = bullets[i].y - enemies[j].y;
          if (dx*dx + dy*dy < Math.pow(enemies[j].r + 2, 2)) {
            if (enemies[j].hit()) {
              score += 10 + wave * 2; updateScore();
              enemies.splice(j, 1); remainingInWave--;
              if (remainingInWave <= 0 && enemies.length === 0) setTimeout(nextWave, 900);
            }
            bullets.splice(i, 1); break;
          }
        }
      }

      // Enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        if (!enemies[i].update()) {
          // Prošel – ubere HP a počítá se jako „vyřešený“
          enemies.splice(i, 1); remainingInWave--;
          health -= 10; updateHealth();
          if (remainingInWave <= 0 && enemies.length === 0 && gameRunning) setTimeout(nextWave, 900);
        }
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i]; p.x += p.vx; p.y += p.vy; p.a -= 0.03; if (p.a <= 0) particles.splice(i, 1);
      }

      // Stars
      for (const s of stars) { s.y += s.v; if (s.y > canvas.height) { s.y = -2; s.x = Math.random() * canvas.width; } }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // stars
      for (const s of stars) { ctx.fillStyle = "#fff"; ctx.globalAlpha = 0.6; ctx.fillRect(s.x, s.y, s.s, s.s); }
      ctx.globalAlpha = 1;

      // particles
      for (const p of particles) { ctx.globalAlpha = Math.max(p.a, 0); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 3, 3); }
      ctx.globalAlpha = 1;

      // enemies
      enemies.forEach(e => e.draw());

      // bullets
      bullets.forEach(b => b.draw());

      // player gun
      drawGun();
    }

    function drawGun() {
      const gx = player.x, gy = player.y;
      // barrel
      ctx.fillStyle = "#777"; ctx.fillRect(gx - 12, gy - 46, 24, 46);
      // body
      ctx.fillStyle = "#9aa"; ctx.fillRect(gx - 23, gy - 20, 46, 26);
      // grip
      ctx.fillStyle = "#444"; ctx.fillRect(gx - 8, gy + 6, 16, 16);
    }

    function gameLoop() {
      update(); draw();
      if (gameRunning) requestAnimationFrame(gameLoop);
    }

    // ---------- Ovládání ----------
    const keys = {};
    document.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.code === 'Space' && gameRunning && player.canShoot) {
        bullets.push(new Bullet(player.x, player.y - 50));
        player.canShoot = false;
        setTimeout(() => player.canShoot = true, player.shootCooldown);
        e.preventDefault();
      }
    });
    document.addEventListener('keyup', e => { keys[e.key] = false; });

    setInterval(() => {
      if (!gameRunning) return;
      if (keys['ArrowLeft'])  player.x -= player.speed;
      if (keys['ArrowRight']) player.x += player.speed;
      player.x = Math.max(30, Math.min(canvas.width - 30, player.x));
    }, 16);

    // ---------- Start / konec / restart ----------
    function endGame(){
      gameRunning = false;
      document.getElementById('finalScore').textContent = score;
      document.getElementById('gameOver').style.display = 'block';
    }
    function victory(){
      gameRunning = false;
      document.getElementById('victoryScore').textContent = score;
      document.getElementById('victory').style.display = 'block';
    }
    function restart(){
      score = 0; health = 100; wave = 1;
      enemiesInWave = 6; remainingInWave = enemiesInWave;
      bullets.length = enemies.length = particles.length = explosions.length = 0;
      player.x = canvas.width/2; gameRunning = true;
      document.getElementById('gameOver').style.display = 'none';
      document.getElementById('victory').style.display = 'none';
      document.getElementById('health').textContent = health; updateScore(); flashWave();
      spawnWave(); gameLoop();
    }
    function goHome(){ window.location.href = 'index.html'; }

    // ---------- Init ----------
    document.getElementById('score').textContent = score;
    document.getElementById('health').textContent = health;
    flashWave(); spawnWave(); gameLoop();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Brick Breaker Extreme + Leaderboard</title>
<style>
  :root {
    --bg:#0b1020; --fg:#e9f1ff; --accent:#39c0ff; --accent2:#ffcb2f; --danger:#ff5d72;
    --card: #121938; --muted:#9ab3d3;
  }
  *{box-sizing:border-box} body{margin:0; font-family:system-ui,Segoe UI,Roboto,Arial;
    color:var(--fg); background: radial-gradient(1200px 600px at 50% -200px,#16325c 0%, #0b1020 60%)}
  .wrap{max-width:980px;margin:32px auto;padding:0 16px;text-align:center}
  h1{font-weight:800; letter-spacing:.02em; font-size:clamp(26px,4vw,44px); margin:8px 0 12px}
  .subtitle{color:var(--muted); margin-bottom:18px}
  .row{display:flex; gap:16px; align-items:flex-start; justify-content:center; flex-wrap:wrap}
  #gameCard{flex:1 1 640px; background:var(--card); border:1px solid #203056; border-radius:16px;
    box-shadow:0 10px 40px rgba(0,0,0,.35); padding:16px}
  #board{display:block; width:100%; max-width:800px; aspect-ratio:16/9; background:#050a17;
    border-radius:12px; border:1px solid #203056}
  #hud{display:flex; justify-content:space-between; margin:12px 4px 4px; color:var(--muted); font-weight:600}
  button{appearance:none; border:0; background:linear-gradient(180deg,var(--accent),#1aa9ef);
    color:#021224; font-weight:800; padding:10px 16px; border-radius:12px; cursor:pointer}
  button.secondary{background:#1e2b4d; color:var(--fg); border:1px solid #2a3e73}
  button.warn{background:linear-gradient(180deg,#ff8a8a,#ff556e); color:#290308}
  .menu{display:grid; gap:10px; grid-template-columns:repeat(2,minmax(180px,1fr)); justify-items:center; margin:12px 0}
  /* Leaderboard */
  #lbCard{flex:1 1 300px; background:var(--card); border:1px solid #203056; border-radius:16px; padding:16px}
  table{width:100%; border-collapse:separate; border-spacing:0 8px}
  th,td{text-align:left; padding:10px 12px; font-size:14px}
  th{color:#a8c1e9; font-weight:700}
  tr{background:#0f1734} tr.top1{background:#1a254d}
  td.rank{font-weight:900; color:var(--accent2); width:44px}
  td.score{font-weight:800}
  td.name{max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .muted{color:var(--muted)}
  /* Overlays */
  .overlay{position:fixed; inset:0; display:none; place-items:center; backdrop-filter:blur(3px);
           background:rgba(4,8,18,.55); z-index:20}
  .card{background:var(--card); border:1px solid #203056; border-radius:16px; padding:22px; width:min(520px,92vw)}
  .card h2{margin:0 0 8px}
  .inputRow{display:flex; gap:8px; margin:14px 0 6px}
  input[type=text]{flex:1; padding:10px 12px; border-radius:10px; border:1px solid #2a3e73;
                   background:#0e1531; color:var(--fg); font-weight:700}
  .pill{display:inline-block; padding:6px 10px; border-radius:999px; background:#10224a; color:#9ab3d3; font-weight:700}
</style>
</head>
<body>
  <div class="wrap">
    <h1>🧱 Brick Breaker Extreme</h1>
    <div class="subtitle">Rozbij všechny cihly – a zapiš se do tabulky nejlepších!</div>

    <div class="row">
      <section id="gameCard">
        <div id="hud">
          <div>Skóre: <b id="score">0</b></div>
          <div>Životy: <b id="lives">3</b></div>
          <div class="pill">Nejlepší: <span id="bestInline">0</span></div>
        </div>
        <canvas id="board" width="960" height="540"></canvas>

        <div class="menu">
          <button id="playBtn">▶️ Hrát</button>
          <button class="secondary" id="showLbBtn">🏆 Žebříček</button>
          <button class="secondary" id="pauseBtn" disabled>⏸️ Pauza</button>
          <button class="warn" id="resetLbBtn">🗑️ Vymazat žebříček</button>
        </div>
        <div class="muted">Ovládání: ⬅️ ➡️ pohyb pálky • 🅿️ nebo Esc = pauza</div>
      </section>

      <aside id="lbCard">
        <h2 style="margin:0 0 8px">🏆 Žebříček TOP 10</h2>
        <div class="muted" style="margin-bottom:8px">Ukládá se jen v tomto prohlížeči (localStorage).</div>
        <div id="leaderboardBox"></div>
      </aside>
    </div>
  </div>

  <!-- Modal – uložení výsledku -->
  <div id="saveModal" class="overlay">
    <div class="card">
      <h2>Gratuluju! Dostals se do TOP 10 🎉</h2>
      <div>Skóre: <b id="finalScoreLbl">0</b></div>
      <div class="inputRow">
        <input id="playerName" type="text" maxlength="20" placeholder="Tvoje jméno/přezdívka" />
        <button id="saveScoreBtn">Uložit</button>
      </div>
      <button class="secondary" id="skipSaveBtn">Neukládat</button>
    </div>
  </div>

  <!-- Modal – žebříček (lze otevřít z menu) -->
  <div id="lbModal" class="overlay">
    <div class="card">
      <h2>🏆 Žebříček TOP 10</h2>
      <div id="leaderboardModalBox"></div>
      <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:10px">
        <button class="secondary" id="closeLbBtn">Zavřít</button>
      </div>
    </div>
  </div>

<script>
/* =========================
   LEADERBOARD – localStorage
   ========================= */
const LB_KEY = "bbe_leaderboard_v1";
const NAME_KEY = "bbe_last_name";

function getLeaderboard(){
  const raw = localStorage.getItem(LB_KEY);
  return raw ? JSON.parse(raw) : [];
}
function setLeaderboard(list){
  localStorage.setItem(LB_KEY, JSON.stringify(list));
}
function qualifiesForTop10(score){
  const list = getLeaderboard();
  if (list.length < 10) return true;
  const worst = list[list.length-1]?.score ?? -Infinity;
  return score > worst;
}
function addScore(name, score){
  const now = new Date();
  const item = { name: name.trim() || "Anon", score, date: now.toISOString() };
  const list = getLeaderboard();
  list.push(item);
  // seřadit DESC a oříznout na 10
  list.sort((a,b)=>b.score - a.score);
  setLeaderboard(list.slice(0,10));
  // zapamatuj jméno pro příště
  localStorage.setItem(NAME_KEY, item.name);
}
function renderLeaderboard(targetEl){
  const list = getLeaderboard();
  if (!list.length){
    targetEl.innerHTML = `<div class="muted">Žádná skóre zatím nejsou. Zahraj si první hru!</div>`;
    return;
  }
  const rows = list.map((r,idx)=>`
    <tr class="${idx===0?'top1':''}">
      <td class="rank">#${idx+1}</td>
      <td class="name">${escapeHtml(r.name)}</td>
      <td class="score">${r.score}</td>
      <td class="muted">${formatDate(r.date)}</td>
    </tr>`).join("");
  targetEl.innerHTML = `
    <table>
      <thead><tr><th>#</th><th>Jméno</th><th>Skóre</th><th>Datum</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  // inline best
  document.getElementById("bestInline").textContent = list[0].score;
}
function resetLeaderboard(){
  localStorage.removeItem(LB_KEY);
  renderLeaderboard(document.getElementById("leaderboardBox"));
  renderLeaderboard(document.getElementById("leaderboardModalBox"));
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[m]));}
function formatDate(iso){
  const d = new Date(iso);
  const dd = String(d.getDate()).padStart(2,"0");
  const mm = String(d.getMonth()+1).padStart(2,"0");
  return `${dd}.${mm}.${d.getFullYear()}`;
}
/* ==============
   JÁDRO HRY (mini)
   ============== */
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");

let running=false, paused=false, rafId;
let score=0, lives=3;

const paddle = { w:120, h:16, x: canvas.width/2-60, y: canvas.height-26, speed:9 };
const ball   = { r:8, x: canvas.width/2, y: canvas.height-60, vx:5, vy:-5, speedUp:1.02 };
let keys={ArrowLeft:false, ArrowRight:false};

const BR = 9, BC = 13, B_MARGIN=6, B_W = (canvas.width - (BC+1)*B_MARGIN)/BC, B_H=20;
let bricks=[];

function initLevel(){
  bricks = [];
  for(let r=0;r<BR;r++){
    for(let c=0;c<BC;c++){
      bricks.push({
        x: B_MARGIN + c*(B_W+B_MARGIN),
        y: 60 + r*(B_H+B_MARGIN),
        w: B_W, h: B_H, hp: r<2?2:1
      });
    }
  }
}
function startGame(){
  score=0; lives=3; paused=false; running=true;
  ball.x=canvas.width/2; ball.y=canvas.height-60; ball.vx=5; ball.vy=-5;
  paddle.x = canvas.width/2 - paddle.w/2;
  initLevel(); loop();
}
function onGameOver(finalScore){
  running=false; cancelAnimationFrame(rafId);
  // LEADERBOARD – rozhodnutí o uložení
  if (qualifiesForTop10(finalScore)){
    document.getElementById("finalScoreLbl").textContent = finalScore;
    const last = localStorage.getItem(NAME_KEY) || "";
    document.getElementById("playerName").value = last;
    openModal("saveModal");
  } else {
    // jen obnov žebříček
    renderLeaderboard(document.getElementById("leaderboardBox"));
    openModal("lbModal");
  }
}
function loop(){
  if (!running){return;}
  rafId = requestAnimationFrame(loop);
  if (paused){ draw(); return; }

  // vstupy
  if (keys.ArrowLeft) paddle.x -= paddle.speed;
  if (keys.ArrowRight) paddle.x += paddle.speed;
  paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, paddle.x));

  // fyzika míčku
  ball.x += ball.vx; ball.y += ball.vy;

  // stěny
  if (ball.x-ball.r<0){ball.x=ball.r; ball.vx*=-1}
  if (ball.x+ball.r>canvas.width){ball.x=canvas.width-ball.r; ball.vx*=-1}
  if (ball.y-ball.r<0){ball.y=ball.r; ball.vy*=-1}

  // pád dolů
  if (ball.y - ball.r > canvas.height){
    lives--; livesEl.textContent = lives;
    if (lives<=0){ onGameOver(score); return; }
    // reset míčku
    ball.x=canvas.width/2; ball.y=canvas.height-60; ball.vx=5; ball.vy=-5;
  }

  // kolize s pálkou
  if (ball.y+ball.r>=paddle.y && ball.y-ball.r<=paddle.y+paddle.h &&
      ball.x>=paddle.x && ball.x<=paddle.x+paddle.w){
    // odraz s úhlem dle místa zásahu
    const hit = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2);
    const speed = Math.hypot(ball.vx, ball.vy) * ball.speedUp;
    const angle = hit * (Math.PI/3); // +-60°
    ball.vx = speed * Math.sin(angle);
    ball.vy = -Math.abs(speed * Math.cos(angle));
  }

  // kolize s cihlami
  for (let i=bricks.length-1;i>=0;i--){
    const b = bricks[i];
    if (ball.x+ball.r>=b.x && ball.x-ball.r<=b.x+b.w &&
        ball.y+ball.r>=b.y && ball.y-ball.r<=b.y+b.h){
      // zjednodušený odraz: invertuj vy s ohledem na strany
      const overlapL = ball.x+ball.r - b.x;
      const overlapR = (b.x+b.w) - (ball.x-ball.r);
      const overlapT = ball.y+ball.r - b.y;
      const overlapB = (b.y+b.h) - (ball.y-ball.r);
      const minOverlap = Math.min(overlapL, overlapR, overlapT, overlapB);
      if (minOverlap===overlapL || minOverlap===overlapR) ball.vx*=-1; else ball.vy*=-1;

      b.hp--; score += 10; scoreEl.textContent=score;
      if (b.hp<=0) bricks.splice(i,1);
    }
  }

  // výhra – žádné cihly
  if (bricks.length===0){ onGameOver(score); return; }

  draw();
}
function draw(){
  // pozadí
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const g = ctx.createLinearGradient(0,0,0,canvas.height);
  g.addColorStop(0,"#031028"); g.addColorStop(1,"#071a3d"); ctx.fillStyle=g;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // cihly
  for (const b of bricks){
    ctx.fillStyle = b.hp>1 ? "#ffcb2f" : "#39c0ff";
    ctx.fillRect(b.x, b.y, b.w, b.h);
  }
  // pálka
  ctx.fillStyle="#e2ecff"; ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
  // míček
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
  ctx.fillStyle="#ffffff"; ctx.fill();
}

/* ===========
   UI & akce
   =========== */
function openModal(id){ document.getElementById(id).style.display="grid"; }
function closeModal(id){ document.getElementById(id).style.display="none"; }

document.getElementById("playBtn").onclick = ()=>{ if(!running){ startGame(); } };
document.getElementById("showLbBtn").onclick = ()=>{ renderLeaderboard(document.getElementById("leaderboardModalBox")); openModal("lbModal"); };
document.getElementById("closeLbBtn").onclick = ()=> closeModal("lbModal");
document.getElementById("resetLbBtn").onclick = ()=>{
  if (confirm("Opravdu vymazat žebříček v tomto prohlížeči?")) resetLeaderboard();
};
document.getElementById("pauseBtn").onclick = (e)=>{
  if (!running) return;
  paused = !paused;
  e.target.textContent = paused ? "▶️ Pokračovat" : "⏸️ Pauza";
};

document.addEventListener("keydown",(e)=>{
  if (e.key==="ArrowLeft")  keys.ArrowLeft = true;
  if (e.key==="ArrowRight") keys.ArrowRight = true;
  if ((e.key==="p"||e.key==="P"||e.key==="Escape") && running){
    document.getElementById("pauseBtn").click();
  }
});
document.addEventListener("keyup",(e)=>{
  if (e.key==="ArrowLeft")  keys.ArrowLeft = false;
  if (e.key==="ArrowRight") keys.ArrowRight = false;
});

// Uložení výsledku
document.getElementById("saveScoreBtn").onclick = ()=>{
  const name = document.getElementById("playerName").value.trim();
  const s = parseInt(document.getElementById("finalScoreLbl").textContent,10);
  addScore(name || "Hráč", s);
  renderLeaderboard(document.getElementById("leaderboardBox"));
  renderLeaderboard(document.getElementById("leaderboardModalBox"));
  closeModal("saveModal");
  openModal("lbModal");
};
document.getElementById("skipSaveBtn").onclick = ()=>{ closeModal("saveModal"); openModal("lbModal"); };

// První render žebříčku
renderLeaderboard(document.getElementById("leaderboardBox"));
renderLeaderboard(document.getElementById("leaderboardModalBox"));
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 Plus</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #fad0c4 0%, #ffd1ff 100%);
            font-family: 'Arial Black', Arial, sans-serif;
        }
        #gameContainer {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #776e65;
            font-size: 4em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        .subtitle {
            color: #776e65;
            font-size: 1.2em;
            margin-bottom: 20px;
        }
        #stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        .stat-box {
            background: #bbada0;
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            min-width: 120px;
        }
        .stat-label {
            font-size: 14px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .stat-value {
            font-size: 32px;
            font-weight: bold;
        }
        #gameBoard {
            background: #bbada0;
            border-radius: 10px;
            padding: 15px;
            margin: 20px auto;
            width: 500px;
            height: 500px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        .cell {
            background: rgba(238, 228, 218, 0.35);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            transition: all 0.15s ease;
        }
        .tile {
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            animation: appear 0.2s;
        }
        @keyframes appear {
            from {
                transform: scale(0);
            }
            to {
                transform: scale(1);
            }
        }
        .tile-2 { background: #eee4da; color: #776e65; }
        .tile-4 { background: #ede0c8; color: #776e65; }
        .tile-8 { background: #f2b179; color: #f9f6f2; }
        .tile-16 { background: #f59563; color: #f9f6f2; }
        .tile-32 { background: #f67c5f; color: #f9f6f2; }
        .tile-64 { background: #f65e3b; color: #f9f6f2; }
        .tile-128 { background: #edcf72; color: #f9f6f2; font-size: 45px; }
        .tile-256 { background: #edcc61; color: #f9f6f2; font-size: 45px; }
        .tile-512 { background: #edc850; color: #f9f6f2; font-size: 45px; }
        .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 40px; }
        .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 40px; box-shadow: 0 0 30px #edc22e; }
        .tile-4096 { background: #3c3a32; color: #f9f6f2; font-size: 35px; }
        .tile-8192 { background: #3c3a32; color: #f9f6f2; font-size: 35px; }
        
        button {
            font-size: 20px;
            padding: 15px 30px;
            margin: 10px;
            cursor: pointer;
            background: #8f7a66;
            color: #f9f6f2;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            transition: all 0.1s;
        }
        button:hover {
            background: #9f8a76;
        }
        button:active {
            background: #8f7a66;
        }
        #gameOver, #victory {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(238, 228, 218, 0.98);
            padding: 50px;
            border: 5px solid #bbada0;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }
        #gameOver h2 {
            color: #776e65;
            font-size: 48px;
            margin-bottom: 20px;
        }
        #victory h2 {
            color: #f67c5f;
            font-size: 48px;
            margin-bottom: 20px;
            animation: victoryPulse 1s infinite;
        }
        @keyframes victoryPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .game-stats {
            font-size: 24px;
            margin: 20px 0;
            color: #776e65;
        }
        #instructions {
            margin: 20px 0;
            color: #776e65;
            font-size: 16px;
        }
        .arrow-keys {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            gap: 5px;
            justify-content: center;
            margin: 20px auto;
        }
        .arrow-key {
            width: 50px;
            height: 50px;
            background: #bbada0;
            color: white;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
        }
        .arrow-key.up { grid-column: 2; }
        .arrow-key.left { grid-column: 1; grid-row: 2; }
        .arrow-key.down { grid-column: 2; grid-row: 2; }
        .arrow-key.right { grid-column: 3; grid-row: 2; }
        
        @media (max-width: 600px) {
            #gameBoard {
                width: 320px;
                height: 320px;
                gap: 10px;
                padding: 10px;
            }
            .tile {
                font-size: 32px;
            }
            .tile-128, .tile-256, .tile-512 {
                font-size: 28px;
            }
            .tile-1024, .tile-2048 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <h1>2️⃣0️⃣4️⃣8️⃣</h1>
        <p class="subtitle">Spojuj čísla a dosáhni 2048!</p>
        
        <div id="stats">
            <div class="stat-box">
                <div class="stat-label">Skóre</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Nejlepší</div>
                <div class="stat-value" id="bestScore">0</div>
            </div>
        </div>
        
        <div id="gameBoard"></div>
        
        <div id="instructions">
            <p><strong>🎮 Ovládání:</strong></p>
            <div class="arrow-keys">
                <div class="arrow-key up">↑</div>
                <div class="arrow-key left">←</div>
                <div class="arrow-key down">↓</div>
                <div class="arrow-key right">→</div>
            </div>
            <p>Použij šipky pro pohyb dlaždic. Když se dvě dlaždice se stejným číslem dotknou, spojí se v jednu!</p>
        </div>
        
        <button onclick="newGame()">🎮 NOVÁ HRA</button>
        <button onclick="goHome()">🏠 MENU</button>
        
        <div id="gameOver">
            <h2>😢 KONEC HRY!</h2>
            <div class="game-stats">
                🎯 Finální skóre: <span id="finalScore">0</span><br>
                🏆 Nejvyšší dlaždice: <span id="highestTile">0</span>
            </div>
            <button onclick="newGame()">🔄 ZKUSIT ZNOVU</button>
            <button onclick="goHome()">🏠 MENU</button>
        </div>
        
        <div id="victory">
            <h2>🎉 DOSÁHL JSI 2048! 🎉</h2>
            <div class="game-stats">
                🎯 Tvoje skóre: <span id="victoryScore">0</span><br>
                ⭐ Úžasný výkon!
            </div>
            <button onclick="continueGame()">▶️ POKRAČOVAT</button>
            <button onclick="newGame()">🔄 NOVÁ HRA</button>
            <button onclick="goHome()">🏠 MENU</button>
        </div>
    </div>

    <script>
        let board = [];
        let score = 0;
        let bestScore = localStorage.getItem('bestScore2048') || 0;
        let gameActive = true;
        let victoryShown = false;
        
        const SIZE = 4;
        
        function initBoard() {
            board = Array(SIZE).fill().map(() => Array(SIZE).fill(0));
            score = 0;
            gameActive = true;
            victoryShown = false;
            
            document.getElementById('bestScore').textContent = bestScore;
            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('victory').style.display = 'none';
            
            addRandomTile();
            addRandomTile();
            renderBoard();
        }
        
        function addRandomTile() {
            const emptyCells = [];
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE; j++) {
                    if (board[i][j] === 0) {
                        emptyCells.push({ i, j });
                    }
                }
            }
            
            if (emptyCells.length > 0) {
                const { i, j } = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                board[i][j] = Math.random() < 0.9 ? 2 : 4;
            }
        }
        
        function renderBoard() {
            const boardEl = document.getElementById('gameBoard');
            boardEl.innerHTML = '';
            
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    if (board[i][j] !== 0) {
                        const tile = document.createElement('div');
                        tile.className = `tile tile-${board[i][j]}`;
                        tile.textContent = board[i][j];
                        cell.appendChild(tile);
                    }
                    
                    boardEl.appendChild(cell);
                }
            }
            
            document.getElementById('score').textContent = score;
        }
        
        function move(direction) {
            if (!gameActive) return;
            
            let moved = false;
            const oldBoard = board.map(row => [...row]);
            
            switch(direction) {
                case 'left':
                    moved = moveLeft();
                    break;
                case 'right':
                    moved = moveRight();
                    break;
                case 'up':
                    moved = moveUp();
                    break;
                case 'down':
                    moved = moveDown();
                    break;
            }
            
            if (moved) {
                addRandomTile();
                renderBoard();
                
                if (!victoryShown && hasWon()) {
                    victory();
                } else if (isGameOver()) {
                    endGame();
                }
                
                if (score > bestScore) {
                    bestScore = score;
                    localStorage.setItem('bestScore2048', bestScore);
                    document.getElementById('bestScore').textContent = bestScore;
                }
            }
        }
        
        function moveLeft() {
            let moved = false;
            for (let i = 0; i < SIZE; i++) {
                const row = board[i].filter(val => val !== 0);
                
                for (let j = 0; j < row.length - 1; j++) {
                    if (row[j] === row[j + 1]) {
                        row[j] *= 2;
                        score += row[j];
                        row.splice(j + 1, 1);
                    }
                }
                
                while (row.length < SIZE) {
                    row.push(0);
                }
                
                if (row.toString() !== board[i].toString()) {
                    moved = true;
                    board[i] = row;
                }
            }
            return moved;
        }
        
        function moveRight() {
            let moved = false;
            for (let i = 0; i < SIZE; i++) {
                const row = board[i].filter(val => val !== 0);
                
                for (let j = row.length - 1; j > 0; j--) {
                    if (row[j] === row[j - 1]) {
                        row[j] *= 2;
                        score += row[j];
                        row.splice(j - 1, 1);
                        j--;
                    }
                }
                
                while (row.length < SIZE) {
                    row.unshift(0);
                }
                
                if (row.toString() !== board[i].toString()) {
                    moved = true;
                    board[i] = row;
                }
            }
            return moved;
        }
        
        function moveUp() {
            let moved = false;
            for (let j = 0; j < SIZE; j++) {
                const col = [];
                for (let i = 0; i < SIZE; i++) {
                    if (board[i][j] !== 0) col.push(board[i][j]);
                }
                
                for (let i = 0; i < col.length - 1; i++) {
                    if (col[i] === col[i + 1]) {
                        col[i] *= 2;
                        score += col[i];
                        col.splice(i + 1, 1);
                    }
                }
                
                while (col.length < SIZE) {
                    col.push(0);
                }
                
                for (let i = 0; i < SIZE; i++) {
                    if (board[i][j] !== col[i]) {
                        moved = true;
                        board[i][j] = col[i];
                    }
                }
            }
            return moved;
        }
        
        function moveDown() {
            let moved = false;
            for (let j = 0; j < SIZE; j++) {
                const col = [];
                for (let i = 0; i < SIZE; i++) {
                    if (board[i][j] !== 0) col.push(board[i][j]);
                }
                
                for (let i = col.length - 1; i > 0; i--) {
                    if (col[i] === col[i - 1]) {
                        col[i] *= 2;
                        score += col[i];
                        col.splice(i - 1, 1);
                        i--;
                    }
                }
                
                while (col.length < SIZE) {
                    col.unshift(0);
                }
                
                for (let i = 0; i < SIZE; i++) {
                    if (board[i][j] !== col[i]) {
                        moved = true;
                        board[i][j] = col[i];
                    }
                }
            }
            return moved;
        }
        
        function hasWon() {
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE; j++) {
                    if (board[i][j] === 2048) return true;
                }
            }
            return false;
        }
        
        function isGameOver() {
            // Kontrola prázdných políček
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE; j++) {
                    if (board[i][j] === 0) return false;
                }
            }
            
            // Kontrola možných tahů
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE; j++) {
                    const current = board[i][j];
                    if ((i < SIZE - 1 && board[i + 1][j] === current) ||
                        (j < SIZE - 1 && board[i][j + 1] === current)) {
                        return false;
                    }
                }
            }
            
            return true;
        }
        
        function victory() {
            victoryShown = true;
            document.getElementById('victoryScore').textContent = score;
            document.getElementById('victory').style.display = 'block';
        }
        
        function continueGame() {
            document.getElementById('victory').style.display = 'none';
        }
        
        function endGame() {
            gameActive = false;
            
            let highestTile = 0;
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE; j++) {
                    if (board[i][j] > highestTile) {
                        highestTile = board[i][j];
                    }
                }
            }
            
            document.getElementById('finalScore').textContent = score;
            document.getElementById('highestTile').textContent = highestTile;
            document.getElementById('gameOver').style.display = 'block';
        }
        
        function newGame() {
            initBoard();
        }
        
        function goHome() {
            window.location.href = 'index.html';
        }
        
        // Ovládání
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowLeft':
                    e.preventDefault();
                    move('left');
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    move('right');
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    move('up');
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    move('down');
                    break;
            }
        });
        
        // Touch ovládání pro mobily
        let touchStartX = 0;
        let touchStartY = 0;
        
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });
        
        document.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            
            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;
            
            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                if (deltaX > 30) move('right');
                else if (deltaX < -30) move('left');
            } else {
                if (deltaY > 30) move('down');
                else if (deltaY < -30) move('up');
            }
        });
        
        // Start
        initBoard();
    </script>
</body>
</html>

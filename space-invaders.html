<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Space Defender</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;font-family:"Courier New",monospace;color:#0f0}
  #wrap{text-align:center;position:relative}
  h1{font-size:34px;text-shadow:0 0 18px #0f0}
  #hud{display:flex;gap:16px;justify-content:center;margin:8px 0}
  .stat{border:2px solid #0f0;padding:6px 12px;border-radius:8px;background:rgba(0,255,0,.12);text-shadow:0 0 8px #0f0;font-weight:700}
  canvas{display:block;margin:10px auto;border:3px solid #0f0;box-shadow:0 0 24px rgba(0,255,0,.5)}
  #hint{opacity:.9;margin-top:6px}
  .overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.9);z-index:5}
  .panel{border:3px solid #0f0;border-radius:16px;padding:28px 32px;box-shadow:0 0 30px #0f0}
  .panel h2{margin-bottom:12px}
  button{margin-top:12px;background:#0f0;color:#000;font-weight:700;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;box-shadow:0 4px 0 #0a0}
  button:hover{transform:translateY(-2px)}
</style>
</head>
<body>
  <div id="wrap">
    <h1>👾 SPACE DEFENDER 👾</h1>
    <div id="hud">
      <div class="stat">💎 SKÓRE: <span id="score">0</span></div>
      <div class="stat">🌊 VLNA: <span id="wave">1</span></div>
      <div class="stat">❤️ ŽIVOTY: <span id="lives">3</span></div>
    </div>

    <canvas id="c" width="960" height="600"></canvas>
    <div id="hint">⬅️ ➡️ šipky = pohyb | ␣ mezerník = střelba</div>

    <div id="gameover" class="overlay">
      <div class="panel">
        <h2>💀 GAME OVER</h2>
        <div>Skóre: <span id="finalScore">0</span></div>
        <div>Vlna: <span id="finalWave">1</span></div>
        <button id="btnRestart">Hrát znovu</button>
      </div>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  // --- STATE ---
  let score = 0, wave = 1, lives = 3, running = true;
  const keys = Object.create(null);
  const STAR_COUNT = 120;
  const stars = Array.from({length: STAR_COUNT}, (_,i)=>({
    x: (i*97)%canvas.width, y: (i*53)%canvas.height, s: (i%3)+1
  }));

  // player
  const player = { x: canvas.width/2-22, y: canvas.height-70, w: 44, h: 32, speed: 7, cooldown: 0 };

  // bullets & enemies
  const bullets = [];
  const enemyBullets = [];
  let enemies = [];
  let swarmDir = 1;      // 1 = right, -1 = left
  let swarmSpeed = 1.2;  // changes with wave
  let stepDown = false;  // when hitting wall
  let waveClearedHandled = false;

  // --- HELPERS ---
  function clamp(v,min,max){return Math.max(min, Math.min(max, v));}

  function resetGame(){
    score = 0; wave = 1; lives = 3; running = true;
    player.x = canvas.width/2-22; player.cooldown = 0;
    bullets.length = enemyBullets.length = 0;
    spawnWave();
    updateHUD();
    document.getElementById('gameover').style.display = 'none';
    requestAnimationFrame(loop);
  }

  function updateHUD(){
    document.getElementById('score').textContent = score;
    document.getElementById('wave').textContent = wave;
    document.getElementById('lives').textContent = lives;
  }

  // --- ENEMIES ---
  function spawnWave(){
    enemies = [];
    waveClearedHandled = false;
    const rows = clamp(3 + Math.floor(wave/2), 3, 8);
    const cols = clamp(8 + Math.floor(wave/3), 8, 12);
    const startX = 70, startY = 60, gapX = 64, gapY = 54;

    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        enemies.push({
          x: startX + c*gapX,
          y: startY + r*gapY,
          w: 40, h: 28,
          type: r%3, // 0/1/2 pro jiný tvar
          alive: true,
          anim: Math.random()*Math.PI*2,
          hp: 1 + Math.floor(wave/5),
          points: 10 + r*5 + wave*2
        });
      }
    }
    swarmDir = 1;
    swarmSpeed = 1.0 + wave*0.25;
  }

  function drawEnemy(e){
    ctx.save();
    ctx.translate(e.x + e.w/2, e.y + e.h/2);
    const wiggle = Math.sin(e.anim)*2;
    ctx.translate(0, wiggle);
    // barvy dle typu
    const colors = ['#ff59ff','#00e0ff','#ffc02d'];
    ctx.fillStyle = colors[e.type];
    ctx.shadowColor = colors[e.type]; ctx.shadowBlur = 14;

    // různé tvary
    if(e.type===0){
      // „krab“ – tělo + klepeta
      roundedRect(-20,-10,40,20,6);
      ctx.fill();
      ctx.fillRect(-18,12,8,6);
      ctx.fillRect(10,12,8,6);
    } else if(e.type===1){
      // „UFO“
      ctx.beginPath();
      ctx.ellipse(0,0,22,10,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#ffffff"; ctx.shadowBlur=0;
      ctx.fillRect(-8,-6,4,4); ctx.fillRect(4,-6,4,4);
      ctx.fillStyle=colors[e.type]; ctx.shadowBlur=10;
      ctx.fillRect(-16,10,32,4);
    } else {
      // „chobotnice“
      roundedRect(-18,-12,36,24,6); ctx.fill();
      ctx.fillRect(-12,12,4,8); ctx.fillRect(-2,12,4,8); ctx.fillRect(8,12,4,8);
    }
    ctx.restore();
  }

  function roundedRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  // --- INPUT ---
  window.addEventListener('keydown', (e)=>{
    if (e.code==='Space') e.preventDefault(); // neodskrolovat stránku
    keys[e.code] = true;
  });
  window.addEventListener('keyup', (e)=>{ keys[e.code] = false; });

  // --- GAME LOOP ---
  let last = 0;
  function loop(ts){
    if(!running) return;
    const dt = Math.min(32, ts - last); last = ts;

    update(dt);
    render();

    requestAnimationFrame(loop);
  }

  function update(dt){
    // stars parallax
    for(const s of stars){ s.y += s.s*0.1; if(s.y>canvas.height) s.y=0; }

    // player move
    const move = (keys['ArrowLeft']?-1:0) + (keys['ArrowRight']?1:0);
    player.x += move * player.speed;
    player.x = clamp(player.x, 10, canvas.width - player.w - 10);

    // shooting
    if (player.cooldown>0) player.cooldown -= dt;
    if (keys['Space'] && player.cooldown<=0){
      bullets.push({x: player.x+player.w/2-2, y: player.y-8, w:4, h:12, v:-9});
      player.cooldown = 140; // ms
    }

    // bullets
    for (let i=bullets.length-1;i>=0;i--){
      const b = bullets[i]; b.y += b.v;
      if (b.y < -20){ bullets.splice(i,1); continue; }
      // hit test
      for (let j=enemies.length-1;j>=0;j--){
        const e = enemies[j]; if (!e.alive) continue;
        if (b.x < e.x+e.w && b.x+b.w > e.x && b.y < e.y+e.h && b.y+b.h > e.y){
          e.hp--; bullets.splice(i,1);
          if (e.hp<=0){ e.alive=false; score += e.points; updateHUD(); }
          break;
        }
      }
    }

    // enemy swarm movement
    let hitEdge=false;
    for (const e of enemies){
      if(!e.alive) continue;
      e.anim += 0.06;
      e.x += swarmSpeed * swarmDir;
      if (e.x <= 10 || e.x + e.w >= canvas.width-10) hitEdge = true;
      if (e.y + e.h >= player.y){ gameOver(); return; }
    }
    if(hitEdge){ stepDown = true; }
    if(stepDown){
      for (const e of enemies){ if(e.alive) e.y += 22; }
      swarmDir *= -1; stepDown = false;
    }

    // occasional enemy shot (lehké)
    if (Math.random() < 0.012 + wave*0.001){
      const shooters = enemies.filter(e=>e.alive);
      if (shooters.length){
        const s = shooters[Math.floor(Math.random()*shooters.length)];
        enemyBullets.push({x:s.x+s.w/2-2, y:s.y+s.h, w:4, h:14, v:6});
      }
    }
    for (let i=enemyBullets.length-1;i>=0;i--){
      const b = enemyBullets[i]; b.y += b.v;
      if (b.y>canvas.height){ enemyBullets.splice(i,1); continue; }
      if (b.x < player.x+player.w && b.x+b.w > player.x && b.y < player.y+player.h && b.y+b.h > player.y){
        enemyBullets.splice(i,1); hitPlayer(); 
      }
    }

    // next wave?
    if (!waveClearedHandled && enemies.every(e=>!e.alive)){
      waveClearedHandled = true;
      setTimeout(()=>{ wave++; spawnWave(); updateHUD(); }, 900);
    }
  }

  function render(){
    // background
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
    // stars
    ctx.fillStyle = '#fff';
    for(const s of stars){ ctx.fillRect(s.x, s.y, s.s, s.s); }

    // shields? (vynecháno pro čistotu)

    // bullets
    ctx.fillStyle = '#ff0';
    bullets.forEach(b=> ctx.fillRect(b.x,b.y,b.w,b.h));
    ctx.fillStyle = '#f33';
    enemyBullets.forEach(b=> ctx.fillRect(b.x,b.y,b.w,b.h));

    // enemies
    enemies.forEach(e=>{ if(e.alive) drawEnemy(e); });

    // player ship
    drawPlayer();
  }

  function drawPlayer(){
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.fillStyle = '#0f0'; ctx.shadowColor='#0f0'; ctx.shadowBlur=16;
    ctx.beginPath();
    ctx.moveTo(player.w/2,0);
    ctx.lineTo(player.w, player.h);
    ctx.lineTo(0, player.h);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0; ctx.fillStyle='#0ff';
    ctx.beginPath(); ctx.arc(player.w/2, 14, 7, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function hitPlayer(){
    lives--; updateHUD();
    if (lives<=0) { gameOver(); }
  }

  function gameOver(){
    running = false;
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalWave').textContent  = wave;
    document.getElementById('gameover').style.display = 'flex';
  }

  // UI
  document.getElementById('btnRestart').addEventListener('click', resetGame);

  // start
  spawnWave();
  updateHUD();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gorilla Tower – skákačka</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(to bottom,#87CEEB 0%,#E0F6FF 100%);
    font-family:system-ui,-apple-system,Segoe UI,Arial,Helvetica,sans-serif;overflow:hidden
  }
  #wrap{position:relative}
  canvas{
    display:block;border:5px solid #8B4513;border-radius:8px;
    background:#ccecff;box-shadow:0 10px 40px rgba(0,0,0,.35)
  }
  #ui{position:absolute;inset:20px 20px auto 20px;display:flex;gap:12px;justify-content:space-between;pointer-events:none}
  .box{
    background:rgba(139,69,19,.95);color:#FFD700;border:3px solid #FFD700;border-radius:12px;
    padding:10px 16px;font-weight:800;text-shadow:1px 1px 2px #000
  }
  #msg{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    display:none;min-width:420px;text-align:center;padding:32px;border-radius:20px;
    background:rgba(139,69,19,.96);border:5px solid #FFD700;box-shadow:0 0 50px rgba(0,0,0,.6)
  }
  #msg h2{color:#FFD700;font-size:42px;margin-bottom:10px;text-shadow:3px 3px 6px #000}
  #msg p{color:#FFE4B5;font-size:20px;margin:10px 0 18px}
  #msg button{
    cursor:pointer;border:0;background:#FFD700;color:#8B4513;font-weight:900;border-radius:10px;
    padding:12px 20px;margin:0 6px;box-shadow:0 4px 0 #B8860B
  }
  #controls{
    position:absolute;left:50%;bottom:-58px;transform:translateX(-50%);
    background:rgba(255,228,181,.92);padding:8px 14px;border-radius:10px;color:#8B4513;font-size:14px
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="800" height="700" aria-label="herní plocha"></canvas>

  <div id="ui">
    <div class="box">🏆 <span id="score">0</span></div>
    <div class="box">🏢 PATRO: <span id="floor">0</span>/10</div>
    <div class="box">❤️ <span id="lives">3</span></div>
  </div>

  <div id="msg" role="dialog" aria-live="polite">
    <h2 id="msgTitle">Konec</h2>
    <p id="msgText"></p>
    <div>
      <button id="again">🔄 Zkusit znovu</button>
      <button id="menu">🏠 Menu</button>
    </div>
  </div>

  <div id="controls">⌨️ ŠIPKY / A-D = pohyb &nbsp;|&nbsp; MEZERNÍK = skok</div>
</div>

<script>
/* ====== Nastavení canvasu s DPI škálováním ====== */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resizeForDPI(){
  const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  const {width, height} = canvas.getBoundingClientRect();
  canvas.width  = Math.round(width  * dpr);
  canvas.height = Math.round(height * dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0); // logické pixely
}
resizeForDPI(); // jednou stačí (plátno má fixní CSS rozměr)
/* ====== UI ====== */
const ui = {
  scoreEl: document.getElementById('score'),
  floorEl: document.getElementById('floor'),
  livesEl: document.getElementById('lives'),
  msg: document.getElementById('msg'),
  msgTitle: document.getElementById('msgTitle'),
  msgText: document.getElementById('msgText'),
  again: document.getElementById('again'),
  menu: document.getElementById('menu')
};

/* ====== Stav hry ====== */
const WORLD = {
  floorGap: 180,   // vertikální rozestup pater
  floors: 10,
  marginX: 30,
};
const GRAV = 0.7;

let gameRunning = true;
let score = 0;
let lives = 3;
let currentFloor = 0;
let cameraY = 0;

const player = {
  x: 100, y: 600, w: 40, h: 50,
  vx: 0, vy: 0,
  speed: 6, jump:-18,
  onGround:false, dir:1
};

const platforms = []; // {x,y,w,h,type,floor,broken}
const coins = [];     // {x,y,r,got,bounce}
const obstacles = []; // {x,y,w,h,dir,speed,minX,maxX,emoji}
const particles = []; // {x,y,vx,vy,size,life,color}

const obstacleEmojis = ['🔨','🪛','🔧','⚡','🔥'];

/* ====== Generování levelu (světové souřadnice) ====== */
function genLevel(){
  platforms.length = coins.length = obstacles.length = particles.length = 0;
  currentFloor = 0; score = 0; lives = 3; cameraY = 0;

  // základní podlaha
  platforms.push({x:0, y:650, w:canvas.clientWidth, h:50, type:'ground', floor:0, broken:false});

  for(let f=1; f<=WORLD.floors; f++){
    const y = 650 - f*WORLD.floorGap;

    // plná podlaha každé třetí patro
    if (f % 3 === 0){
      platforms.push({x:0, y, w:canvas.clientWidth, h:20, type:'floor', floor:f, broken:false});
      for(let i=0;i<3;i++){
        coins.push({x:140 + i*250, y:y-40, r:12, got:false, bounce:0});
      }
    } else {
      const count = 3 + (Math.random()<0.5?0:1);
      const spacing = (canvas.clientWidth - 2*WORLD.marginX) / count;
      for(let i=0;i<count;i++){
        const pw = 140 + Math.random()*80;
        const px = WORLD.marginX + i*spacing + Math.random()*30;
        const py = y + Math.random()*25;
        platforms.push({x:px, y:py, w:pw, h:20, type:Math.random()>0.82?'break':'normal', floor:f, broken:false});
        if(Math.random()>0.35){
          coins.push({x:px+pw/2, y:py-40, r:12, got:false, bounce:0});
        }
      }
      if (f>3){
        const obsCount = Math.floor((f-2)/2);
        for(let i=0;i<obsCount;i++){
          const w=36,h=36;
          const ox = WORLD.marginX + Math.random()*(canvas.clientWidth-2*WORLD.marginX-w);
          obstacles.push({
            x:ox, y:y-70, w, h,
            dir: Math.random()>0.5?1:-1, speed:1.6+Math.random()*1.2,
            minX: WORLD.marginX, maxX: canvas.clientWidth-WORLD.marginX-w,
            emoji: obstacleEmojis[(Math.random()*obstacleEmojis.length)|0]
          });
        }
      }
    }
  }
}
genLevel();

/* ====== Vstup ====== */
const keys = new Set();
addEventListener('keydown', (e)=>{
  if (e.key === ' ') e.preventDefault();
  keys.add(e.key.toLowerCase());
  if ((e.key===' ' || e.key==='arrowup') && player.onGround){
    player.vy = player.jump; player.onGround=false;
  }
});
addEventListener('keyup', (e)=> keys.delete(e.key.toLowerCase()) );

/* ====== Aktualizace ====== */
function clamp(v,min,max){ return v<min?min:(v>max?max:v); }

function update(dt){
  if (!gameRunning) return;

  // vodorovný pohyb
  const left  = keys.has('arrowleft') || keys.has('a');
  const right = keys.has('arrowright')|| keys.has('d');
  player.vx = (right?player.speed:0) - (left?player.speed:0);
  if (right) player.dir = 1; else if (left) player.dir = -1;

  // gravitace
  player.vy += GRAV;
  player.x  += player.vx;
  player.y  += player.vy;

  // stěny
  const minX = WORLD.marginX, maxX = canvas.clientWidth - WORLD.marginX - player.w;
  player.x = clamp(player.x, minX, maxX);

  // kolize s platformami (z vrchu)
  player.onGround = false;
  for (const p of platforms){
    if (p.broken) continue;
    if (player.x + player.w > p.x && player.x < p.x + p.w){
      const wasAbove = (player.y + player.h - player.vy) <= p.y;
      if (wasAbove && player.y + player.h >= p.y && player.y + player.h <= p.y + p.h + 10 && player.vy >= 0){
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;

        if (p.type==='break' && !p.broken){
          setTimeout(()=>{ p.broken=true; spawnParticles(p.x+p.w/2,p.y,'#CD853F',20); }, 600);
        }
        if (p.floor && p.floor > currentFloor){
          currentFloor = p.floor;
          score += 100;
          if (currentFloor === WORLD.floors) win();
        }
      }
    }
  }

  // mince (kolizní kruh-obdélník)
  for (const c of coins){
    if (c.got) continue;
    const dx = (player.x+player.w/2) - c.x;
    const dy = (player.y+player.h/2) - c.y;
    const dist = Math.hypot(dx,dy);
    if (dist < Math.max(player.w,player.h)/2 + c.r){
      c.got = true; score += 50; spawnParticles(c.x,c.y,'#FFD700',14);
    }
  }

  // překážky
  for (const o of obstacles){
    o.x += o.speed*o.dir;
    if (o.x<o.minX || o.x>o.maxX){ o.dir *= -1; o.x = clamp(o.x,o.minX,o.maxX); }
    if (player.x + player.w > o.x && player.x < o.x+o.w && player.y + player.h > o.y && player.y < o.y + o.h){
      hit();
      break;
    }
  }

  // pád mimo obraz
  const worldBottom = 700; // základna
  const worldTop    = 650 - WORLD.floors*WORLD.floorGap;
  if (player.y > worldBottom + 150){ hit(); }
  cameraY = clamp(player.y - canvas.clientHeight/2, worldTop-120, 0);

  // částice
  for (let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.4; p.life--;
    if (p.life<=0) particles.splice(i,1);
  }

  // UI
  ui.scoreEl.textContent = score;
  ui.floorEl.textContent = currentFloor;
  ui.livesEl.textContent = lives;
}

function hit(){
  lives--;
  spawnParticles(player.x+player.w/2, player.y+player.h/2, '#ff3333', 24);
  if (lives<=0){ lose(); return; }
  // respawn
  player.x=100; player.y=600; player.vx=0; player.vy=0; cameraY=0;
}

function win(){
  gameRunning=false;
  showMsg('🎉 Vítězství!','Zachránil jsi dům. Finální skóre: '+score);
}
function lose(){
  gameRunning=false;
  showMsg('💥 Spadl jsi!','Skóre: '+score+' | Dosažené patro: '+currentFloor);
}

/* ====== Vykreslení – nejdřív vyčistit, pak globální translate kamery ====== */
function draw(){
  // smazat plátno (v logických px)
  ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);

  // pozadí oblohy
  const grad = ctx.createLinearGradient(0,0,0,canvas.clientHeight);
  grad.addColorStop(0,'#87CEEB'); grad.addColorStop(1,'#E0F6FF');
  ctx.fillStyle = grad; ctx.fillRect(0,0,canvas.clientWidth,canvas.clientHeight);

  // budova – boční sloupy a „okna“
  ctx.save();
  ctx.translate(0,-cameraY); // od teď kreslíme ve světových souřadnicích

  // boční sloupy
  ctx.fillStyle='#8B4513';
  ctx.fillRect(0,cameraY,30,canvas.clientHeight+400);
  ctx.fillRect(canvas.clientWidth-30,cameraY,30,canvas.clientHeight+400);

  // okna
  ctx.fillStyle='#FFD700';
  for(let y=Math.floor((cameraY-200)/100)*100; y<cameraY+canvas.clientHeight+200; y+=100){
    ctx.fillRect(10,y+20,10,15);
    ctx.fillRect(canvas.clientWidth-20,y+20,10,15);
    ctx.fillRect(10,y+60,10,15);
    ctx.fillRect(canvas.clientWidth-20,y+60,10,15);
  }

  // platformy
  for (const p of platforms){
    if (p.broken) continue;
    if (p.type==='ground' || p.type==='floor'){
      ctx.fillStyle='#8B4513';
      ctx.fillRect(p.x,p.y,p.w,p.h);
      ctx.strokeStyle='#654321'; ctx.lineWidth=2;
      for(let i=0;i<p.w;i+=40){ ctx.beginPath(); ctx.moveTo(p.x+i,p.y); ctx.lineTo(p.x+i,p.y+p.h); ctx.stroke(); }
    }else{
      ctx.fillStyle= (p.type==='break') ? '#CD853F' : '#D2691E';
      ctx.fillRect(p.x,p.y,p.w,p.h);
      ctx.strokeStyle='#8B4513'; ctx.lineWidth=3; ctx.strokeRect(p.x,p.y,p.w,p.h);
      if (p.type==='break'){ ctx.font='14px sans-serif'; ctx.fillStyle='#5a2f0a'; ctx.fillText('⚠️', p.x+p.w/2-8, p.y+15); }
    }
  }

  // mince
  for (const c of coins){
    if (c.got) continue;
    c.bounce += 0.1;
    const by = Math.sin(c.bounce)*4;
    ctx.beginPath();
    ctx.fillStyle='#FFD700';
    ctx.shadowColor='#FFD700'; ctx.shadowBlur=12;
    ctx.arc(c.x, c.y+by, c.r, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#C68000'; ctx.font='16px Arial'; ctx.textAlign='center';
    ctx.fillText('$', c.x, c.y+by+5);
    ctx.textAlign='left';
  }

  // překážky (emoji)
  ctx.font='32px Segoe UI Emoji, Apple Color Emoji';
  for (const o of obstacles){
    ctx.fillText(o.emoji, o.x, o.y+o.h-6);
  }

  // hráč
  ctx.save();
  if (player.dir<0){ ctx.translate(player.x*2+player.w,0); ctx.scale(-1,1); }
  const py = player.y;
  ctx.fillStyle='#FF6B6B'; ctx.fillRect(player.x, py+20, player.w, 30);        // tělo
  ctx.fillStyle='#FFD1A4'; ctx.beginPath();                                    // hlava
  ctx.arc(player.x+player.w/2, py+15, 15, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle='#FFD700'; ctx.beginPath();                                     // helma
  ctx.arc(player.x+player.w/2, py+10, 16, Math.PI, Math.PI*2); ctx.fill();
  ctx.fillStyle='#000'; ctx.fillRect(player.x+15, py+15, 3, 3);                 // oči
  ctx.fillRect(player.x+25, py+15, 3, 3);
  ctx.fillStyle='#4169E1';                                                     // nohy
  ctx.fillRect(player.x+8,  py+50, 10, 10);
  ctx.fillRect(player.x+22, py+50, 10, 10);
  ctx.restore();

  // částice
  for (const p of particles){
    ctx.globalAlpha = p.life/40;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  ctx.restore(); // konec translate
}

function spawnParticles(x,y,color,count=10){
  for(let i=0;i<count;i++){
    particles.push({
      x, y,
      vx:(Math.random()-0.5)*8, vy:(Math.random()-0.5)*8,
      size:2+Math.random()*5, color, life:40
    });
  }
}

/* ====== Game loop ====== */
let last=performance.now();
function loop(t=0){
  const dt = Math.min(33, t-last); last=t;
  update(dt/16.67);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ====== UI akce ====== */
function showMsg(title,text){
  ui.msgTitle.textContent=title;
  ui.msgText.textContent=text;
  ui.msg.style.display='block';
}
function hideMsg(){ ui.msg.style.display='none'; }

ui.again.onclick = ()=>{ hideMsg(); gameRunning=true; genLevel(); };
ui.menu.onclick  = ()=>{ window.location.href='index.html'; };

/* Externě využitelný restart (když bys chtěl) */
window.restart = ()=>{ hideMsg(); gameRunning=true; genLevel(); };

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turbo Racer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(180deg, #0a0a0a 0%, #1a1a2e 100%);
            font-family: 'Arial Black', Arial, sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            text-align: center;
            position: relative;
        }
        h1 {
            color: #FFD700;
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px #FF4500;
            animation: neon 1.5s infinite alternate;
        }
        @keyframes neon {
            from { text-shadow: 0 0 10px #FF4500, 0 0 20px #FF4500; }
            to { text-shadow: 0 0 20px #FF4500, 0 0 30px #FF4500, 0 0 40px #FF4500; }
        }
        #stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            gap: 20px;
        }
        .stat {
            background: linear-gradient(135deg, #FF4500, #FF6347);
            color: white;
            padding: 15px 30px;
            border-radius: 15px;
            font-size: 24px;
            font-weight: bold;
            border: 3px solid #FFD700;
            box-shadow: 0 5px 15px rgba(255, 69, 0, 0.5);
        }
        #gameCanvas {
            border: 5px solid #FFD700;
            background: #1a1a1a;
            display: block;
            margin: 20px auto;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.6);
        }
        #gameOver, #paused {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(26, 26, 46, 0.95);
            padding: 40px;
            border: 5px solid #FFD700;
            border-radius: 20px;
            color: #FFD700;
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.8);
            z-index: 100;
        }
        #gameOver h2 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #FF4500;
        }
        .game-stats {
            font-size: 24px;
            margin: 20px 0;
        }
        button {
            font-size: 20px;
            padding: 15px 30px;
            margin: 10px;
            cursor: pointer;
            background: linear-gradient(135deg, #FF4500, #FF6347);
            color: white;
            border: 3px solid #FFD700;
            border-radius: 15px;
            font-weight: bold;
            font-family: 'Arial Black', Arial, sans-serif;
            box-shadow: 0 5px 0 #B8860B;
            transition: all 0.1s;
        }
        button:hover {
            background: linear-gradient(135deg, #FF6347, #FF4500);
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #B8860B;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #B8860B;
        }
        #instructions {
            color: #FFD700;
            font-size: 16px;
            margin: 15px 0;
            text-shadow: 2px 2px 4px #000;
        }
        #speedometer {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 36px;
            color: #00FF00;
            text-shadow: 0 0 10px #00FF00;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <h1>🏎️ TURBO RACER 🏎️</h1>
        <div id="stats">
            <div class="stat">💰 Skóre: <span id="score">0</span></div>
            <div class="stat">🏁 Vzdálenost: <span id="distance">0</span>m</div>
            <div class="stat">⭐ Level: <span id="level">1</span></div>
        </div>
        <canvas id="gameCanvas" width="600" height="800"></canvas>
        <div id="speedometer">⚡ <span id="speed">0</span> km/h</div>
        <div id="instructions">⬅️ ➡️ ŠIPKY = řízení | 🔥 Vyhýbej se autům a sbírej mince!</div>
        
        <div id="gameOver">
            <h2>💥 HAVÁRIE! 💥</h2>
            <div class="game-stats">
                💰 Finální skóre: <span id="finalScore">0</span><br>
                🏁 Ujetá vzdálenost: <span id="finalDistance">0</span>m<br>
                ⭐ Dosažený level: <span id="finalLevel">1</span>
            </div>
            <button onclick="restart()">🔄 ZKUSIT ZNOVU</button>
            <button onclick="goHome()">🏠 MENU</button>
        </div>
        
        <div id="paused">
            <h2>⏸️ PAUZA</h2>
            <button onclick="togglePause()">▶️ POKRAČOVAT</button>
            <button onclick="restart()">🔄 RESTART</button>
            <button onclick="goHome()">🏠 MENU</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let gameRunning = true;
        let paused = false;
        let score = 0;
        let distance = 0;
        let level = 1;
        let speed = 5;
        let maxSpeed = 15;
        
        // Hráčovo auto
        const player = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 150,
            width: 50,
            height: 80,
            color: '#FF0000',
            speed: 8
        };
        
        // Nepřátelská auta
        let enemies = [];
        let coins = [];
        let particles = [];
        let roadLines = [];
        
        // Inicializace čar na silnici
        for (let i = 0; i < 10; i++) {
            roadLines.push({
                y: i * 100 - 50
            });
        }
        
        const enemyColors = ['#0000FF', '#00FF00', '#FFFF00', '#FF00FF', '#00FFFF', '#FFA500'];
        
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.velocityX = (Math.random() - 0.5) * 10;
                this.velocityY = (Math.random() - 0.5) * 10;
                this.size = Math.random() * 8 + 4;
                this.color = color;
                this.life = 40;
            }
            
            update() {
                this.x += this.velocityX;
                this.y += this.velocityY;
                this.life--;
            }
            
            draw() {
                ctx.globalAlpha = this.life / 40;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.globalAlpha = 1;
            }
        }
        
        function createEnemy() {
            const lane = Math.floor(Math.random() * 3);
            const x = 100 + lane * 150;
            
            enemies.push({
                x: x,
                y: -100,
                width: 50,
                height: 80,
                color: enemyColors[Math.floor(Math.random() * enemyColors.length)],
                speed: speed + Math.random() * 3
            });
        }
        
        function createCoin() {
            const lane = Math.floor(Math.random() * 3);
            const x = 125 + lane * 150;
            
            coins.push({
                x: x,
                y: -50,
                size: 25,
                collected: false,
                bounce: 0
            });
        }
        
        function createExplosion(x, y) {
            for (let i = 0; i < 30; i++) {
                particles.push(new Particle(x, y, ['#FF4500', '#FFD700', '#FF0000', '#FFA500'][Math.floor(Math.random() * 4)]));
            }
        }
        
        function drawRoad() {
            // Silnice
            ctx.fillStyle = '#333';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Krajnice
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, 0, 80, canvas.height);
            ctx.fillRect(canvas.width - 80, 0, 80, canvas.height);
            
            // Bílé čáry na silnici
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 5;
            ctx.setLineDash([30, 30]);
            
            roadLines.forEach(line => {
                line.y += speed;
                if (line.y > canvas.height) {
                    line.y = -50;
                }
                
                ctx.beginPath();
                ctx.moveTo(230, line.y);
                ctx.lineTo(230, line.y + 30);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(370, line.y);
                ctx.lineTo(370, line.y + 30);
                ctx.stroke();
            });
            
            ctx.setLineDash([]);
        }
        
        function drawCar(x, y, width, height, color) {
            // Tělo auta
            ctx.fillStyle = color;
            ctx.fillRect(x, y, width, height);
            
            // Střecha
            ctx.fillStyle = '#000';
            ctx.fillRect(x + 5, y + 20, width - 10, 30);
            
            // Okna
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(x + 8, y + 23, width - 16, 24);
            
            // Kola
            ctx.fillStyle = '#000';
            ctx.fillRect(x - 3, y + 10, 8, 15);
            ctx.fillRect(x + width - 5, y + 10, 8, 15);
            ctx.fillRect(x - 3, y + height - 25, 8, 15);
            ctx.fillRect(x + width - 5, y + height - 25, 8, 15);
            
            // Světla
            ctx.fillStyle = color === '#FF0000' ? '#FFFF00' : '#FFFFFF';
            ctx.fillRect(x + 10, y + height - 5, 10, 3);
            ctx.fillRect(x + width - 20, y + height - 5, 10, 3);
        }
        
        function drawPlayer() {
            drawCar(player.x, player.y, player.width, player.height, player.color);
            
            // Plameny z výfuku při vysoké rychlosti
            if (speed > 10) {
                ctx.fillStyle = '#FF4500';
                const flameSize = Math.random() * 10 + 5;
                ctx.fillRect(player.x + 15, player.y + player.height, 8, flameSize);
                ctx.fillRect(player.x + player.width - 23, player.y + player.height, 8, flameSize);
            }
        }
        
        function drawEnemies() {
            enemies.forEach(enemy => {
                drawCar(enemy.x, enemy.y, enemy.width, enemy.height, enemy.color);
            });
        }
        
        function drawCoins() {
            coins.forEach(coin => {
                if (!coin.collected) {
                    coin.bounce += 0.2;
                    const bounceY = Math.sin(coin.bounce) * 5;
                    
                    ctx.fillStyle = '#FFD700';
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#FFD700';
                    ctx.beginPath();
                    ctx.arc(coin.x, coin.y + bounceY, coin.size / 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    
                    ctx.fillStyle = '#FFA500';
                    ctx.font = 'bold 20px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('$', coin.x, coin.y + bounceY + 7);
                }
            });
        }
        
        function drawParticles() {
            particles.forEach(p => p.draw());
        }
        
        function updatePlayer() {
            // Omezení pohybu v rámci silnice
            if (player.x < 80) player.x = 80;
            if (player.x > canvas.width - 80 - player.width) player.x = canvas.width - 80 - player.width;
        }
        
        function updateEnemies() {
            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].y += enemies[i].speed;
                
                // Kolize s hráčem
                if (player.x < enemies[i].x + enemies[i].width &&
                    player.x + player.width > enemies[i].x &&
                    player.y < enemies[i].y + enemies[i].height &&
                    player.y + player.height > enemies[i].y) {
                    
                    createExplosion(player.x + player.width / 2, player.y + player.height / 2);
                    endGame();
                    return;
                }
                
                // Odstranění mimo obrazovku
                if (enemies[i].y > canvas.height) {
                    enemies.splice(i, 1);
                    score += 10;
                    updateScore();
                }
            }
        }
        
        function updateCoins() {
            for (let i = coins.length - 1; i >= 0; i--) {
                coins[i].y += speed;
                
                // Kolize s hráčem
                if (!coins[i].collected) {
                    const dx = (player.x + player.width / 2) - coins[i].x;
                    const dy = (player.y + player.height / 2) - coins[i].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 40) {
                        coins[i].collected = true;
                        score += 50;
                        updateScore();
                        createExplosion(coins[i].x, coins[i].y);
                    }
                }
                
                // Odstranění mimo obrazovku
                if (coins[i].y > canvas.height) {
                    coins.splice(i, 1);
                }
            }
        }
        
        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }
        
        function updateDistance() {
            distance += Math.floor(speed / 10);
            document.getElementById('distance').textContent = distance;
            
            // Zvýšení levelu a rychlosti
            const newLevel = Math.floor(distance / 500) + 1;
            if (newLevel > level) {
                level = newLevel;
                document.getElementById('level').textContent = level;
                if (speed < maxSpeed) {
                    speed += 0.5;
                }
            }
        }
        
        function updateScore() {
            document.getElementById('score').textContent = score;
        }
        
        function updateSpeed() {
            document.getElementById('speed').textContent = Math.floor(speed * 20);
        }
        
        let frameCount = 0;
        
        function update() {
            if (!gameRunning || paused) return;
            
            frameCount++;
            
            updatePlayer();
            updateEnemies();
            updateCoins();
            updateParticles();
            updateDistance();
            updateSpeed();
            
            // Spawn nepřátel
            if (frameCount % Math.max(60 - level * 5, 30) === 0) {
                createEnemy();
            }
            
            // Spawn mincí
            if (frameCount % 80 === 0) {
                createCoin();
            }
        }
        
        function draw() {
            drawRoad();
            drawCoins();
            drawEnemies();
            drawPlayer();
            drawParticles();
        }
        
        function gameLoop() {
            update();
            draw();
            if (gameRunning) {
                requestAnimationFrame(gameLoop);
            }
        }
        
        function endGame() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalDistance').textContent = distance;
            document.getElementById('finalLevel').textContent = level;
            document.getElementById('gameOver').style.display = 'block';
        }
        
        function togglePause() {
            paused = !paused;
            document.getElementById('paused').style.display = paused ? 'block' : 'none';
            if (!paused) {
                gameLoop();
            }
        }
        
        function restart() {
            score = 0;
            distance = 0;
            level = 1;
            speed = 5;
            frameCount = 0;
            enemies = [];
            coins = [];
            particles = [];
            player.x = canvas.width / 2 - 25;
            gameRunning = true;
            paused = false;
            
            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('paused').style.display = 'none';
            
            updateScore();
            document.getElementById('distance').textContent = '0';
            document.getElementById('level').textContent = '1';
            
            gameLoop();
        }
        
        function goHome() {
            window.location.href = 'index.html';
        }
        
        // Ovládání
        const keys = {};
        
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            
            if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
                if (gameRunning) togglePause();
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        setInterval(() => {
            if (gameRunning && !paused) {
                if (keys['ArrowLeft']) {
                    player.x -= player.speed;
                }
                if (keys['ArrowRight']) {
                    player.x += player.speed;
                }
            }
        }, 16);
        
        // Start
        gameLoop();
    </script>
</body>
</html>

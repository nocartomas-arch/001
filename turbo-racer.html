<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TURBO RACER</title>
<style>
  :root{
    --neon:#00ff6a; --neon-d:#0b9b4a; --panel:#0a0f0f; --road:#1b1f22; --lane:#9ea3aa33;
    --enemy:#a33535; --player:#0aa86e; --bolt:#ffe200;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:#0b0d10; color:#9affc6; font:600 16px/1.4 "Courier New",monospace;
    display:flex; align-items:center; justify-content:center;
  }
  .frame{
    width:min(1200px, 96vw); aspect-ratio:16/9; position:relative;
    box-shadow:0 0 0 6px #002b1b, 0 0 40px var(--neon);
    border-radius:10px; background:#050707;
  }
  canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
  .hud{position:absolute; inset:10px 10px auto 10px; display:flex; gap:10px; z-index:3}
  .tag{
    padding:.45rem .9rem; border:2px solid var(--neon); color:#c0ffd9; border-radius:10px;
    background:linear-gradient(180deg,#07110e,#040706); text-shadow:0 0 10px var(--neon);
    box-shadow:0 0 12px #003f2a inset, 0 0 18px #001e14;
  }
  .center{
    position:absolute; inset:0; display:grid; place-items:center; z-index:4; pointer-events:none;
  }
  .dialog{
    pointer-events:auto; padding:24px 32px; border:3px solid var(--neon);
    border-radius:14px; background:rgba(0,0,0,.9); color:#cfffdf;
    box-shadow:0 0 20px var(--neon); text-align:center; min-width:320px;
  }
  .title{font-size:22px; color:#aaffd6; text-shadow:0 0 12px var(--neon)}
  .btn{
    display:inline-block; margin-top:14px; padding:.6rem 1.2rem; font-weight:800;
    color:#00150c; background:var(--neon); border:0; border-radius:10px; cursor:pointer;
    box-shadow:0 6px 0 var(--neon-d); text-transform:uppercase; letter-spacing:.5px;
  }
  .btn:active{transform:translateY(2px); box-shadow:0 3px 0 var(--neon-d)}
</style>
</head>
<body>
  <div class="frame" id="game">
    <canvas id="c"></canvas>

    <div class="hud" id="hud">
      <div class="tag">🎮 Level: <span id="lv">1</span></div>
      <div class="tag">🚗 Rychlost: <span id="sp">80</span> km/h</div>
      <div class="tag">⚡ Boost: <span id="bo">0</span>%</div>
      <div class="tag">📏 Vzd.: <span id="di">0.00</span> km</div>
      <div class="tag">💥 Kolize: <span id="cr">0</span></div>
    </div>

    <div class="center" id="start">
      <div class="dialog">
        <div class="title">TURBO RACER</div>
        <p>Ovládání: ⬅️➡️ pruhy • ⬆️⬇️ jemná rychlost • vyhýbej se autům • seber ⚡ pro dočasný boost.</p>
        <button class="btn" id="btnStart">Start</button>
      </div>
    </div>

    <div class="center" id="gameover" style="display:none">
      <div class="dialog">
        <div class="title">KONEC HRY</div>
        <p id="summary"></p>
        <button class="btn" id="btnRestart">Hrát znovu</button>
      </div>
    </div>
  </div>

<script>
(() => {
  // --- Canvas & sizing ---
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  function fit(){
    const r = document.getElementById('game').getBoundingClientRect();
    canvas.width = Math.floor(r.width);
    canvas.height = Math.floor(r.height);
  }
  addEventListener('resize', fit); fit();

  // --- HUD ---
  const hud = {
    lv: document.getElementById('lv'),
    sp: document.getElementById('sp'),
    bo: document.getElementById('bo'),
    di: document.getElementById('di'),
    cr: document.getElementById('cr'),
    start: document.getElementById('start'),
    over: document.getElementById('gameover'),
    summary: document.getElementById('summary'),
  };

  // --- Road model ---
  const state = {
    running:false,
    lanes:6, roadPad:90, laneW:0, roadW:0, roadX:0,
    level:1, collisions:0, maxCollisions:5,
    speed:80, // km/h
    maxSpeed:220,
    minSpeed:60,
    targetSpeed:80,
    boost:0, // %
    boostTimer:0, // s
    distanceKm:0,
    cars:[],
    pickups:[],
    time: performance.now(),
    lastSpawn:0,
    trafficBase:1.1, // menší => řidší
  };

  // Player car
  const player = {
    lane:3, // 1..lanes
    x:0, y:0, w:0, h:0,
    color:'#0aa86e',
  };

  function resetGame(){
    state.running = false;
    state.level = 1;
    state.collisions = 0;
    state.speed = 80; state.targetSpeed = 80;
    state.distanceKm = 0; state.boost = 0; state.boostTimer = 0;
    state.cars.length = 0; state.pickups.length = 0;
    state.time = performance.now(); state.lastSpawn = 0;
    layoutRoad();
    placePlayer();
    updateHud();
    hud.over.style.display = 'none';
    hud.start.style.display = '';
  }

  function startGame(){
    hud.start.style.display = 'none';
    state.running = true;
    state.time = performance.now();
    requestAnimationFrame(loop);
  }

  function gameOver(){
    state.running = false;
    hud.summary.textContent =
      `Level: ${state.level} • Vzdálenost: ${state.distanceKm.toFixed(2)} km • `+
      `Max rychlost: ${Math.round(state.speed)} km/h • Kolize: ${state.collisions}`;
    hud.over.style.display = '';
  }

  function layoutRoad(){
    state.roadW = canvas.width - state.roadPad*2;
    state.roadX = Math.floor((canvas.width - state.roadW)/2);
    state.laneW = Math.floor(state.roadW / state.lanes);
  }

  function placePlayer(){
    player.w = Math.max(36, Math.floor(state.laneW*0.55));
    player.h = Math.floor(player.w*1.8);
    player.x = state.roadX + (player.lane-0.5)*state.laneW - player.w/2;
    player.y = canvas.height - player.h - 30;
  }

  // --- Input (continuous, no dead stop) ---
  const keys = {};
  addEventListener('keydown', (e) => {
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
    keys[e.key] = true;
    // lane snap on keydown for LR (arcade feel, no stuck)
    if (e.key === 'ArrowLeft'){ player.lane = Math.max(1, player.lane-1); placePlayer(); }
    if (e.key === 'ArrowRight'){ player.lane = Math.min(state.lanes, player.lane+1); placePlayer(); }
  }, {passive:false});
  addEventListener('keyup', e => { keys[e.key] = false; });

  // --- Helpers ---
  function rand(a,b){ return Math.random()*(b-a)+a; }

  function carSprite(x,y,w,h,color){
    // Body
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
    // Windows
    ctx.fillStyle = '#d0f7ee';
    ctx.fillRect(x+ w*0.2, y+h*0.12, w*0.6, h*0.18);
    ctx.fillRect(x+ w*0.2, y+h*0.42, w*0.6, h*0.18);
    // Bumpers
    ctx.fillStyle = '#0b0c0c';
    ctx.fillRect(x, y-3, w, 6);
    ctx.fillRect(x, y+h-3, w, 6);
    // Wheels
    const ww=Math.max(4,Math.floor(w*0.18));
    ctx.fillRect(x-ww, y+h*0.18, ww, h*0.18);
    ctx.fillRect(x+w,  y+h*0.18, ww, h*0.18);
    ctx.fillRect(x-ww, y+h*0.62, ww, h*0.18);
    ctx.fillRect(x+w,  y+h*0.62, ww, h*0.18);
  }

  function spawnTraffic(dt){
    state.lastSpawn += dt;
    const interval = Math.max(0.5, 1.8 - state.level*0.08); // řidší/rychlejší s levelem
    if (state.lastSpawn < interval) return;
    state.lastSpawn = 0;

    // pick: enemy or boost
    if (Math.random() < 0.12){ // ⚡
      const lane = 1 + (Math.random()*state.lanes|0);
      const w = Math.max(26, Math.floor(state.laneW*0.3));
      state.pickups.push({
        lane, x: state.roadX + (lane-0.5)*state.laneW - w/2,
        y: -40, w, h: w, kind:'bolt'
      });
      return;
    }

    // enemy car
    const lane = 1 + (Math.random()*state.lanes|0);
    const w = Math.max(34, Math.floor(state.laneW*0.52));
    const h = Math.floor(w*1.6);
    const speed = rand(45, 95) + state.level*3; // km/h (relative)
    state.cars.push({
      lane,
      x: state.roadX + (lane-0.5)*state.laneW - w/2,
      y: -h-10,
      w, h,
      color: ['#b04343','#a5326f','#b95a2e','#3b7bbb'][Math.random()*4|0],
      speed
    });
  }

  // --- Update & draw ---
  function loop(now){
    if (!state.running) return;
    const dt = Math.min(0.05, (now - state.time)/1000); // seconds
    state.time = now;

    update(dt);
    draw();

    requestAnimationFrame(loop);
  }

  function update(dt){
    layoutRoad(); // safe on resize

    // smooth speed to target + boost
    if (keys['ArrowUp']) state.targetSpeed = Math.min(state.maxSpeed, state.targetSpeed + 60*dt);
    if (keys['ArrowDown']) state.targetSpeed = Math.max(state.minSpeed, state.targetSpeed - 80*dt);
    const boostMul = 1 + state.boost*0.01;
    state.speed += (state.targetSpeed - state.speed)*0.08;
    const effectiveSpeed = state.speed*boostMul;

    // distance (km) – km/h * (s/3600)
    state.distanceKm += effectiveSpeed * (dt/3600);

    // level up každých 1.2 km
    const targetLevel = 1 + Math.floor(state.distanceKm / 1.2);
    if (targetLevel > state.level){
      state.level = targetLevel;
      state.targetSpeed = Math.min(state.maxSpeed, state.targetSpeed + 12);
    }

    // spawn
    spawnTraffic(dt);

    // move enemies (convert km/h to px/s: choose scale so 120 km/h ~ 520 px/s)
    const kmhToPx = 520/120;
    for (let i=state.cars.length-1;i>=0;i--){
      const e = state.cars[i];
      const rel = (e.speed - effectiveSpeed); // může jet rychleji/pomaleji
      e.y += (rel * kmhToPx) * dt;
      if (e.y > canvas.height + 40) state.cars.splice(i,1);
    }

    // pickups
    for (let i=state.pickups.length-1;i>=0;i--){
      const p = state.pickups[i];
      p.y += (180 - effectiveSpeed) * kmhToPx * dt; // lehce dolů
      if (p.y > canvas.height+30) state.pickups.splice(i,1);
      // collision
      if (rectsIntersect(player, p)){
        if (p.kind==='bolt'){ state.boost = 35; state.boostTimer = 3.5; }
        state.pickups.splice(i,1);
      }
    }

    // boost timer
    if (state.boostTimer>0){
      state.boostTimer -= dt;
      if (state.boostTimer<=0){ state.boostTimer=0; state.boost=0; }
    }

    // collisions with cars
    for (let i=0;i<state.cars.length;i++){
      const e = state.cars[i];
      if (rectsIntersect(player, e)){
        state.collisions++;
        // odskoč trochu a zpomal
        state.targetSpeed = Math.max(state.minSpeed, state.targetSpeed - 40);
        // odhození auta dál
        e.y += 40; 
        if (state.collisions >= state.maxCollisions){
          updateHud();
          draw(); // poslední snímek
          return gameOver();
        }
      }
    }

    updateHud();
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // background shoulder glow
    ctx.fillStyle = '#0b0d10';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    // road
    ctx.fillStyle = getComputedStyle(document.documentElement)
      .getPropertyValue('--road');
    ctx.fillRect(state.roadX, 0, state.roadW, canvas.height);

    // lane markers
    ctx.strokeStyle = getComputedStyle(document.documentElement)
      .getPropertyValue('--lane');
    ctx.lineWidth = 6;
    ctx.setLineDash([18,18]);
    for(let i=1;i<state.lanes;i++){
      const x = state.roadX + i*state.laneW;
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke();
    }
    ctx.setLineDash([]);

    // pickups
    for(const p of state.pickups){
      if (p.kind==='bolt'){
        drawBolt(p.x + p.w/2, p.y + p.h/2, Math.max(14, p.w*0.8));
      }
    }

    // enemy cars
    for(const e of state.cars) carSprite(e.x, e.y, e.w, e.h, e.color);

    // player
    carSprite(player.x, player.y, player.w, player.h, getComputedStyle(document.documentElement).getPropertyValue('--player'));

    // outer neon frame
    ctx.strokeStyle = '#00ff6a55';
    ctx.lineWidth = 8; ctx.strokeRect(6,6,canvas.width-12,canvas.height-12);
  }

  function drawBolt(cx, cy, s){
    const ctx2 = ctx;
    ctx2.save();
    ctx2.translate(cx,cy);
    ctx2.fillStyle = 'rgba(255,226,0,.95)';
    ctx2.beginPath();
    ctx2.moveTo(-s*0.2, -s*0.6);
    ctx2.lineTo(s*0.05, -s*0.05);
    ctx2.lineTo(-s*0.25, -s*0.05);
    ctx2.lineTo(s*0.2, s*0.6);
    ctx2.lineTo(-s*0.05, s*0.05);
    ctx2.lineTo(s*0.25, s*0.05);
    ctx2.closePath(); ctx2.fill();
    ctx2.restore();
  }

  function rectsIntersect(a,b){
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function updateHud(){
    hud.lv.textContent = state.level;
    hud.sp.textContent = Math.round(state.speed);
    hud.bo.textContent = Math.round(state.boost);
    hud.di.textContent = state.distanceKm.toFixed(2);
    hud.cr.textContent = state.collisions;
  }

  // adjust player position each time lane changes
  function snapLane(){
    player.x = state.roadX + (player.lane-0.5)*state.laneW - player.w/2;
  }

  // keep centered on resize
  addEventListener('resize', () => { layoutRoad(); snapLane(); });

  // Start/Restart
  document.getElementById('btnStart').onclick = () => { placePlayer(); startGame(); };
  document.getElementById('btnRestart').onclick = () => { resetGame(); };

  // init
  layoutRoad(); placePlayer(); resetGame();
})();
</script>
</body>
</html>

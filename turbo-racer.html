<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Turbo Racer</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      display:flex;justify-content:center;align-items:center;
      min-height:100vh;background:#0b0b0f;font-family:Arial,Helvetica,sans-serif;color:#0f0;
      overflow:hidden
    }
    #gameContainer{position:relative;text-align:center}
    h1{color:#0f0;text-shadow:0 0 12px #0f0;letter-spacing:1px;margin-bottom:8px}
    #gameCanvas{
      display:block;margin:10px auto;border:3px solid #0f0;box-shadow:0 0 24px rgba(0,255,0,.35);
      background:#1a1a1e
    }
    #hud{
      position:absolute;top:10px;left:10px;right:10px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;pointer-events:none
    }
    .stat{
      pointer-events:none; background:rgba(0,255,0,.08);border:1px solid #0f0;border-radius:10px;
      padding:8px 14px;font-weight:700;text-shadow:0 0 8px #0f0;min-width:140px
    }
    #gameOver,#startScreen{
      position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
      background:rgba(0,0,0,.65);backdrop-filter:blur(2px)
    }
    #gameOver{display:none}
    .panel{
      background:#101014;border:2px solid #0f0;border-radius:16px;padding:28px 28px;box-shadow:0 0 20px rgba(0,255,0,.25);min-width:340px;color:#e5ffe5
    }
    .panel h2{color:#0f0;margin-bottom:8px;text-shadow:0 0 12px #0f0}
    .btn{
      margin-top:12px;font-weight:700;cursor:pointer;border:none;border-radius:10px;padding:12px 20px;
      background:#0f0;color:#000;box-shadow:0 6px 0 #0a9e0a;transition:transform .06s ease,box-shadow .06s ease
    }
    .btn:hover{transform:translateY(-2px);box-shadow:0 8px 0 #0a9e0a}
    .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #0a9e0a}
    #message{
      position:absolute;top:60px;left:50%;transform:translateX(-50%);color:#fff;text-shadow:0 0 10px #fff;
      font-weight:700;font-size:18px;opacity:0;transition:opacity .25s ease
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <h1>TURBO RACER</h1>
    <!-- širší okno, více pruhů: 1200 x 600 -->
    <canvas id="gameCanvas" width="1200" height="600"></canvas>

    <div id="hud">
      <div class="stat">🏁 Level: <span id="level">1</span></div>
      <div class="stat">🚗 Rychlost: <span id="speed">120</span> km/h</div>
      <div class="stat">📏 Vzdálenost: <span id="distance">0.00</span> km</div>
      <div class="stat">⚡ Boost: <span id="boost">0%</span></div>
      <div class="stat">💥 Kolize: <span id="crashes">0</span></div>
    </div>

    <div id="message"></div>

    <div id="startScreen">
      <div class="panel">
        <h2>Připraven?</h2>
        <p>Šipky: ← → mezi pruhy, ↑/↓ rychlý posun po okně (vpřed/vzad).<br>
          Vyhýbej se provozu a sbírej ⚡ pro dočasný turbo boost.</p>
        <button class="btn" id="startBtn">START</button>
      </div>
    </div>

    <div id="gameOver">
      <div class="panel">
        <h2>KONEC HRY</h2>
        <p>Level: <span id="finalLevel">1</span> • Vzdálenost: <span id="finalDistance">0.00</span> km</p>
        <p>Max rychlost: <span id="finalSpeed">0</span> km/h • Kolize: <span id="finalCrashes">0</span></p>
        <button class="btn" id="restartBtn">HRÁT ZNOVU</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // ----- Parametry dálnice -----
    const LANES = 6;                         // více pruhů
    const ROAD_MARGIN = 150;                 // okraje trávy
    const ROAD_WIDTH = canvas.width - ROAD_MARGIN*2;
    const LANE_W = ROAD_WIDTH / LANES;

    // ----- Hráč -----
    const player = {
      lane: Math.floor(LANES/2),
      x: 0, y: 0, w: LANE_W*0.6, h: 80,
      color: '#00ff88',
      vx: 0, vy: 0,
      maxSideSpeed: 9, maxVertSpeed: 12
    };

    // ----- Hra / fyzika -----
    let running = false;
    let level = 1;
    let baseSpeed = 120;        // km/h (základ)
    let speed = baseSpeed;      // aktuální (km/h)
    let pxPerMs = 0;            // přepočet na pixely (z km/h)
    let distanceKm = 0;         // ujetá vzdálenost v km
    let crashes = 0;

    // levelování podle vzdálenosti
    const LEVEL_DISTANCE_STEP = 1.5; // každých 1.5 km level up
    let nextLevelAt = LEVEL_DISTANCE_STEP;

    // turbo boost po ⚡
    let boostTime = 0;          // ms zbývajícího boostu
    const BOOST_ADD = 3000;     // 3s za jeden blesk
    const BOOST_FACTOR = 1.35;

    // spawn
    const cars = [];
    const pickups = []; // ⚡
    let lastSpawnCar = 0;
    let lastSpawnPickup = 0;

    // vstup
    const keys = {};
    document.addEventListener('keydown', e => keys[e.key] = true);
    document.addEventListener('keyup',   e => keys[e.key] = false);

    // HUD
    const elLevel = document.getElementById('level');
    const elSpeed = document.getElementById('speed');
    const elDist  = document.getElementById('distance');
    const elBoost = document.getElementById('boost');
    const elCr    = document.getElementById('crashes');

    const elMsg   = document.getElementById('message');

    // Start/Restart
    document.getElementById('startBtn').onclick = startGame;
    document.getElementById('restartBtn').onclick = () => {
      document.getElementById('gameOver').style.display = 'none';
      startGame();
    };

    // Přepočet rychlosti km/h -> px/ms (poměrné, vizelní)
    function speedToPxPerMs(kmh){
      // 1 "vizuální kilometr" = 1800 px;  km/h -> px/h -> px/ms
      return (kmh * 1800) / (60*60*1000);
    }

    function laneCenter(l){ return ROAD_MARGIN + l*LANE_W + LANE_W/2; }

    function resetState(){
      level = 1;
      baseSpeed = 120;
      speed = baseSpeed;
      pxPerMs = speedToPxPerMs(speed);
      distanceKm = 0;
      nextLevelAt = LEVEL_DISTANCE_STEP;
      crashes = 0;
      cars.length = 0;
      pickups.length = 0;
      boostTime = 0;
      player.lane = Math.floor(LANES/2);
      player.x = laneCenter(player.lane) - player.w/2;
      player.y = canvas.height - 120;
      player.vx = player.vy = 0;
      lastSpawnCar = lastSpawnPickup = 0;
      updateHUD();
    }

    function startGame(){
      resetState();
      running = true;
      document.getElementById('startScreen').style.display = 'none';
      lastTime = performance.now();
      requestAnimationFrame(loop);
      popMsg('GO!');
    }

    function gameOver(){
      running = false;
      document.getElementById('finalLevel').textContent = level;
      document.getElementById('finalDistance').textContent = distanceKm.toFixed(2);
      document.getElementById('finalSpeed').textContent = Math.round(speed);
      document.getElementById('finalCrashes').textContent = crashes;
      document.getElementById('gameOver').style.display = 'flex';
    }

    // ---------- Spawny ----------
    function spawnCar(){
      const w = LANE_W*0.58;
      const h = 86;
      const lane = Math.floor(Math.random()*LANES);
      const x = laneCenter(lane) - w/2;
      const y = -h - 20;

      // rychlost překážek roste s levelem
      const minKmh = 90 + level*6;
      const maxKmh = 140 + level*10;
      const carSpeed = (Math.random()*(maxKmh-minKmh)+minKmh);
      const vy = speedToPxPerMs(carSpeed);

      cars.push({x,y,w,h,lane,vy,color:'#ff2d55'});
    }

    function spawnPickup(){
      // ⚡ v náhodném pruhu, pomaleji než auta (aby se daly sebrat)
      const size = 28;
      const lane = Math.floor(Math.random()*LANES);
      const x = laneCenter(lane) - size/2;
      const y = -size - 10;
      const vy = speedToPxPerMs(80 + level*5);
      pickups.push({x,y,w:size,h:size,lane,vy});
    }

    // ---------- Update / Draw ----------
    let lastTime = 0;

    function loop(t){
      if(!running) return;
      const dt = Math.min(32, t - lastTime); // ms (cap pro stabilitu)
      lastTime = t;

      update(dt);
      draw();

      requestAnimationFrame(loop);
    }

    function update(dt){
      // řízení hráče
      const side = (keys['ArrowLeft']?-1:0) + (keys['ArrowRight']?1:0);
      const vert = (keys['ArrowUp']?-1:0) + (keys['ArrowDown']?1:0);

      player.vx = side * player.maxSideSpeed;
      player.vy = vert * player.maxVertSpeed;

      player.x += player.vx;
      player.y += player.vy;

      // mantinely v rámci silnice a okna
      const minX = ROAD_MARGIN + 6;
      const maxX = ROAD_MARGIN + ROAD_WIDTH - player.w - 6;
      player.x = Math.max(minX, Math.min(maxX, player.x));
      player.y = Math.max(60, Math.min(canvas.height - 120, player.y));

      // boost
      if (boostTime > 0){
        boostTime -= dt;
        speed = baseSpeed * BOOST_FACTOR;
        if (boostTime <= 0){
          speed = baseSpeed;
          boostTime = 0;
        }
      }

      // level up podle vzdálenosti
      const pxPerMsNow = speedToPxPerMs(speed);
      pxPerMs = pxPerMsNow;
      distanceKm += (pxPerMsNow * dt) / 1800; // (px / 1800) = km
      if (distanceKm >= nextLevelAt){
        level++;
        baseSpeed += 8; // každým levelem vyšší základ
        speed = (boostTime>0) ? baseSpeed*BOOST_FACTOR : baseSpeed;
        nextLevelAt += LEVEL_DISTANCE_STEP;
        popMsg(`LEVEL ${level}`);
      }

      // Spawny
      lastSpawnCar += dt;
      lastSpawnPickup += dt;
      const carEvery = Math.max(350 - level*20, 120);    // čím vyšší level, tím častěji
      const pickEvery = 2200 + Math.max(0, 1200 - level*80);
      if (lastSpawnCar >= carEvery){ spawnCar(); lastSpawnCar = 0; }
      if (lastSpawnPickup >= pickEvery){ spawnPickup(); lastSpawnPickup = 0; }

      // Posun aut a pickupů
      for (let i = cars.length-1; i>=0; i--){
        cars[i].y += cars[i].vy * (dt);
        if (cars[i].y - cars[i].h > canvas.height) cars.splice(i,1);
      }
      for (let i = pickups.length-1; i>=0; i--){
        pickups[i].y += pickups[i].vy * (dt);
        if (pickups[i].y - pickups[i].h > canvas.height) pickups.splice(i,1);
      }

      // Kolize
      for (let i = cars.length-1; i>=0; i--){
        if (rectsOverlap(player, cars[i])){
          crashes++;
          popMsg('KOLIZE!');
          // penalizace rychlosti
          baseSpeed = Math.max(80, baseSpeed - 10);
          speed = (boostTime>0) ? baseSpeed*BOOST_FACTOR : baseSpeed;
          // odskočení auta i hráče
          cars.splice(i,1);
          player.y += 40;
        }
      }
      for (let i = pickups.length-1; i>=0; i--){
        if (rectsOverlap(player, pickups[i])){
          boostTime += BOOST_ADD;
          popMsg('⚡ TURBO!');
          pickups.splice(i,1);
        }
      }

      // konec hry – příliš mnoho kolizí
      if (crashes >= 5){ gameOver(); }

      updateHUD();
    }

    function updateHUD(){
      elLevel.textContent = level;
      elSpeed.textContent = Math.round(speed);
      elDist.textContent  = distanceKm.toFixed(2);
      elBoost.textContent = Math.round((boostTime/1000)/3*100) + '%';
      elCr.textContent    = crashes;
    }

    function rectsOverlap(a,b){
      return !(a.x+a.w < b.x || a.x > b.x+b.w || a.y+a.h < b.y || a.y > b.y+b.h);
    }

    function drawRoad(){
      // tráva
      ctx.fillStyle = '#0e3b0e';
      ctx.fillRect(0,0,ROAD_MARGIN,canvas.height);
      ctx.fillRect(canvas.width-ROAD_MARGIN,0,ROAD_MARGIN,canvas.height);

      // vozovka
      ctx.fillStyle = '#2a2a2f';
      ctx.fillRect(ROAD_MARGIN,0,ROAD_WIDTH,canvas.height);

      // středové čáry mezi pruhy
      ctx.strokeStyle = '#dcdcdc';
      ctx.lineWidth = 3;
      ctx.setLineDash([22,18]);
      for(let l=1;l<LANES;l++){
        const x = ROAD_MARGIN + l*LANE_W;
        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,canvas.height);
        ctx.stroke();
      }
      ctx.setLineDash([]);
    }

    function drawCar(obj, color){
      ctx.fillStyle = color;
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 2;
      ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
      ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);

      // světla
      ctx.fillStyle = '#ffd966';
      ctx.fillRect(obj.x+6, obj.y+4, obj.w-12, 6);
      ctx.fillStyle = '#ff6666';
      ctx.fillRect(obj.x+6, obj.y+obj.h-10, obj.w-12, 6);
    }

    function drawPickup(p){
      // ⚡ blesk
      ctx.save();
      ctx.translate(p.x+p.w/2, p.y+p.h/2);
      ctx.rotate(Math.sin(performance.now()/160)*0.2);
      ctx.fillStyle = '#ffff33';
      ctx.strokeStyle='#ffea00';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(-6,-10);
      ctx.lineTo(2,-10);
      ctx.lineTo(-2,6);
      ctx.lineTo(6,6);
      ctx.lineTo(-2,18);
      ctx.lineTo(-2,10);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }

    function draw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      drawRoad();

      // auta
      for (const c of cars) drawCar(c, c.color);

      // pickupy
      for (const p of pickups) drawPickup(p);

      // hráč
      drawCar(player, player.color);
    }

    function popMsg(text){
      elMsg.textContent = text;
      elMsg.style.opacity = '1';
      setTimeout(()=>{ elMsg.style.opacity='0'; }, 600);
    }

    // počáteční vykreslení pozice hráče
    resetState();
    draw();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TURBO RACER</title>
<style>
  :root{
    --neon:#00ff5a; --neon-dim:#00c344; --hud:#0a0f0a; --lane:#2a2f2a; --road:#141715;
    --car:#b71c1c; --car2:#c62828; --enemy:#a91f2f; --enemy-dark:#7b1522; --power:#ffd000;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#0b0d0c radial-gradient(ellipse at center, #0c0f0d 0%, #050605 100%) no-repeat;
    font-family: "Courier New", monospace; color:var(--neon);
  }
  #wrap{position:relative}
  #game{
    width:1000px; height:600px; display:block; border:4px solid var(--neon);
    box-shadow:0 0 35px rgba(0,255,120,.25), inset 0 0 20px rgba(0,255,120,.15);
    background:var(--road);
  }
  #hud{
    position:absolute; top:-56px; left:0; right:0; display:flex; gap:18px; justify-content:center;
    filter: drop-shadow(0 0 6px rgba(0,255,120,.4));
  }
  .pill{
    background:rgba(0,0,0,.75); color:var(--neon); border:2px solid var(--neon-dim);
    border-radius:14px; padding:8px 14px; font-weight:700; letter-spacing:.5px;
  }
  #pauseHint{position:absolute; top:10px; right:12px; font-size:12px; opacity:.7}
  #centerMsg{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none;
    color:#eafff2; font-size:22px; text-align:center; text-shadow:0 0 12px rgba(0,255,120,.6);
  }
  #modal{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.45);
  }
  .dialog{
    background:#08110b; border:3px solid var(--neon); border-radius:16px; padding:24px 28px;
    color:#d9ffe8; text-align:center; box-shadow:0 0 28px rgba(0,255,120,.35);
    min-width:360px;
  }
  .dialog h2{color:var(--neon); margin-bottom:8px; text-shadow:0 0 12px rgba(0,255,120,.7)}
  .dialog .stats{margin:10px 0 16px 0; line-height:1.6}
  button{
    background:var(--neon); color:#031006; border:none; border-radius:10px; font-weight:800;
    padding:10px 18px; margin:4px 6px; cursor:pointer; box-shadow:0 4px 0 var(--neon-dim);
  }
  button:hover{transform:translateY(-1px)}
  #legend{
    position:absolute; bottom:-42px; width:100%; text-align:center; color:#9fffc7; font-size:12px;
    opacity:.8
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1000" height="600"></canvas>
  <div id="hud">
    <div class="pill">🕹️ Level: <span id="lvl">1</span></div>
    <div class="pill">🚗 Rychlost: <span id="spd">80</span> km/h</div>
    <div class="pill">⚡ Boost: <span id="boost">0</span>%</div>
    <div class="pill">💥 Kolize: <span id="hits">0</span></div>
    <div class="pill">📏 Vzdál.: <span id="dist">0.00</span> km</div>
  </div>
  <div id="pauseHint">P = pauza • R = restart</div>
  <div id="centerMsg">Šipky ← → mění pruh • ↑ aktivuje turbo (pokud máš ⚡)</div>

  <div id="modal">
    <div class="dialog">
      <h2>KONEC HRY</h2>
      <div class="stats" id="summary"></div>
      <button id="again">HRÁT ZNOVU</button>
    </div>
  </div>

  <div id="legend">Vyhýbej se autům, sbírej ⚡ blesky pro turbo. Level roste s ujetou vzdáleností.</div>
</div>

<script>
(() => {
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;

  // --- Parametry hry ---
  const lanesCount = 6;                       // víc pruhů
  const laneW = W * 0.75 / lanesCount;        // šířka pruhu (silnice je ~75 % plátna)
  const roadLeft = (W - laneW*lanesCount)/2;
  const roadRight = roadLeft + laneW*lanesCount;
  const laneMarkH = 20;

  const baseSpawnInterval = 950;              // ms – základní spawn nepřátel
  const trafficHoles = 0.45;                  // pravděpodobnost vynechání, aby šly projet mezery
  const maxHits = 5;

  // Rychlosti
  let level = 1;
  let speedKmh = 80;                          // aktuální rychlost hráče
  let maxSpeedKmh = 80;
  const minSpeedKmh = 60;
  const levelUpEveryKm = 1.2;                 // každých X km level++
  const speedPerLevel = 12;                   // přídavek k cílové rychlosti na level
  const boostSpeed = 60;                      // dodatečných km/h při turbu
  let boostMeter = 0;                         // 0–100
  let boostActive = false;

  // Stav
  let running = true, paused = false, gameOver = false;
  let lastTime = performance.now();
  let distKm = 0;
  let hits = 0;
  let spawnTimer = 0, powerTimer = 0;

  // Hráč
  const player = {
    lane: Math.floor(lanesCount/2),
    y: H - 110,
    w: Math.min(56, laneW*0.66),
    h: 96,
    moveToLane: null
  };

  // Kolekce
  const enemies = [];
  const powers = []; // blesky

  // --- Pomocné UI ---
  const ui = (id,v)=>document.getElementById(id).textContent = v.toString();
  const fmt = n => (Math.round(n*100)/100).toFixed(2);

  // --- Vykreslování silnice ---
  function drawRoad(){
    // krajnice
    ctx.fillStyle = '#0c160e';
    ctx.fillRect(0,0, roadLeft, H);
    ctx.fillRect(roadRight,0, W-roadRight, H);

    // asfalt
    ctx.fillStyle = '#101413';
    ctx.fillRect(roadLeft,0, laneW*lanesCount, H);

    // dělicí čáry
    ctx.strokeStyle = '#9aa49c2a';
    ctx.lineWidth = 6;
    ctx.setLineDash([laneMarkH, laneMarkH]);
    for(let i=1;i<lanesCount;i++){
      const x = roadLeft + i*laneW;
      ctx.beginPath();
      ctx.moveTo(x,0); ctx.lineTo(x,H);
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  // --- Autíčko (vzhled 80s) ---
  function drawCar(x,y,w,h, body='#a91f2f', dark='#7b1522'){
    const r = 10;
    // stín
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.fillRect(x+3,y+6,w, h);
    // tělo
    ctx.fillStyle = body;
    roundRect(x,y,w,h,r,true,false);

    // kapota + kufr
    ctx.fillStyle = dark;
    roundRect(x+6,y+6,w-12, h*0.22, r, true,false);
    roundRect(x+6,y+h*0.72,w-12, h*0.22, r, true,false);

    // skla
    ctx.fillStyle = '#c7e6ff';
    roundRect(x+10,y+h*0.3, w-20, h*0.22, 6, true,false);

    // kola
    ctx.fillStyle = '#0b0b0b';
    ctx.fillRect(x-3,y+10, 8, h*0.32);
    ctx.fillRect(x+w-5,y+10, 8, h*0.32);
    ctx.fillRect(x-3,y+h*0.62, 8, h*0.28);
    ctx.fillRect(x+w-5,y+h*0.62, 8, h*0.28);
  }
  function roundRect(x,y,w,h,r,fill,stroke){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y, x+w,y+h, r);
    ctx.arcTo(x+w,y+h, x,y+h, r);
    ctx.arcTo(x,y+h, x,y, r);
    ctx.arcTo(x,y, x+w,y, r);
    if(fill) ctx.fill(); if(stroke) ctx.stroke();
  }

  // --- Hráč ---
  function playerXForLane(l){ return roadLeft + l*laneW + (laneW-player.w)/2; }
  function drawPlayer(){
    const px = playerXForLane(player.lane);
    // hladký dojezd do cíle pruhu
    if(player.moveToLane!==null){
      const targetX = playerXForLane(player.moveToLane);
      const curX = px;
      const dx = Math.sign(targetX-curX) * Math.min(10, Math.abs(targetX-curX));
      if(Math.abs(targetX-curX)<=10){ player.lane = player.moveToLane; player.moveToLane=null; }
      else { // přechod – posuneme „vizuální pozici“
        const tmpX = curX + dx;
        drawCar(tmpX, player.y, player.w, player.h, '#1aa85a', '#118d48');
        return;
      }
    }
    drawCar(px, player.y, player.w, player.h, '#1aa85a', '#118d48');
  }

  // --- Nepřátelé a powerupy ---
  function spawnRow(){
    // vytvoříme jednu „vlnu“ aut s minimálně jedním volným pruhem
    const freeLane = Math.floor(Math.random()*lanesCount);
    for(let l=0;l<lanesCount;l++){
      if(Math.random()<trafficHoles || l===freeLane) continue; // udělej mezery
      enemies.push({
        lane:l,
        x: playerXForLane(l),
        y: -120 - Math.random()*80,
        w: Math.min(54, laneW*0.62),
        h: 92,
        spd: (speedKmh*0.28) + 60 + Math.random()*50, // px/s; trochu závisí na hráči
        color: Math.random()<.5 ? ['#b71c1c','#7b1522'] : ['#c62828','#8e1d1d']
      });
    }
    // šance na blesk
    if(Math.random()<0.35){
      const l = Math.floor(Math.random()*lanesCount);
      powers.push({
        lane:l, x:playerXForLane(l)+(player.w-26)/2, y:-80, size:26, spd:(speedKmh*0.3)+90
      });
    }
  }

  // --- Fyzika / logika ---
  function update(dt){
    if(!running || paused) return;

    // km/h -> px/s (měřítko zvolíme: 1 px ~ 0.06 m => 1 km ~ 16666 px pro pocit rychlosti)
    const PX_PER_KM = 16666; // na plátně
    const ms = dt;
    const pxPerMs = (speedKmh * (1000/3600)) / (1000/PX_PER_KM); // px/ms
    distKm += (speedKmh * (ms/3600000)); // fyzicky správně do statistik

    // Level up
    const newLevel = 1 + Math.floor(distKm / levelUpEveryKm);
    if(newLevel>level){
      level = newLevel;
      // zvedni cílovou rychlost
      const target = minSpeedKmh + (level-1)*speedPerLevel;
      maxSpeedKmh = Math.max(maxSpeedKmh, target);
      // lehce zrychli spawner
      spawnInterval = Math.max(450, baseSpawnInterval - level*40);
      // krátká zpráva
      centerFlash(`Level ${level}!`);
    }

    // Plynulá akcelerace k maxSpeedKmh
    if(speedKmh < maxSpeedKmh) speedKmh += 0.08 * dt;
    if(boostActive){
      speedKmh = Math.min(maxSpeedKmh + boostSpeed, speedKmh + 0.22*dt);
      boostMeter = Math.max(0, boostMeter - 0.035*dt);
      if(boostMeter<=0) boostActive=false;
    }else{
      speedKmh = Math.max(minSpeedKmh, speedKmh - 0.04*dt); // lehké opadnutí
    }

    // Spawnování
    spawnTimer += dt;
    if(spawnTimer >= spawnInterval){
      spawnTimer = 0;
      spawnRow();
    }

    // Pohyb nepřátel
    for(let i=enemies.length-1;i>=0;i--){
      const e = enemies[i];
      e.y += e.spd * (dt/1000);
      // kolize
      if( Math.abs(e.lane - player.lane) < 0.1 ){
        const px = playerXForLane(player.lane);
        if(rectsOverlap(px, player.y, player.w, player.h, e.x, e.y, e.w, e.h)){
          enemies.splice(i,1);
          bump();
          continue;
        }
      }
      if(e.y > H+120) enemies.splice(i,1);
    }

    // Pohyb blesků
    for(let i=powers.length-1;i>=0;i--){
      const p = powers[i];
      p.y += p.spd * (dt/1000);
      if( Math.abs(p.lane - player.lane) < 0.1 ){
        const px = playerXForLane(player.lane);
        if(rectsOverlap(px, player.y, player.w, player.h, p.x, p.y, p.size, p.size)){
          powers.splice(i,1);
          // doplnit boost metr + krátký auto-boost
          boostMeter = Math.min(100, boostMeter + 35);
          boostActive = true;
          centerFlash('⚡ TURBO!');
          continue;
        }
      }
      if(p.y>H+60) powers.splice(i,1);
    }

    // UI
    ui('lvl', level);
    ui('spd', Math.round(speedKmh));
    ui('boost', Math.round(boostMeter));
    ui('hits', hits);
    ui('dist', fmt(distKm));

    // Konec?
    if(hits >= maxHits) finish();
  }

  function bump(){
    hits++;
    maxSpeedKmh = Math.max(minSpeedKmh, maxSpeedKmh - 10);
    speedKmh = Math.max(minSpeedKmh, speedKmh - 25);
    centerFlash('💥 Kolize!');
  }

  function rectsOverlap(x1,y1,w1,h1, x2,y2,w2,h2){
    return !(x1+w1<x2 || x2+w2<x1 || y1+h1<y2 || y2+h2<y1);
  }

  // --- Vykreslování ---
  function draw(){
    ctx.clearRect(0,0,W,H);
    drawRoad();

    // pruhy pohybu (parallax dle rychlosti)
    const offset = (performance.now()/8) % (laneMarkH*2);
    ctx.strokeStyle = '#1aff7a22';
    ctx.lineWidth = 2;
    ctx.setLineDash([laneMarkH, laneMarkH]);
    ctx.lineDashOffset = -offset;
    ctx.beginPath(); ctx.moveTo(roadLeft+laneW*0.5, 0); ctx.lineTo(roadLeft+laneW*0.5, H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(roadRight-laneW*0.5, 0); ctx.lineTo(roadRight-laneW*0.5, H); ctx.stroke();
    ctx.setLineDash([]);

    // blesky
    for(const p of powers){
      drawPower(p.x, p.y, p.size);
    }

    // nepřátelé
    for(const e of enemies){
      drawCar(e.x, e.y, e.w, e.h, e.color[0], e.color[1]);
    }

    // hráč
    drawPlayer();

    // okraje neon
    ctx.strokeStyle = 'rgba(0,255,120,.35)';
    ctx.lineWidth = 6;
    ctx.strokeRect(3,3,W-6,H-6);
  }

  function drawPower(x,y,s){
    // blesk
    ctx.save();
    ctx.translate(x+s/2, y+s/2);
    ctx.rotate(Math.sin(performance.now()/200)*0.1);
    ctx.translate(-s/2, -s/2);
    ctx.fillStyle = 'rgba(255,208,0,.9)';
    ctx.beginPath();
    ctx.moveTo(s*0.15,0); ctx.lineTo(s*0.7,0); ctx.lineTo(s*0.35,s*0.55);
    ctx.lineTo(s*0.85, s*0.55); ctx.lineTo(s*0.25,s); ctx.lineTo(s*0.45,s*0.45);
    ctx.lineTo(s*0.1,s*0.45); ctx.closePath(); ctx.fill();
    ctx.restore();
    // záře
    ctx.shadowColor = '#ffd000'; ctx.shadowBlur = 12;
  }

  // --- Game loop ---
  let spawnInterval = baseSpawnInterval;
  function loop(t){
    const dt = Math.min(40, t - lastTime); // clamp
    lastTime = t;
    if(!paused && running) {
      update(dt);
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // --- Ovládání ---
  const keys = {};
  document.addEventListener('keydown', (e)=>{
    keys[e.key] = true;
    if(e.key==='ArrowLeft'){
      if(player.moveToLane===null) player.moveToLane = Math.max(0, player.lane-1);
    }
    if(e.key==='ArrowRight'){
      if(player.moveToLane===null) player.moveToLane = Math.min(lanesCount-1, player.lane+1);
    }
    if(e.key==='ArrowUp'){ // ruční aktivace turba
      if(boostMeter>0){ boostActive = true; }
    }
    if(e.key.toLowerCase()==='p'){ paused = !paused; centerFlash(paused?'PAUZA':'GO!'); }
    if(e.key.toLowerCase()==='r' && gameOver){ restart(); }
  });
  document.addEventListener('keyup', (e)=>{ keys[e.key]=false; if(e.key==='ArrowUp') boostActive=false; });

  // --- UX prvky ---
  const center = document.getElementById('centerMsg');
  let flashTimer = 0;
  function centerFlash(msg){
    center.textContent = msg;
    center.style.opacity = '1';
    flashTimer = 900;
  }
  function tickFlash(dt){
    if(flashTimer>0){
      flashTimer -= dt;
      if(flashTimer<=0){ center.style.opacity='0'; }
    }
  }

  // --- Konec / restart ---
  const modal = document.getElementById('modal');
  function finish(){
    running = false; gameOver = true;
    modal.style.display = 'flex';
    document.getElementById('summary').innerHTML =
      `Level: <b>${level}</b> • Vzdálenost: <b>${fmt(distKm)}</b> km<br>`+
      `Max rychlost: <b>${Math.round(maxSpeedKmh)}</b> km/h • Kolize: <b>${hits}</b>`;
  }
  function restart(){
    // reset všeho
    level = 1; speedKmh = 80; maxSpeedKmh = 80; boostMeter=0; boostActive=false;
    distKm = 0; hits=0; enemies.length=0; powers.length=0;
    spawnInterval = baseSpawnInterval; running=true; paused=false; gameOver=false;
    player.lane = Math.floor(lanesCount/2); player.moveToLane=null;
    modal.style.display='none';
    centerFlash('GO!');
  }
  document.getElementById('again').onclick = restart;

  // drobný timer pro text
  (function flashLoop(ts0){
    let last = performance.now();
    function f(){
      const now = performance.now();
      tickFlash(now-last);
      last = now;
      requestAnimationFrame(f);
    }
    requestAnimationFrame(f);
  })();

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circus Catch</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #FF6B6B 0%, #FFA07A 100%);
            font-family: 'Arial Black', Arial, sans-serif;
        }
        #gameContainer { text-align: center; }
        h1 { color: #FFD700; font-size: 3em; margin-bottom: 10px; text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5); }
        #stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            gap: 20px;
        }
        .stat {
            background: linear-gradient(135deg, #FF1493, #FF69B4);
            color: white;
            padding: 12px 25px;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
        }
        #gameCanvas {
            border: 5px solid #FFD700;
            background: linear-gradient(to bottom, #87CEEB 0%, #FFE4B5 100%);
            display: block;
            margin: 20px auto;
            cursor: none;
        }
        button {
            font-size: 20px;
            padding: 15px 30px;
            margin: 10px;
            cursor: pointer;
            background: #FFD700;
            color: #FF1493;
            border: none;
            border-radius: 15px;
            font-weight: bold;
        }
        button:hover { background: #FFA500; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <h1>🎪 CIRCUS CATCH 🎪</h1>
        <div id="stats">
            <div class="stat">🎯 <span id="score">0</span></div>
            <div class="stat">❤️ <span id="lives">3</span></div>
            <div class="stat">⭐ L<span id="level">1</span></div>
        </div>
        <canvas id="gameCanvas" width="600" height="700"></canvas>
        <div style="color: #FFD700; margin: 15px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);">🖱️ Myš = pohyb košíku | Chyť padající předměty!</div>
        <button onclick="restart()">🔄 RESTART</button>
        <button onclick="window.location.href='index.html'">🏠 MENU</button>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let score = 0, lives = 3, level = 1, gameRunning = true;
        const basket = {x: canvas.width / 2 - 50, y: canvas.height - 80, width: 100, height: 60};
        let items = [];
        let particles = [];
        
        const goodItems = ['🍎', '🍊', '🍋', '🍌', '🍉', '🍇', '🍓', '🍒'];
        const badItems = ['💣', '🔥', '💀', '⚡'];
        
        class Item {
            constructor() {
                this.x = Math.random() * (canvas.width - 40) + 20;
                this.y = -40;
                this.speed = 2 + level * 0.5 + Math.random() * 2;
                this.isBad = Math.random() < 0.2;
                this.emoji = this.isBad ? badItems[Math.floor(Math.random() * badItems.length)] : goodItems[Math.floor(Math.random() * goodItems.length)];
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.1;
            }
            
            update() {
                this.y += this.speed;
                this.rotation += this.rotationSpeed;
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.font = '40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(this.emoji, 0, 10);
                ctx.restore();
            }
        }
        
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.dx = (Math.random() - 0.5) * 8;
                this.dy = (Math.random() - 0.5) * 8 - 2;
                this.size = Math.random() * 6 + 3;
                this.color = color;
                this.life = 30;
            }
            
            update() {
                this.x += this.dx;
                this.y += this.dy;
                this.dy += 0.3;
                this.life--;
            }
            
            draw() {
                ctx.globalAlpha = this.life / 30;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }
        
        function drawBackground() {
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#87CEEB');
            gradient.addColorStop(1, '#FFE4B5');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Šapitó pruhy
            ctx.strokeStyle = '#FF1493';
            ctx.lineWidth = 20;
            for (let i = 0; i < 10; i++) {
                ctx.beginPath();
                ctx.moveTo(i * 120, 0);
                ctx.lineTo(i * 120 - 100, 150);
                ctx.stroke();
            }
        }
        
        function drawBasket() {
            // Košík
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(basket.x, basket.y, basket.width, basket.height);
            
            // Textura košíku
            ctx.strokeStyle = '#654321';
            ctx.lineWidth = 3;
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.moveTo(basket.x, basket.y + i * 15);
                ctx.lineTo(basket.x + basket.width, basket.y + i * 15);
                ctx.stroke();
            }
            for (let i = 0; i < 6; i++) {
                ctx.beginPath();
                ctx.moveTo(basket.x + i * 20, basket.y);
                ctx.lineTo(basket.x + i * 20, basket.y + basket.height);
                ctx.stroke();
            }
            
            // Klaun držící košík
            ctx.fillStyle = '#FFD700';
            ctx.font = '60px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('🤡', basket.x + basket.width / 2, basket.y + basket.height + 50);
        }
        
        function spawnItem() {
            if (Math.random() < 0.02 + level * 0.005) {
                items.push(new Item());
            }
        }
        
        function checkCatch() {
            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                
                // Chyceno
                if (item.y + 20 > basket.y && item.y < basket.y + basket.height &&
                    item.x > basket.x && item.x < basket.x + basket.width) {
                    
                    if (item.isBad) {
                        lives--;
                        createParticles(item.x, item.y, '#FF0000');
                        document.getElementById('lives').textContent = lives;
                        if (lives <= 0) {
                            endGame();
                        }
                    } else {
                        score += 10 * level;
                        createParticles(item.x, item.y, '#FFD700');
                        document.getElementById('score').textContent = score;
                        
                        if (score % 500 === 0 && score > 0) {
                            level++;
                            document.getElementById('level').textContent = level;
                        }
                    }
                    
                    items.splice(i, 1);
                }
                // Míjí košík
                else if (item.y > canvas.height) {
                    if (!item.isBad) {
                        lives--;
                        document.getElementById('lives').textContent = lives;
                        if (lives <= 0) {
                            endGame();
                        }
                    }
                    items.splice(i, 1);
                }
            }
        }
        
        function createParticles(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push(new Particle(x, y, color));
            }
        }
        
        function update() {
            if (!gameRunning) return;
            
            spawnItem();
            
            items.forEach(item => item.update());
            particles.forEach(p => p.update());
            particles = particles.filter(p => p.life > 0);
            
            checkCatch();
        }
        
        function draw() {
            drawBackground();
            items.forEach(item => item.draw());
            particles.forEach(p => p.draw());
            drawBasket();
        }
        
        function gameLoop() {
            update();
            draw();
            if (gameRunning) {
                requestAnimationFrame(gameLoop);
            }
        }
        
        function endGame() {
            gameRunning = false;
            setTimeout(() => alert('🎪 Game Over! Skóre: ' + score), 100);
        }
        
        function restart() {
            score = 0;
            lives = 3;
            level = 1;
            items = [];
            particles = [];
            gameRunning = true;
            document.getElementById('score').textContent = '0';
            document.getElementById('lives').textContent = '3';
            document.getElementById('level').textContent = '1';
            gameLoop();
        }
        
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            basket.x = e.clientX - rect.left - basket.width / 2;
            if (basket.x < 0) basket.x = 0;
            if (basket.x > canvas.width - basket.width) basket.x = canvas.width - basket.width;
        });
        
        gameLoop();
    </script>
</body>
</html>

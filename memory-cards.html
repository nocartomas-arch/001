<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Cards - Pexeso</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            font-family: 'Arial', sans-serif;
        }
        #gameContainer {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
        }
        h1 {
            color: #FF1493;
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.2);
        }
        .subtitle {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 20px;
        }
        #stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            gap: 20px;
            flex-wrap: wrap;
        }
        .stat {
            background: linear-gradient(135deg, #FF1493, #FF69B4);
            color: white;
            padding: 15px 30px;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(255, 20, 147, 0.3);
        }
        #difficultySelect {
            margin: 20px 0;
        }
        .difficulty-btn {
            font-size: 18px;
            padding: 12px 25px;
            margin: 5px;
            cursor: pointer;
            background: linear-gradient(135deg, #a8edea, #fed6e3);
            color: #333;
            border: 3px solid #FF1493;
            border-radius: 15px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .difficulty-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #fed6e3, #a8edea);
        }
        .difficulty-btn.active {
            background: linear-gradient(135deg, #FF1493, #FF69B4);
            color: white;
        }
        #gameBoard {
            display: grid;
            gap: 15px;
            margin: 30px auto;
            justify-content: center;
        }
        .card {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #FF1493, #FF69B4);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            transform-style: preserve-3d;
        }
        .card:hover:not(.flipped):not(.matched) {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        .card.flipped, .card.matched {
            background: white;
            border: 3px solid #FF1493;
        }
        .card.matched {
            animation: matchPulse 0.5s;
            cursor: default;
            opacity: 0.7;
        }
        @keyframes matchPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            border-radius: 15px;
        }
        button {
            font-size: 20px;
            padding: 15px 30px;
            margin: 10px;
            cursor: pointer;
            background: linear-gradient(135deg, #FF1493, #FF69B4);
            color: white;
            border: none;
            border-radius: 15px;
            font-weight: bold;
            box-shadow: 0 5px 0 #C71585;
            transition: all 0.1s;
        }
        button:hover {
            background: linear-gradient(135deg, #FF69B4, #FF1493);
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #C71585;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #C71585;
        }
        #gameOver, #victory {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 20, 147, 0.98);
            padding: 50px;
            border: 5px solid #FFD700;
            border-radius: 30px;
            color: white;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }
        #gameOver h2 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #FFD700;
        }
        #victory h2 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #FFD700;
            animation: victoryBounce 1s infinite;
        }
        @keyframes victoryBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .game-stats {
            font-size: 24px;
            margin: 20px 0;
        }
        #timer {
            font-size: 28px;
            font-weight: bold;
            color: #FF1493;
        }
        .time-warning {
            color: #FF0000;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <h1>🧠 MEMORY CARDS 🧠</h1>
        <p class="subtitle">Najdi všechny páry!</p>
        
        <div id="difficultySelect">
            <h3>Vyber obtížnost:</h3>
            <button class="difficulty-btn active" onclick="setDifficulty('easy')">😊 Snadná (4x4)</button>
            <button class="difficulty-btn" onclick="setDifficulty('medium')">😐 Střední (6x6)</button>
            <button class="difficulty-btn" onclick="setDifficulty('hard')">😰 Těžká (8x8)</button>
        </div>
        
        <div id="stats">
            <div class="stat">⏱️ Čas: <span id="timer">0:00</span></div>
            <div class="stat">🔄 Tahy: <span id="moves">0</span></div>
            <div class="stat">✅ Páry: <span id="pairs">0</span>/<span id="totalPairs">8</span></div>
        </div>
        
        <div id="gameBoard"></div>
        
        <button onclick="startGame()">🎮 NOVÁ HRA</button>
        <button onclick="goHome()">🏠 MENU</button>
        
        <div id="gameOver">
            <h2>⏰ ČAS VYPRŠEL!</h2>
            <div class="game-stats">
                🔄 Tahy: <span id="finalMoves">0</span><br>
                ✅ Nalezeno párů: <span id="finalPairs">0</span>
            </div>
            <button onclick="startGame()">🔄 ZKUSIT ZNOVU</button>
            <button onclick="goHome()">🏠 MENU</button>
        </div>
        
        <div id="victory">
            <h2>🎉 GRATULUJEME! 🎉</h2>
            <div class="game-stats">
                ⏱️ Čas: <span id="victoryTime">0:00</span><br>
                🔄 Tahy: <span id="victoryMoves">0</span><br>
                ⭐ Skóre: <span id="victoryScore">0</span>
            </div>
            <button onclick="startGame()">🔄 DALŠÍ HRA</button>
            <button onclick="goHome()">🏠 MENU</button>
        </div>
    </div>

    <script>
        const EMOJIS = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮', 
                        '🐷', '🐸', '🐵', '🐔', '🐧', '🐦', '🐤', '🦆', '🦉', '🦄', '🐝', '🐛', 
                        '🦋', '🐌', '🐞', '🐢', '🐍', '🦎', '🦖', '🦕'];
        
        let difficulty = 'easy';
        let gridSize = 4;
        let timeLimit = 60;
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let gameActive = false;
        let timer = 0;
        let timerInterval;
        
        function setDifficulty(level) {
            difficulty = level;
            
            document.querySelectorAll('.difficulty-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            switch(level) {
                case 'easy':
                    gridSize = 4;
                    timeLimit = 60;
                    break;
                case 'medium':
                    gridSize = 6;
                    timeLimit = 90;
                    break;
                case 'hard':
                    gridSize = 8;
                    timeLimit = 150;
                    break;
            }
            
            startGame();
        }
        
        function startGame() {
            // Reset
            cards = [];
            flippedCards = [];
            matchedPairs = 0;
            moves = 0;
            timer = 0;
            gameActive = true;
            
            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('victory').style.display = 'none';
            
            clearInterval(timerInterval);
            
            // Vytvoření karet
            const numPairs = (gridSize * gridSize) / 2;
            const selectedEmojis = EMOJIS.slice(0, numPairs);
            const gameEmojis = [...selectedEmojis, ...selectedEmojis];
            
            // Zamíchání
            gameEmojis.sort(() => Math.random() - 0.5);
            
            // Vytvoření herního pole
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';
            board.style.gridTemplateColumns = `repeat(${gridSize}, 100px)`;
            
            gameEmojis.forEach((emoji, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.emoji = emoji;
                card.dataset.index = index;
                card.innerHTML = '<div class="card-back">❓</div>';
                card.onclick = () => flipCard(card);
                board.appendChild(card);
                cards.push(card);
            });
            
            // Aktualizace UI
            updateStats();
            startTimer();
        }
        
        function flipCard(card) {
            if (!gameActive || card.classList.contains('flipped') || 
                card.classList.contains('matched') || flippedCards.length >= 2) {
                return;
            }
            
            card.classList.add('flipped');
            card.innerHTML = card.dataset.emoji;
            flippedCards.push(card);
            
            if (flippedCards.length === 2) {
                moves++;
                updateStats();
                
                setTimeout(checkMatch, 500);
            }
        }
        
        function checkMatch() {
            const [card1, card2] = flippedCards;
            
            if (card1.dataset.emoji === card2.dataset.emoji) {
                // Shoda!
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedPairs++;
                updateStats();
                
                // Kontrola výhry
                if (matchedPairs === (gridSize * gridSize) / 2) {
                    victory();
                }
            } else {
                // Neshoda
                card1.classList.remove('flipped');
                card2.classList.remove('flipped');
                card1.innerHTML = '<div class="card-back">❓</div>';
                card2.innerHTML = '<div class="card-back">❓</div>';
            }
            
            flippedCards = [];
        }
        
        function startTimer() {
            timerInterval = setInterval(() => {
                timer++;
                updateTimer();
                
                if (timer >= timeLimit) {
                    gameOver();
                }
            }, 1000);
        }
        
        function updateTimer() {
            const remaining = timeLimit - timer;
            const minutes = Math.floor(remaining / 60);
            const seconds = remaining % 60;
            const timerEl = document.getElementById('timer');
            timerEl.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            
            if (remaining <= 10) {
                timerEl.classList.add('time-warning');
            } else {
                timerEl.classList.remove('time-warning');
            }
        }
        
        function updateStats() {
            document.getElementById('moves').textContent = moves;
            document.getElementById('pairs').textContent = matchedPairs;
            document.getElementById('totalPairs').textContent = (gridSize * gridSize) / 2;
        }
        
        function calculateScore() {
            const baseScore = 1000;
            const timeBonus = Math.max(0, (timeLimit - timer) * 10);
            const movesPenalty = moves * 5;
            return Math.max(0, baseScore + timeBonus - movesPenalty);
        }
        
        function victory() {
            gameActive = false;
            clearInterval(timerInterval);
            
            const minutes = Math.floor(timer / 60);
            const seconds = timer % 60;
            
            document.getElementById('victoryTime').textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            document.getElementById('victoryMoves').textContent = moves;
            document.getElementById('victoryScore').textContent = calculateScore();
            document.getElementById('victory').style.display = 'block';
        }
        
        function gameOver() {
            gameActive = false;
            clearInterval(timerInterval);
            
            document.getElementById('finalMoves').textContent = moves;
            document.getElementById('finalPairs').textContent = matchedPairs;
            document.getElementById('gameOver').style.display = 'block';
        }
        
        function goHome() {
            window.location.href = 'index.html';
        }
        
        // Start první hry
        startGame();
    </script>
</body>
</html>

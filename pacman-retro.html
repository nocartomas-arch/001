<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man Retro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #000;
            font-family: 'Arial Black', Arial, sans-serif;
        }
        #gameContainer {
            text-align: center;
        }
        h1 {
            color: #FFD700;
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px #FFD700;
        }
        #stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            gap: 20px;
        }
        .stat {
            background: #000;
            color: #FFD700;
            padding: 10px 25px;
            border: 3px solid #FFD700;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
        }
        #gameCanvas {
            border: 5px solid #FFD700;
            background: #000;
            display: block;
            margin: 20px auto;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }
        #gameOver {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border: 5px solid #FFD700;
            border-radius: 20px;
            color: #FFD700;
            text-align: center;
            z-index: 100;
        }
        #gameOver h2 {
            font-size: 48px;
            margin-bottom: 20px;
        }
        button {
            font-size: 20px;
            padding: 15px 30px;
            margin: 10px;
            cursor: pointer;
            background: #FFD700;
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: bold;
        }
        button:hover {
            background: #FFA500;
        }
        #instructions {
            color: #FFD700;
            font-size: 16px;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <h1>👻 PAC-MAN RETRO 👻</h1>
        <div id="stats">
            <div class="stat">🎯 Skóre: <span id="score">0</span></div>
            <div class="stat">❤️ Životy: <span id="lives">3</span></div>
            <div class="stat">🍒 Level: <span id="level">1</span></div>
        </div>
        <canvas id="gameCanvas" width="560" height="620"></canvas>
        <div id="instructions">⬆️⬇️⬅️➡️ ŠIPKY = pohyb | Sněz všechny tečky a vyhni se duchům!</div>
        
        <button onclick="restart()">🔄 RESTART</button>
        <button onclick="goHome()">🏠 MENU</button>
        
        <div id="gameOver">
            <h2>👻 GAME OVER 👻</h2>
            <div style="font-size: 24px; margin: 20px 0;">
                🎯 Finální skóre: <span id="finalScore">0</span><br>
                🍒 Dosažený level: <span id="finalLevel">1</span>
            </div>
            <button onclick="restart()">🔄 ZKUSIT ZNOVU</button>
            <button onclick="goHome()">🏠 MENU</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const CELL = 20;
        const COLS = 28;
        const ROWS = 31;
        
        let score = 0;
        let lives = 3;
        let level = 1;
        let gameRunning = true;
        
        const maze = [
            "############################",
            "#............##............#",
            "#.####.#####.##.#####.####.#",
            "#o####.#####.##.#####.####o#",
            "#.####.#####.##.#####.####.#",
            "#..........................#",
            "#.####.##.########.##.####.#",
            "#.####.##.########.##.####.#",
            "#......##....##....##......#",
            "######.##### ## #####.######",
            "     #.##### ## #####.#     ",
            "     #.##          ##.#     ",
            "     #.## ###--### ##.#     ",
            "######.## #      # ##.######",
            "      .   #      #   .      ",
            "######.## #      # ##.######",
            "     #.## ######## ##.#     ",
            "     #.##          ##.#     ",
            "     #.## ######## ##.#     ",
            "######.## ######## ##.######",
            "#............##............#",
            "#.####.#####.##.#####.####.#",
            "#.####.#####.##.#####.####.#",
            "#o..##.......  .......##..o#",
            "###.##.##.########.##.##.###",
            "###.##.##.########.##.##.###",
            "#......##....##....##......#",
            "#.##########.##.##########.#",
            "#.##########.##.##########.#",
            "#..........................#",
            "############################"
        ];
        
        let dots = [];
        let powerPellets = [];
        
        const pacman = {
            x: 14,
            y: 23,
            direction: 'right',
            nextDirection: 'right',
            mouthOpen: true,
            animFrame: 0
        };
        
        const ghosts = [
            {x: 13, y: 11, color: '#FF0000', direction: 'up', startX: 13, startY: 11},
            {x: 14, y: 11, color: '#FFB8FF', direction: 'down', startX: 14, startY: 11},
            {x: 13, y: 13, color: '#00FFFF', direction: 'left', startX: 13, startY: 13},
            {x: 14, y: 13, color: '#FFB852', direction: 'right', startX: 14, startY: 13}
        ];
        
        let powerMode = false;
        let powerTimer = 0;
        
        function initDots() {
            dots = [];
            powerPellets = [];
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (maze[y][x] === '.') {
                        dots.push({x, y});
                    } else if (maze[y][x] === 'o') {
                        powerPellets.push({x, y});
                    }
                }
            }
        }
        
        function drawMaze() {
            ctx.strokeStyle = '#0000FF';
            ctx.lineWidth = 2;
            
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (maze[y][x] === '#') {
                        ctx.strokeRect(x * CELL, y * CELL, CELL, CELL);
                    }
                }
            }
        }
        
        function drawDots() {
            ctx.fillStyle = '#FFB8FF';
            dots.forEach(dot => {
                ctx.beginPath();
                ctx.arc(dot.x * CELL + CELL / 2, dot.y * CELL + CELL / 2, 2, 0, Math.PI * 2);
                ctx.fill();
            });
            
            powerPellets.forEach(pellet => {
                ctx.beginPath();
                ctx.arc(pellet.x * CELL + CELL / 2, pellet.y * CELL + CELL / 2, 5, 0, Math.PI * 2);
                ctx.fill();
            });
        }
        
        function drawPacman() {
            pacman.animFrame++;
            if (pacman.animFrame % 10 === 0) {
                pacman.mouthOpen = !pacman.mouthOpen;
            }
            
            const x = pacman.x * CELL + CELL / 2;
            const y = pacman.y * CELL + CELL / 2;
            
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            
            let startAngle = 0.2;
            let endAngle = 1.8;
            
            if (!pacman.mouthOpen) {
                startAngle = 0;
                endAngle = 2;
            }
            
            switch(pacman.direction) {
                case 'right':
                    ctx.arc(x, y, CELL / 2 - 2, startAngle * Math.PI, endAngle * Math.PI);
                    break;
                case 'left':
                    ctx.arc(x, y, CELL / 2 - 2, (1 + startAngle) * Math.PI, (1 + endAngle) * Math.PI);
                    break;
                case 'up':
                    ctx.arc(x, y, CELL / 2 - 2, (1.5 + startAngle) * Math.PI, (1.5 + endAngle) * Math.PI);
                    break;
                case 'down':
                    ctx.arc(x, y, CELL / 2 - 2, (0.5 + startAngle) * Math.PI, (0.5 + endAngle) * Math.PI);
                    break;
            }
            
            ctx.lineTo(x, y);
            ctx.fill();
        }
        
        function drawGhosts() {
            ghosts.forEach(ghost => {
                const x = ghost.x * CELL + CELL / 2;
                const y = ghost.y * CELL + CELL / 2;
                
                ctx.fillStyle = powerMode ? '#0000FF' : ghost.color;
                
                // Tělo
                ctx.beginPath();
                ctx.arc(x, y - 3, CELL / 2 - 2, Math.PI, 0);
                ctx.lineTo(x + CELL / 2 - 2, y + CELL / 2 - 2);
                ctx.lineTo(x + CELL / 3, y + CELL / 4);
                ctx.lineTo(x, y + CELL / 2 - 2);
                ctx.lineTo(x - CELL / 3, y + CELL / 4);
                ctx.lineTo(x - CELL / 2 + 2, y + CELL / 2 - 2);
                ctx.closePath();
                ctx.fill();
                
                // Oči
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(x - 4, y - 3, 3, 0, Math.PI * 2);
                ctx.arc(x + 4, y - 3, 3, 0, Math.PI * 2);
                ctx.fill();
                
                if (!powerMode) {
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(x - 3, y - 3, 2, 0, Math.PI * 2);
                    ctx.arc(x + 5, y - 3, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }
        
        function canMove(x, y) {
            if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return false;
            return maze[y][x] !== '#';
        }
        
        function movePacman() {
            let newX = pacman.x;
            let newY = pacman.y;
            
            // Zkusit nový směr
            let testX = pacman.x;
            let testY = pacman.y;
            
            switch(pacman.nextDirection) {
                case 'up': testY--; break;
                case 'down': testY++; break;
                case 'left': testX--; break;
                case 'right': testX++; break;
            }
            
            if (canMove(testX, testY)) {
                pacman.direction = pacman.nextDirection;
            }
            
            // Pohyb aktuálním směrem
            switch(pacman.direction) {
                case 'up': newY--; break;
                case 'down': newY++; break;
                case 'left': newX--; break;
                case 'right': newX++; break;
            }
            
            // Teleport
            if (newX < 0) newX = COLS - 1;
            if (newX >= COLS) newX = 0;
            
            if (canMove(newX, newY)) {
                pacman.x = newX;
                pacman.y = newY;
            }
            
            // Sběr teček
            for (let i = dots.length - 1; i >= 0; i--) {
                if (dots[i].x === pacman.x && dots[i].y === pacman.y) {
                    dots.splice(i, 1);
                    score += 10;
                    updateScore();
                    
                    if (dots.length === 0) {
                        nextLevel();
                    }
                }
            }
            
            // Power pellets
            for (let i = powerPellets.length - 1; i >= 0; i--) {
                if (powerPellets[i].x === pacman.x && powerPellets[i].y === pacman.y) {
                    powerPellets.splice(i, 1);
                    score += 50;
                    powerMode = true;
                    powerTimer = 200;
                    updateScore();
                }
            }
        }
        
        function moveGhosts() {
            ghosts.forEach(ghost => {
                const directions = ['up', 'down', 'left', 'right'];
                const validDirections = [];
                
                directions.forEach(dir => {
                    let testX = ghost.x;
                    let testY = ghost.y;
                    
                    switch(dir) {
                        case 'up': testY--; break;
                        case 'down': testY++; break;
                        case 'left': testX--; break;
                        case 'right': testX++; break;
                    }
                    
                    if (canMove(testX, testY)) {
                        validDirections.push(dir);
                    }
                });
                
                if (validDirections.length > 0) {
                    if (Math.random() < 0.7) {
                        // Pronásledování Pac-Mana
                        const dx = pacman.x - ghost.x;
                        const dy = pacman.y - ghost.y;
                        
                        if (Math.abs(dx) > Math.abs(dy)) {
                            ghost.direction = dx > 0 ? 'right' : 'left';
                        } else {
                            ghost.direction = dy > 0 ? 'down' : 'up';
                        }
                        
                        if (!validDirections.includes(ghost.direction)) {
                            ghost.direction = validDirections[Math.floor(Math.random() * validDirections.length)];
                        }
                    } else {
                        ghost.direction = validDirections[Math.floor(Math.random() * validDirections.length)];
                    }
                }
                
                switch(ghost.direction) {
                    case 'up': ghost.y--; break;
                    case 'down': ghost.y++; break;
                    case 'left': ghost.x--; break;
                    case 'right': ghost.x++; break;
                }
                
                // Teleport
                if (ghost.x < 0) ghost.x = COLS - 1;
                if (ghost.x >= COLS) ghost.x = 0;
            });
        }
        
        function checkCollisions() {
            ghosts.forEach(ghost => {
                if (ghost.x === pacman.x && ghost.y === pacman.y) {
                    if (powerMode) {
                        score += 200;
                        updateScore();
                        ghost.x = ghost.startX;
                        ghost.y = ghost.startY;
                    } else {
                        loseLife();
                    }
                }
            });
        }
        
        function loseLife() {
            lives--;
            updateLives();
            
            if (lives <= 0) {
                endGame();
            } else {
                resetPositions();
            }
        }
        
        function resetPositions() {
            pacman.x = 14;
            pacman.y = 23;
            pacman.direction = 'right';
            
            ghosts.forEach(ghost => {
                ghost.x = ghost.startX;
                ghost.y = ghost.startY;
            });
        }
        
        function nextLevel() {
            level++;
            document.getElementById('level').textContent = level;
            initDots();
            resetPositions();
        }
        
        function updateScore() {
            document.getElementById('score').textContent = score;
        }
        
        function updateLives() {
            document.getElementById('lives').textContent = lives;
        }
        
        let frameCount = 0;
        
        function update() {
            if (!gameRunning) return;
            
            frameCount++;
            
            if (frameCount % 8 === 0) {
                movePacman();
            }
            
            if (frameCount % 10 === 0) {
                moveGhosts();
            }
            
            checkCollisions();
            
            if (powerMode) {
                powerTimer--;
                if (powerTimer <= 0) {
                    powerMode = false;
                }
            }
        }
        
        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            drawMaze();
            drawDots();
            drawGhosts();
            drawPacman();
        }
        
        function gameLoop() {
            update();
            draw();
            if (gameRunning) {
                requestAnimationFrame(gameLoop);
            }
        }
        
        function endGame() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalLevel').textContent = level;
            document.getElementById('gameOver').style.display = 'block';
        }
        
        function restart() {
            score = 0;
            lives = 3;
            level = 1;
            powerMode = false;
            gameRunning = true;
            
            document.getElementById('gameOver').style.display = 'none';
            
            updateScore();
            updateLives();
            document.getElementById('level').textContent = '1';
            
            initDots();
            resetPositions();
            gameLoop();
        }
        
        function goHome() {
            window.location.href = 'index.html';
        }
        
        // Ovládání
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp':
                    e.preventDefault();
                    pacman.nextDirection = 'up';
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    pacman.nextDirection = 'down';
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    pacman.nextDirection = 'left';
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    pacman.nextDirection = 'right';
                    break;
            }
        });
        
        // Start
        initDots();
        gameLoop();
    </script>
</body>
</html>

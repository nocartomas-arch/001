<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formula Racing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #333 100%);
            font-family: 'Arial Black', Arial, sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            text-align: center;
            position: relative;
        }
        h1 {
            color: #FF0000;
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px #FF0000;
            animation: glow 2s infinite alternate;
        }
        @keyframes glow {
            from { text-shadow: 0 0 10px #FF0000; }
            to { text-shadow: 0 0 30px #FF0000, 0 0 40px #FF0000; }
        }
        #stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            gap: 20px;
        }
        .stat {
            background: linear-gradient(135deg, #FF0000, #CC0000);
            color: white;
            padding: 12px 25px;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            border: 3px solid #FFD700;
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.4);
        }
        #gameCanvas {
            border: 5px solid #FFD700;
            background: #333;
            display: block;
            margin: 20px auto;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.6);
        }
        #gameOver, #finished {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border: 5px solid #FFD700;
            border-radius: 20px;
            color: #FFD700;
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.8);
            z-index: 100;
        }
        #gameOver h2 {
            color: #FF0000;
            font-size: 48px;
            margin-bottom: 20px;
        }
        #finished h2 {
            font-size: 48px;
            margin-bottom: 20px;
            animation: victoryBounce 1s infinite;
        }
        @keyframes victoryBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .game-stats {
            font-size: 24px;
            margin: 20px 0;
        }
        button {
            font-size: 20px;
            padding: 15px 30px;
            margin: 10px;
            cursor: pointer;
            background: #FFD700;
            color: #000;
            border: none;
            border-radius: 15px;
            font-weight: bold;
            box-shadow: 0 5px 0 #B8860B;
            transition: all 0.1s;
        }
        button:hover {
            background: #FFA500;
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #B8860B;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #B8860B;
        }
        #instructions {
            color: #FFD700;
            font-size: 16px;
            margin: 15px 0;
            text-shadow: 0 0 10px #FFD700;
        }
        #countdown {
            display: none;
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120px;
            color: #FFD700;
            text-shadow: 0 0 40px #FFD700;
            animation: countPulse 1s;
        }
        @keyframes countPulse {
            0% { transform: translate(-50%, -50%) scale(0); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <h1>🏎️ FORMULA RACING 🏎️</h1>
        <div id="stats">
            <div class="stat">⏱️ Čas: <span id="time">0.00</span>s</div>
            <div class="stat">🏁 Kolo: <span id="lap">1</span>/3</div>
            <div class="stat">⚡ Rychlost: <span id="speed">0</span> km/h</div>
        </div>
        <canvas id="gameCanvas" width="600" height="800"></canvas>
        <div id="countdown"></div>
        <div id="instructions">⬅️ ➡️ ŠIPKY = řízení | ⬆️ Zrychlení | ⬇️ Brzda | Dojeď 3 kola co nejrychleji!</div>
        
        <button onclick="startRace()">🏁 START ZÁVODU</button>
        <button onclick="goHome()">🏠 MENU</button>
        
        <div id="gameOver">
            <h2>💥 HAVÁRIE! 💥</h2>
            <div class="game-stats">
                ⏱️ Čas: <span id="crashTime">0.00</span>s<br>
                🏁 Dokončená kola: <span id="crashLaps">0</span>/3
            </div>
            <button onclick="startRace()">🔄 ZKUSIT ZNOVU</button>
            <button onclick="goHome()">🏠 MENU</button>
        </div>
        
        <div id="finished">
            <h2>🏆 CÍL! 🏆</h2>
            <div class="game-stats">
                ⏱️ Finální čas: <span id="finalTime">0.00</span>s<br>
                ⚡ Průměrná rychlost: <span id="avgSpeed">0</span> km/h
            </div>
            <button onclick="startRace()">🔄 NOVÝ ZÁVOD</button>
            <button onclick="goHome()">🏠 MENU</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let gameRunning = false;
        let raceStarted = false;
        let time = 0;
        let lap = 1;
        let checkpointsPassed = 0;
        let speedTotal = 0;
        let speedSamples = 0;

        const car = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 150,
            width: 50,
            height: 80,
            speed: 0,
            maxSpeed: 10,
            acceleration: 0.25,
            brake: 0.4,
            deceleration: 0.08,
            turnSpeed: 0.05,
            angle: 0
        };

        const track = {
            centerX: canvas.width / 2,
            innerRadius: 150,
            outerRadius: 280,
            roadWidth: 130
        };
        
        let checkpoints = [];

        function initCheckpoints() {
            checkpoints = [
                {angle: -Math.PI / 2, passed: false},
                {angle: 0, passed: false},
                {angle: Math.PI / 2, passed: false},
                {angle: Math.PI, passed: false}
            ];
        }

        function positionCarAtStart() {
            const radius = track.innerRadius + track.roadWidth / 2;
            const startAngle = -Math.PI / 2;
            const carCenterX = track.centerX + Math.cos(startAngle) * radius;
            const carCenterY = canvas.height / 2 + Math.sin(startAngle) * radius;

            car.x = carCenterX - car.width / 2;
            car.y = carCenterY - car.height / 2;
            car.angle = Math.PI / 2;
            car.speed = 0;
        }
        
        function drawTrack() {
            // Tráva
            ctx.fillStyle = '#2d5016';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Vnější okraj
            ctx.fillStyle = '#8B4513';
            ctx.beginPath();
            ctx.arc(track.centerX, canvas.height / 2, track.outerRadius, 0, Math.PI * 2);
            ctx.fill();
            
            // Silnice
            ctx.fillStyle = '#4a4a4a';
            ctx.beginPath();
            ctx.arc(track.centerX, canvas.height / 2, track.outerRadius - 10, 0, Math.PI * 2);
            ctx.fill();
            
            // Vnitřní tráva
            ctx.fillStyle = '#2d5016';
            ctx.beginPath();
            ctx.arc(track.centerX, canvas.height / 2, track.innerRadius, 0, Math.PI * 2);
            ctx.fill();
            
            // Bílé čáry
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.setLineDash([20, 20]);
            ctx.beginPath();
            ctx.arc(track.centerX, canvas.height / 2, track.innerRadius + track.roadWidth / 2, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Start/cíl
            const startAngle = -Math.PI / 2;
            const startX = track.centerX + Math.cos(startAngle) * (track.innerRadius + track.roadWidth / 2);
            const startY = canvas.height / 2 + Math.sin(startAngle) * (track.innerRadius + track.roadWidth / 2);
            
            for (let i = 0; i < 10; i++) {
                ctx.fillStyle = i % 2 === 0 ? '#fff' : '#000';
                const angle = startAngle + (i - 5) * 0.05;
                const x = track.centerX + Math.cos(angle) * (track.innerRadius + 10);
                const y = canvas.height / 2 + Math.sin(angle) * (track.innerRadius + 10);
                const x2 = track.centerX + Math.cos(angle) * (track.outerRadius - 10);
                const y2 = canvas.height / 2 + Math.sin(angle) * (track.outerRadius - 10);
                
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x2, y2);
                ctx.lineWidth = 10;
                ctx.stroke();
            }
        }
        
        function drawCar() {
            ctx.save();
            ctx.translate(car.x + car.width / 2, car.y + car.height / 2);
            ctx.rotate(car.angle);

            // Stín
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(-car.width / 2 + 5, -car.height / 2 + 5, car.width, car.height);
            
            // Tělo auta
            ctx.fillStyle = '#FF0000';
            ctx.fillRect(-car.width / 2, -car.height / 2, car.width, car.height);
            
            // Pruhy
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(-car.width / 2, -car.height / 2 + 10, car.width, 8);
            ctx.fillRect(-car.width / 2, -car.height / 2 + car.height - 18, car.width, 8);
            
            // Kokpit
            ctx.fillStyle = '#000';
            ctx.fillRect(-car.width / 2 + 10, -car.height / 2 + 20, car.width - 20, 25);
            
            // Číslo
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('1', 0, -car.height / 2 + 65);
            
            ctx.restore();
        }
        
        function updateCar() {
            if (!raceStarted) return;

            // Akcelerace a brždění
            if (keys['ArrowUp']) {
                car.speed = Math.min(car.speed + car.acceleration, car.maxSpeed);
            } else {
                car.speed = Math.max(car.speed - car.deceleration, 0);
            }

            if (keys['ArrowDown']) {
                car.speed = Math.max(car.speed - car.brake, 0);
            }

            // Řízení je efektivnější při vyšší rychlosti
            if (car.speed > 0.1) {
                const turnModifier = 0.6 + (car.speed / car.maxSpeed) * 0.4;
                if (keys['ArrowLeft']) {
                    car.angle -= car.turnSpeed * turnModifier;
                }
                if (keys['ArrowRight']) {
                    car.angle += car.turnSpeed * turnModifier;
                }
            }

            // Pohyb auta
            car.x += Math.sin(car.angle) * car.speed;
            car.y -= Math.cos(car.angle) * car.speed;

            const carCenterX = car.x + car.width / 2;
            const carCenterY = car.y + car.height / 2;
            const dx = carCenterX - track.centerX;
            const dy = carCenterY - canvas.height / 2;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < track.innerRadius + 15 || distance > track.outerRadius - 20) {
                crash();
                return;
            }

            const trackAngle = Math.atan2(dy, dx);
            checkCheckpoints(trackAngle);
        }

        function checkCheckpoints(angle) {
            const normalizedAngle = ((angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);

            checkpoints.forEach((checkpoint) => {
                const checkAngle = ((checkpoint.angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
                const diff = Math.abs(normalizedAngle - checkAngle);
                const shortestDiff = Math.min(diff, Math.PI * 2 - diff);

                if (shortestDiff < 0.25 && !checkpoint.passed) {
                    checkpoint.passed = true;
                    checkpointsPassed++;

                    if (checkpointsPassed === checkpoints.length) {
                        if (lap === 3) {
                            finishRace();
                        } else {
                            lap++;
                            checkpointsPassed = 0;
                            initCheckpoints();
                            document.getElementById('lap').textContent = lap;
                        }
                    }
                }
            });
        }

        function updateStats() {
            if (raceStarted) {
                time += 0.016;
                document.getElementById('time').textContent = time.toFixed(2);
                document.getElementById('speed').textContent = Math.round(car.speed * 35);
                speedTotal += car.speed;
                speedSamples++;
            }
        }
        
        function crash() {
            gameRunning = false;
            raceStarted = false;
            document.getElementById('crashTime').textContent = time.toFixed(2);
            document.getElementById('crashLaps').textContent = lap - 1;
            document.getElementById('gameOver').style.display = 'block';
        }
        
        function finishRace() {
            gameRunning = false;
            raceStarted = false;
            document.getElementById('finalTime').textContent = time.toFixed(2);
            const averageSpeed = speedSamples ? Math.round((speedTotal / speedSamples) * 35) : 0;
            document.getElementById('avgSpeed').textContent = averageSpeed;
            document.getElementById('lap').textContent = '3';
            document.getElementById('finished').style.display = 'block';
        }
        
        function draw() {
            drawTrack();
            drawCar();
        }
        
        function gameLoop() {
            updateCar();
            updateStats();
            draw();
            if (gameRunning) {
                requestAnimationFrame(gameLoop);
            }
        }
        
        function startCountdown() {
            const countdownEl = document.getElementById('countdown');
            let count = 3;
            
            countdownEl.style.display = 'block';
            countdownEl.textContent = count;
            
            const countInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownEl.textContent = count;
                } else if (count === 0) {
                    countdownEl.textContent = 'GO!';
                    raceStarted = true;
                } else {
                    countdownEl.style.display = 'none';
                    clearInterval(countInterval);
                }
            }, 1000);
        }
        
        function startRace() {
            gameRunning = true;
            raceStarted = false;
            time = 0;
            lap = 1;
            checkpointsPassed = 0;
            speedTotal = 0;
            speedSamples = 0;
            car.speed = 0;
            positionCarAtStart();

            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('finished').style.display = 'none';
            document.getElementById('time').textContent = '0.00';
            document.getElementById('lap').textContent = '1';
            document.getElementById('speed').textContent = '0';

            initCheckpoints();
            startCountdown();
            gameLoop();
        }
        
        function goHome() {
            window.location.href = 'index.html';
        }
        
        // Ovládání
        const keys = {};
        
        document.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
            }
            keys[e.key] = true;
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Počáteční nastavení
        positionCarAtStart();
        initCheckpoints();
        draw();
    </script>
</body>
</html>

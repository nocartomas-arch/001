<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #4ec0ca 0%, #87ceeb 100%);
            font-family: 'Arial Black', Arial, sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            text-align: center;
            position: relative;
        }
        h1 {
            color: #FFD700;
            font-size: 3.5em;
            margin-bottom: 10px;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.5);
        }
        #score {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 72px;
            color: white;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.5);
            z-index: 10;
            pointer-events: none;
        }
        #gameCanvas {
            border: 5px solid #8B4513;
            background: linear-gradient(to bottom, #4ec0ca 0%, #87ceeb 50%, #deb887 100%);
            display: block;
            margin: 20px auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            cursor: pointer;
        }
        #startScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 100;
        }
        #startScreen h2 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
        }
        #gameOver {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(139, 69, 19, 0.95);
            padding: 40px;
            border: 5px solid #FFD700;
            border-radius: 20px;
            color: white;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            z-index: 100;
        }
        #gameOver h2 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #FFD700;
        }
        .game-stats {
            font-size: 28px;
            margin: 20px 0;
        }
        button {
            font-size: 22px;
            padding: 15px 40px;
            margin: 10px;
            cursor: pointer;
            background: #FFD700;
            color: #8B4513;
            border: 3px solid #8B4513;
            border-radius: 15px;
            font-weight: bold;
            box-shadow: 0 5px 0 #B8860B;
            transition: all 0.1s;
        }
        button:hover {
            background: #FFA500;
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #B8860B;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #B8860B;
        }
        #instructions {
            color: white;
            font-size: 18px;
            margin: 15px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .medal {
            font-size: 64px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <h1>🐦 FLAPPY BIRD 🐦</h1>
        <div id="score">0</div>
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div id="instructions">🖱️ KLIKNI nebo MEZERNÍK pro létání | Vyhni se trubkám!</div>
        
        <div id="startScreen">
            <h2>🎮 FLAPPY BIRD 🎮</h2>
            <p style="font-size: 24px; margin: 20px 0;">Klikni pro začátek!</p>
        </div>
        
        <div id="gameOver">
            <h2>💥 KONEC HRY! 💥</h2>
            <div class="game-stats">
                🏆 Skóre: <span id="finalScore">0</span><br>
                ⭐ Rekord: <span id="bestScore">0</span>
            </div>
            <div class="medal" id="medal"></div>
            <button onclick="restart()">🔄 ZKUSIT ZNOVU</button>
            <button onclick="goHome()">🏠 MENU</button>
        </div>
        
        <button onclick="goHome()" style="margin-top: 20px;">🏠 MENU</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let gameStarted = false;
        let gameRunning = false;
        let score = 0;
        let bestScore = localStorage.getItem('flappyBestScore') || 0;
        
        // Ptáček
        const bird = {
            x: 80,
            y: canvas.height / 2,
            radius: 20,
            velocity: 0,
            gravity: 0.6,
            jump: -10,
            rotation: 0
        };
        
        // Trubky
        let pipes = [];
        const pipeWidth = 60;
        const pipeGap = 150;
        const pipeSpeed = 3;
        
        // Částice
        let particles = [];
        
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.velocityX = (Math.random() - 0.5) * 8;
                this.velocityY = (Math.random() - 0.5) * 8;
                this.size = Math.random() * 6 + 3;
                this.color = ['#FFD700', '#FFA500', '#FF6347'][Math.floor(Math.random() * 3)];
                this.life = 30;
            }
            
            update() {
                this.x += this.velocityX;
                this.y += this.velocityY;
                this.velocityY += 0.3;
                this.life--;
            }
            
            draw() {
                ctx.globalAlpha = this.life / 30;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }
        
        function createPipe() {
            const minHeight = 50;
            const maxHeight = canvas.height - pipeGap - minHeight - 100;
            const height = Math.random() * (maxHeight - minHeight) + minHeight;
            
            pipes.push({
                x: canvas.width,
                top: height,
                bottom: height + pipeGap,
                scored: false
            });
        }
        
        function drawBird() {
            ctx.save();
            ctx.translate(bird.x, bird.y);
            ctx.rotate(bird.rotation);
            
            // Tělo
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Křídlo
            ctx.fillStyle = '#FFA500';
            ctx.beginPath();
            ctx.ellipse(-5, 5, 15, 10, -0.3, 0, Math.PI * 2);
            ctx.fill();
            
            // Oko
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(10, -5, 6, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(12, -5, 3, 0, Math.PI * 2);
            ctx.fill();
            
            // Zobák
            ctx.fillStyle = '#FF6347';
            ctx.beginPath();
            ctx.moveTo(15, 0);
            ctx.lineTo(25, -2);
            ctx.lineTo(25, 2);
            ctx.closePath();
            ctx.fill();
            
            ctx.restore();
        }
        
        function drawPipes() {
            ctx.fillStyle = '#2ecc71';
            ctx.strokeStyle = '#27ae60';
            ctx.lineWidth = 4;
            
            pipes.forEach(pipe => {
                // Horní trubka
                ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top);
                ctx.strokeRect(pipe.x, 0, pipeWidth, pipe.top);
                
                // Dolní trubka
                ctx.fillRect(pipe.x, pipe.bottom, pipeWidth, canvas.height - pipe.bottom);
                ctx.strokeRect(pipe.x, pipe.bottom, pipeWidth, canvas.height - pipe.bottom);
                
                // Okraje trubek
                ctx.fillStyle = '#27ae60';
                ctx.fillRect(pipe.x - 5, pipe.top - 25, pipeWidth + 10, 25);
                ctx.fillRect(pipe.x - 5, pipe.bottom, pipeWidth + 10, 25);
                ctx.fillStyle = '#2ecc71';
            });
        }
        
        function drawBackground() {
            // Mraky
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            for (let i = 0; i < 3; i++) {
                const x = (i * 150 + Date.now() * 0.01) % canvas.width;
                const y = 50 + i * 40;
                
                ctx.beginPath();
                ctx.arc(x, y, 20, 0, Math.PI * 2);
                ctx.arc(x + 20, y, 25, 0, Math.PI * 2);
                ctx.arc(x + 40, y, 20, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Země
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, canvas.height - 50, canvas.width, 50);
            
            ctx.fillStyle = '#90EE90';
            for (let i = 0; i < canvas.width; i += 20) {
                ctx.fillRect(i, canvas.height - 55, 10, 5);
            }
        }
        
        function drawParticles() {
            particles.forEach(p => p.draw());
        }
        
        function updateBird() {
            bird.velocity += bird.gravity;
            bird.y += bird.velocity;
            
            // Rotace podle rychlosti
            bird.rotation = Math.min(Math.max(bird.velocity * 0.05, -0.5), 0.5);
            
            // Kontrola kolize se zemí/stropem
            if (bird.y + bird.radius > canvas.height - 50 || bird.y - bird.radius < 0) {
                endGame();
            }
        }
        
        function updatePipes() {
            pipes.forEach((pipe, index) => {
                pipe.x -= pipeSpeed;
                
                // Kontrola skóre
                if (!pipe.scored && pipe.x + pipeWidth < bird.x) {
                    pipe.scored = true;
                    score++;
                    document.getElementById('score').textContent = score;
                }
                
                // Kontrola kolize
                if (
                    bird.x + bird.radius > pipe.x &&
                    bird.x - bird.radius < pipe.x + pipeWidth &&
                    (bird.y - bird.radius < pipe.top || bird.y + bird.radius > pipe.bottom)
                ) {
                    endGame();
                }
                
                // Odstranění trubky mimo obrazovku
                if (pipe.x + pipeWidth < 0) {
                    pipes.splice(index, 1);
                }
            });
        }
        
        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }
        
        function createExplosion(x, y) {
            for (let i = 0; i < 20; i++) {
                particles.push(new Particle(x, y));
            }
        }
        
        let frameCount = 0;
        
        function update() {
            if (!gameRunning) return;
            
            frameCount++;
            
            updateBird();
            updatePipes();
            updateParticles();
            
            // Vytvoření nové trubky
            if (frameCount % 90 === 0) {
                createPipe();
            }
        }
        
        function draw() {
            drawBackground();
            drawPipes();
            drawParticles();
            drawBird();
        }
        
        function gameLoop() {
            update();
            draw();
            if (gameRunning) {
                requestAnimationFrame(gameLoop);
            }
        }
        
        function flap() {
            if (!gameStarted) {
                startGame();
            } else if (gameRunning) {
                bird.velocity = bird.jump;
            }
        }
        
        function startGame() {
            gameStarted = true;
            gameRunning = true;
            score = 0;
            frameCount = 0;
            pipes = [];
            particles = [];
            
            bird.y = canvas.height / 2;
            bird.velocity = 0;
            bird.rotation = 0;
            
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('score').textContent = '0';
            
            gameLoop();
        }
        
        function endGame() {
            gameRunning = false;
            createExplosion(bird.x, bird.y);
            
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('flappyBestScore', bestScore);
            }
            
            let medal = '';
            if (score >= 40) medal = '🥇';
            else if (score >= 30) medal = '🥈';
            else if (score >= 20) medal = '🥉';
            
            document.getElementById('finalScore').textContent = score;
            document.getElementById('bestScore').textContent = bestScore;
            document.getElementById('medal').textContent = medal;
            
            setTimeout(() => {
                document.getElementById('gameOver').style.display = 'block';
            }, 500);
        }
        
        function restart() {
            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('startScreen').style.display = 'block';
            gameStarted = false;
            draw();
        }
        
        function goHome() {
            window.location.href = 'index.html';
        }
        
        // Ovládání
        canvas.addEventListener('click', flap);
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                flap();
            }
        });
        
        // Počáteční vykreslení
        draw();
    </script>
</body>
</html>

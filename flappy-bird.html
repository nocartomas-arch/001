<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Flappy Bird – Arrow Edition</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:flex;justify-content:center;align-items:center;
    background:linear-gradient(180deg,#5fd3e1 0%,#8fe3ff 60%,#b9f1ff 100%);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    overflow:hidden
  }
  #wrap{position:relative;text-align:center}
  h1{color:#ffc400;text-shadow:0 4px 14px rgba(0,0,0,.35);font-weight:900;letter-spacing:.03em}
  #scoreHud{
    position:absolute;inset:12px auto auto 50%;transform:translateX(-50%);
    font-size:58px;font-weight:900;color:#fff;text-shadow:0 4px 12px rgba(0,0,0,.6);
    pointer-events:none;z-index:5
  }
  canvas{
    width:1000px;height:560px; /* velké okno na šířku */
    border:6px solid #7a4a23;border-radius:14px;
    box-shadow:0 18px 60px rgba(0,0,0,.45);
    background:linear-gradient(#74d9ff,#c6f4ff 70%,#8bd17a 70%,#7ec86d 74%,#7a4a23 74%);
    display:block
  }
  #help{margin-top:10px;color:#0b4771;font-weight:700;text-shadow:0 1px 0 #dff7ff}
  .panel{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    background:rgba(0,0,0,.65);color:#fff;border:3px solid #ffc400;border-radius:16px;
    padding:28px 34px;text-align:center;z-index:6;backdrop-filter:saturate(140%) blur(2px)
  }
  .panel h2{font-size:40px;margin-bottom:10px;color:#ffc400}
  .btn{
    margin-top:16px;background:#ffc400;border:0;border-radius:12px;padding:12px 22px;
    font-weight:900;cursor:pointer;color:#5b3b16;box-shadow:0 5px 0 #d59f00
  }
  .btn:active{transform:translateY(1px);box-shadow:0 3px 0 #d59f00}
</style>
</head>
<body>
  <div id="wrap">
    <h1>🐦 FLAPPY BIRD – ARROW EDITION 🐦</h1>
    <div id="scoreHud">0</div>
    <canvas id="game" width="1000" height="560"></canvas>
    <div id="start" class="panel">
      <h2>FLAPPY BIRD</h2>
      <div style="opacity:.9;margin:6px 0 10px;">Šipky: ↑ ↓ ← → &nbsp;|&nbsp; Space / Klik: krátký boost</div>
      <button class="btn" id="btnStart">▶ Hrát</button>
    </div>
    <div id="over" class="panel" style="display:none">
      <h2>Konec hry</h2>
      <div>Skóre: <b id="finalScore">0</b> &nbsp; | &nbsp; Rekord: <b id="best">0</b></div>
      <button class="btn" id="btnAgain">↻ Zkusit znovu</button>
    </div>
    <div id="help">Ovládání: šipky pohyb | vyhni se asteroidům a laserům</div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const scoreHud = document.getElementById('scoreHud');
  const startPanel = document.getElementById('start');
  const overPanel  = document.getElementById('over');
  const finalScore = document.getElementById('finalScore');
  const bestOut    = document.getElementById('best');

  const W = canvas.width, H = canvas.height;
  let running=false, started=false, frame=0, score=0, best=+localStorage.getItem('flappyArrowBest')||0;

  // hráč
  const bird = {
    x: 140, y: H/2, r: 18,
    vx: 0, vy: 0,
    accel: 0.55,
    maxSpd: 6,
    drag: 0.90
  };

  // překážky
  const obstacles = []; // {type:'asteroid'|'laser', x,y, r  ||  x,y,w,h, vy?, scored }
  const stars = [];
  for(let i=0;i<120;i++){
    stars.push({x:Math.random()*W, y:Math.random()*H, s:Math.random()*2+0.5, spd:0.2+Math.random()*0.4});
  }

  const keys = {};
  addEventListener('keydown', e => { keys[e.key] = true; if(e.code==='Space'){e.preventDefault(); boost();} });
  addEventListener('keyup', e => { keys[e.key] = false; });

  canvas.addEventListener('mousedown', boost);
  document.getElementById('btnStart').onclick = () => start();
  document.getElementById('btnAgain').onclick = () => start();

  function reset(){
    bird.x=140; bird.y=H/2; bird.vx=0; bird.vy=0;
    obstacles.length=0; score=0; frame=0;
    scoreHud.textContent='0';
  }

  function start(){
    started=true; running=true;
    startPanel.style.display='none';
    overPanel.style.display='none';
    reset();
    loop();
  }

  function gameOver(){
    running=false;
    finalScore.textContent = score;
    if(score>best){ best=score; localStorage.setItem('flappyArrowBest',best); }
    bestOut.textContent = best;
    overPanel.style.display='block';
  }

  function boost(){
    if(!started){ start(); return; }
    if(!running) return;
    // krátký impuls dopředu a nahoru
    bird.vy -= 2.0;
    bird.vx += 1.2;
  }

  function spawnObstacle(){
    // náhodně asteroid (kruh) nebo laser (vert. svazek)
    const t = Math.random() < 0.6 ? 'asteroid' : 'laser';

    if(t==='asteroid'){
      const r = 16 + Math.random()*22;
      const y = 40 + Math.random()*(H-80);
      const vy = (Math.random()<0.5? -1:1)*(Math.random()*0.8);
      obstacles.push({
        type:'asteroid', x: W+40, y, r, vx: 3+Math.random()*2, vy, spin: Math.random()*Math.PI
      });
    }else{
      // laser – úzký sloupec, pomalu se vlní nahoru/dolů
      const gapY = 60 + Math.random()*(H-120);
      const h = 120 + Math.random()*140; // délka laseru
      const dir = Math.random()<0.5? -1:1;
      obstacles.push({
        type:'laser', x: W+40, y: gapY - h/2, w: 18, h,
        vx: 4, vy: 1.2*dir, oscillate: (Math.random()*0.02 + 0.01), base: gapY
      });
    }
  }

  function update(){
    // hvězdy/parallax
    stars.forEach(s=>{
      s.x -= s.spd;
      if(s.x<-2){ s.x=W+2; s.y=Math.random()*H; }
    });

    // vstup – šipky
    if(keys['ArrowUp'])    bird.vy -= bird.accel;
    if(keys['ArrowDown'])  bird.vy += bird.accel;
    if(keys['ArrowLeft'])  bird.vx -= bird.accel;
    if(keys['ArrowRight']) bird.vx += bird.accel;

    // omezení rychlosti + tření
    bird.vx = Math.max(-bird.maxSpd, Math.min(bird.maxSpd, bird.vx));
    bird.vy = Math.max(-bird.maxSpd, Math.min(bird.maxSpd, bird.vy));
    bird.vx *= bird.drag; bird.vy *= bird.drag;

    bird.x += bird.vx; bird.y += bird.vy;

    // držet v okně (lehké odrazy)
    if(bird.x < bird.r){ bird.x = bird.r; bird.vx *= -0.4; }
    if(bird.x > W-bird.r){ bird.x = W-bird.r; bird.vx *= -0.4; }
    if(bird.y < bird.r){ bird.y = bird.r; bird.vy *= -0.4; }
    if(bird.y > H- bird.r - 40){ bird.y = H - bird.r - 40; bird.vy *= -0.4; } // "zem"

    // překážky
    for(let i=obstacles.length-1;i>=0;i--){
      const o = obstacles[i];
      o.x -= o.vx;

      if(o.type==='asteroid'){
        o.y += o.vy;
        // jemný odraz od hran
        if(o.y<30+o.r || o.y>H-60-o.r) o.vy*=-1;
        o.spin += 0.06;
        // kolize (kruhová)
        const dx = bird.x - o.x, dy = bird.y - o.y;
        if(Math.hypot(dx,dy) < bird.r + o.r - 2) return gameOver();
        // skóre
        if(!o.scored && o.x+o.r < bird.x - bird.r){ o.scored=true; score++; scoreHud.textContent=score; }
        if(o.x < -60) obstacles.splice(i,1);
      }else{
        // laser jemně kmitá kolem base
        o.y = o.base - o.h/2 + Math.sin(frame*o.oscillate)*60;
        // kolize obdélník–kruh
        const closestX = Math.max(o.x, Math.min(bird.x, o.x+o.w));
        const closestY = Math.max(o.y, Math.min(bird.y, o.y+o.h));
        const dx = bird.x - closestX, dy = bird.y - closestY;
        if(dx*dx + dy*dy < bird.r*bird.r) return gameOver();
        if(!o.scored && o.x+o.w < bird.x - bird.r){ o.scored=true; score++; scoreHud.textContent=score; }
        if(o.x + o.w < -20) obstacles.splice(i,1);
      }
    }

    // spawn
    if(frame%85===0) spawnObstacle();
    frame++;
  }

  function draw(){
    // pozadí: obloha je na canvasu – přidáme mraky a trávu
    // mraky
    ctx.save();
    ctx.clearRect(0,0,W,H);
    ctx.globalAlpha = .85;
    for(let i=0;i<3;i++){
      const cx = (frame*0.6 + i*300) % (W+200) - 100;
      const cy = 60 + i*40;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(cx,cy,22,0,Math.PI*2);
      ctx.arc(cx+24,cy,28,0,Math.PI*2);
      ctx.arc(cx+52,cy,22,0,Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // hvězdy/parallax tečky
    ctx.fillStyle='rgba(255,255,255,.8)';
    stars.forEach(s=>ctx.fillRect(s.x,s.y,s.s,s.s));

    // překážky
    obstacles.forEach(o=>{
      if(o.type==='asteroid'){
        const g = ctx.createRadialGradient(o.x-6,o.y-6,6, o.x,o.y,o.r);
        g.addColorStop(0,'#ffe9a8'); g.addColorStop(.45,'#f9b44f'); g.addColorStop(1,'#df7d1d');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,Math.PI*2); ctx.fill();
        // „krátery“
        ctx.fillStyle='rgba(0,0,0,.2)';
        for(let k=0;k<3;k++){
          const ang = o.spin + k*2.1;
          ctx.beginPath(); ctx.arc(o.x+Math.cos(ang)*o.r*0.5, o.y+Math.sin(ang)*o.r*0.45, o.r*0.18, 0, Math.PI*2); ctx.fill();
        }
      }else{
        // laser
        const grd = ctx.createLinearGradient(o.x,o.y,o.x+o.w,o.y);
        grd.addColorStop(0,'#ff5f5f'); grd.addColorStop(1,'#ffd2d2');
        ctx.fillStyle=grd;
        ctx.shadowColor='#ff9c9c'; ctx.shadowBlur=18;
        ctx.fillRect(o.x,o.y,o.w,o.h);
        ctx.shadowBlur=0;
        // výstražné uzávěry
        ctx.fillStyle='#b33';
        ctx.fillRect(o.x-6, o.y-12, o.w+12, 10);
        ctx.fillRect(o.x-6, o.y+o.h+2, o.w+12, 10);
      }
    });

    // ptačí postava
    drawBird();
    // tráva v popředí
    ctx.fillStyle = '#6bb85f';
    for(let i=0;i<W;i+=20) ctx.fillRect(i,H-46,10,6);
    ctx.restore();
  }

  function drawBird(){
    const {x,y,r} = bird;
    ctx.save(); ctx.translate(x,y); ctx.rotate(bird.vy*0.08);

    // tělo
    ctx.fillStyle='#ffd64a';
    ctx.beginPath(); ctx.ellipse(0,0,r+6,r,0,0,Math.PI*2); ctx.fill();

    // křídlo
    ctx.fillStyle='#ffac33';
    ctx.beginPath(); ctx.ellipse(-4,4,r*0.7,r*0.45,-0.2,0,Math.PI*2); ctx.fill();

    // oči
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(10,-6,r*0.28,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(12,-6,r*0.14,0,Math.PI*2); ctx.fill();

    // zobák
    ctx.fillStyle='#ff6b4a';
    ctx.beginPath(); ctx.moveTo(r-2,0); ctx.lineTo(r+12,-4); ctx.lineTo(r+12,4); ctx.closePath(); ctx.fill();

    ctx.restore();
  }

  function loop(){
    if(!running) return;
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // první statický render pozadí/ptáka
  draw();
})();
</script>
</body>
</html>

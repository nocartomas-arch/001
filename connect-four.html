<!DOCTYPE html><html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Connect Four</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#101822;color:#fff;font-family:Segoe UI,Arial}
  .wrap{text-align:center}
  .board{--cols:7;--rows:6;display:grid;grid-template-columns:repeat(var(--cols),72px);gap:10px;background:#0b2a5c;padding:14px;border-radius:18px;box-shadow:0 20px 40px #0006}
  .cell{width:72px;height:72px;background:#0f4aa8;border-radius:50%;position:relative;box-shadow:inset 0 0 0 8px #0c3d8b}
  .disc{position:absolute;inset:8px;border-radius:50%;background:#222;transition:transform .15s}
  .disc.red{background:#e74c3c}.disc.yellow{background:#f1c40f}
  .row{display:contents}
  .top{display:grid;grid-template-columns:repeat(7,72px);gap:10px;justify-content:center;margin:10px auto}
  .drop{height:26px;border-radius:6px;background:#2ecc71;cursor:pointer}
  .drop:hover{filter:brightness(1.1)}
  .panel{margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  button{padding:8px 14px;border:0;border-radius:8px;background:#667eea;color:#fff;font-weight:700;cursor:pointer}
</style></head><body>
<div class="wrap">
  <h1>🔴🟡 Connect Four</h1>
  <p>Na tahu: <b id="player">Červený</b></p>
  <div class="top" id="top"></div>
  <div class="board" id="board"></div>
  <div class="panel"><button id="reset">🔄 Nová hra</button></div>
</div>
<script>
  const COLS=7, ROWS=6;
  const boardEl=document.getElementById('board');
  const topEl=document.getElementById('top');
  const playerEl=document.getElementById('player');
  const resetBtn=document.getElementById('reset');
  let grid, current=1, gameOver=false; // 1=red, 2=yellow

  function init(){
    grid=Array.from({length:ROWS},()=>Array(COLS).fill(0));
    boardEl.innerHTML=''; topEl.innerHTML='';
    for(let r=0;r<ROWS;r++){
      for(let c=0;c<COLS;c++){
        const cell=document.createElement('div'); cell.className='cell';
        const disc=document.createElement('div'); disc.className='disc'; disc.style.transform='scale(0)';
        cell.appendChild(disc); boardEl.appendChild(cell);
      }
    }
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div'); d.className='drop'; d.title=`Vhoď do sloupce ${c+1}`;
      d.addEventListener('click',()=>drop(c)); topEl.appendChild(d);
    }
    current=1; gameOver=false; updateTurn();
  }
  function updateTurn(){playerEl.textContent=current===1?'Červený':'Žlutý';}
  function drop(col){
    if(gameOver) return;
    let row=ROWS-1; while(row>=0 && grid[row][col]!==0) row--;
    if(row<0) return;
    grid[row][col]=current;
    const idx=row*COLS+col; const disc=boardEl.children[idx].firstChild;
    disc.className='disc '+(current===1?'red':'yellow');
    requestAnimationFrame(()=>disc.style.transform='scale(1)');
    if(checkWin(row,col,current)){gameOver=true; setTimeout(()=>alert(`${current===1?'Červený':'Žlutý'} vyhrává!`),10); return;}
    if(grid.every(r=>r.every(v=>v!==0))){gameOver=true; alert('Remíza!'); return;}
    current=3-current; updateTurn();
  }
  function checkWin(r,c,p){
    const dirs=[[1,0],[0,1],[1,1],[1,-1]];
    for(const [dr,dc] of dirs){
      let count=1;
      for(const s of [-1,1]){
        let rr=r+dr*s, cc=c+dc*s;
        while(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS&&grid[rr][cc]===p){count++; rr+=dr*s; cc+=dc*s;}
      }
      if(count>=4) return true;
    } return false;
  }
  resetBtn.onclick=init; init();
</script></body></html>

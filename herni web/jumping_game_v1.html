<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skákací hra</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            font-family: Arial, sans-serif;
        }
        #gameContainer {
            text-align: center;
        }
        #gameCanvas {
            border: 3px solid #333;
            background: linear-gradient(to bottom, #87CEEB 0%, #90EE90 80%, #8B7355 100%);
            display: block;
            margin: 0 auto;
        }
        #score {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin: 10px 0;
        }
        #instructions {
            font-size: 16px;
            color: #555;
            margin: 10px 0;
        }
        #gameOver {
            display: none;
            font-size: 32px;
            font-weight: bold;
            color: #ff0000;
            margin: 10px 0;
        }
        button {
            font-size: 18px;
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <h1>🎮 Skákací hra 🎮</h1>
        <div id="score">Skóre: 0</div>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="instructions">Stiskni MEZERNÍK pro skok</div>
        <div id="gameOver">KONEC HRY!</div>
        <button id="restartBtn" style="display:none;">Restart</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const gameOverEl = document.getElementById('gameOver');
        const restartBtn = document.getElementById('restartBtn');

        let score = 0;
        let gameRunning = true;
        let frameCount = 0;

        // Panáček
        const player = {
            x: 100,
            y: 300,
            width: 40,
            height: 50,
            velocityY: 0,
            jumping: false,
            gravity: 0.6,
            jumpPower: -13
        };

        // Překážky
        const obstacles = [];
        const obstacleTypes = ['🐕', '🌵', '👾', '🦖', '🌳', '🐍', '🦂', '🍄'];

        function createObstacle() {
            const type = obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];
            obstacles.push({
                x: canvas.width,
                y: 310,
                width: 40,
                height: 40,
                speed: 5,
                emoji: type
            });
        }

        function drawPlayer() {
            ctx.font = '50px Arial';
            ctx.fillText('🏃', player.x, player.y + player.height);
        }

        function drawObstacles() {
            ctx.font = '40px Arial';
            obstacles.forEach(obs => {
                ctx.fillText(obs.emoji, obs.x, obs.y + obs.height);
            });
        }

        function drawGround() {
            ctx.fillStyle = '#8B7355';
            ctx.fillRect(0, 350, canvas.width, 50);
            
            // Tráva
            ctx.fillStyle = '#90EE90';
            for (let i = 0; i < canvas.width; i += 20) {
                ctx.fillRect(i, 345, 10, 5);
            }
        }

        function update() {
            if (!gameRunning) return;

            frameCount++;
            
            // Gravitace
            player.velocityY += player.gravity;
            player.y += player.velocityY;

            // Kolize se zemí
            if (player.y >= 300) {
                player.y = 300;
                player.velocityY = 0;
                player.jumping = false;
            }

            // Vytvoření nové překážky
            if (frameCount % 100 === 0) {
                createObstacle();
                score++;
                scoreEl.textContent = `Skóre: ${score}`;
            }

            // Aktualizace překážek
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= obstacles[i].speed;

                // Detekce kolize
                if (
                    player.x < obstacles[i].x + obstacles[i].width &&
                    player.x + player.width > obstacles[i].x &&
                    player.y < obstacles[i].y + obstacles[i].height &&
                    player.y + player.height > obstacles[i].y
                ) {
                    endGame();
                }

                // Odstranění překážky mimo obrazovku
                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Obloha
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#87CEEB');
            gradient.addColorStop(0.8, '#90EE90');
            gradient.addColorStop(1, '#8B7355');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            drawGround();
            drawPlayer();
            drawObstacles();
        }

        function gameLoop() {
            update();
            draw();
            if (gameRunning) {
                requestAnimationFrame(gameLoop);
            }
        }

        function jump() {
            if (!player.jumping && player.y >= 300) {
                player.velocityY = player.jumpPower;
                player.jumping = true;
            }
        }

        function endGame() {
            gameRunning = false;
            gameOverEl.style.display = 'block';
            restartBtn.style.display = 'inline-block';
        }

        function restart() {
            score = 0;
            frameCount = 0;
            obstacles.length = 0;
            player.y = 300;
            player.velocityY = 0;
            player.jumping = false;
            gameRunning = true;
            gameOverEl.style.display = 'none';
            restartBtn.style.display = 'none';
            scoreEl.textContent = 'Skóre: 0';
            gameLoop();
        }

        // Ovládání
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && gameRunning) {
                e.preventDefault();
                jump();
            }
        });

        canvas.addEventListener('click', () => {
            if (gameRunning) jump();
        });

        restartBtn.addEventListener('click', restart);

        // Start hry
        gameLoop();
    </script>
</body>
</html>
